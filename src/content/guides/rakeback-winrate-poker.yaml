  fr:
    title: "Impact du rakeback sur le winrate au poker : mathématiques, variance et profit caché"
    description: >-
      Comment le rakeback influe sur le winrate et le profit réel au poker : nous décortiquons le winrate (bb/100), la
      variance et l'écart-type, la charge de rake et les modèles de rakeback — avec formules et exemples de calcul.
    body: |-
      <article>

          <style>
          .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
          .pdh-fx sub{font-size:0.72em}
          .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
          .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
          .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
          .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
        </style>

          <p>Que vous considériez le poker comme un loisir ou comme une source de revenus, votre résultat financier final est déterminé par trois facteurs :</p>
          <ul>
            <li>votre avantage sur vos adversaires — le <strong>winrate</strong> ;</li>
            <li>la <strong>structure du rake</strong> (la commission) à la table de poker ;</li>
            <li>le pourcentage de <strong>rakeback</strong> — la restitution d'une partie de la commission payée.</li>
          </ul>

          <h2>I. La notion de winrate et l'influence de la variance</h2>
          <p>L'avantage sur le champ, exprimé par le winrate, est le plus difficile à calculer. Il dépend d'une multitude de facteurs en perpétuelle évolution, dont le principal est la force des adversaires à la table. De plus, sur de courtes distances, l'influence de la variance est énorme : un winrate statistiquement significatif ne peut être estimé qu'après des dizaines de milliers de mains jouées.</p>
          <p>Le winrate se mesure habituellement en grosses blindes pour 100 mains (<strong>bb/100</strong>). Dans les logiciels d'analyse, il est le plus souvent calculé avant déduction de la commission (pre-rake). Si vous ne connaissez pas votre winrate exact, vous pouvez l'estimer approximativement grâce à cette classification :</p>
          <ul>
            <li><strong>Winrate négatif</strong> — vous jouez moins bien que vos adversaires sur votre limite ;</li>
            <li><strong>0 bb/100</strong> — un jeu à l'équilibre, au niveau de l'adversaire moyen ;</li>
            <li><strong>1–10 bb/100</strong> — un avantage modéré sur le champ ;</li>
            <li><strong>10–20 bb/100 et plus</strong> — un avantage important (en général, lorsqu'on joue régulièrement contre des adversaires faibles).</li>
          </ul>

          <h2>II. L'écart-type et les mathématiques de la distance</h2>
          <p>Pour analyser la volatilité des résultats, on utilise l'écart-type (Standard Deviation, SD). Pour les parties de cash game en No-Limit Hold'em (NLH), il s'élève à environ 100 bb/100, tandis qu'en Pot-Limit Omaha à cinq cartes (PLO5) il grimpe à 200–250 bb/100 en raison de la plus grande densité de fortes combinaisons.</p>
          <p>Il est essentiel de comprendre une différence fondamentale : le winrate croît de manière <strong>linéaire</strong> avec le nombre de mains jouées, tandis que l'écart-type croît proportionnellement à la <strong>racine carrée</strong> de la distance.</p>
          <p>La formule de l'écart-type pour une distance quelconque se présente ainsi :</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD sur N intervalles est égal à SD sur 100 mains, multiplié par la racine carrée de N">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
          <p>où <em>N</em> représente le nombre d'intervalles de 100 mains joués. Il s'agit d'une approximation : elle suppose l'indépendance des tranches de 100 mains, mais pour une estimation pratique, cela reste amplement suffisant.</p>

          <h3>Exemple de calcul (avant rake)</h3>
          <p>Une distance de 10 000 mains au Hold'em correspond au volume qu'un joueur actif accumule en une semaine sur 1 à 2 tables. Puisque le winrate et le SD se calculent sur 100 mains, nous considérons cette distance comme 100 intervalles (<em>N</em> = 100).</p>
          <p>Calculons d'abord l'écart-type pour l'ensemble de la distance :</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD sur 10 000 mains est égal à 100, multiplié par la racine carrée de 100, égale 1000 grosses blindes">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
          <p>Comparons maintenant deux joueurs (le winrate est ici exprimé <strong>avant rake</strong>) :</p>
          <ul>
            <li><strong>Un regular performant, +10 bb/100.</strong> Son espérance mathématique sur la distance est de <strong>+1000 BB</strong>.</li>
            <li><strong>Un amateur perdant, −10 bb/100.</strong> Son espérance mathématique est de <strong>−1000 BB</strong>.</li>
          </ul>
          <p>D'après la règle des intervalles de confiance de la loi normale :</p>
          <table class="pdh-tbl">
            <thead><tr><th>Plage de résultat</th><th>Probabilité</th></tr></thead>
            <tbody>
              <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
              <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
              <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
            </tbody>
          </table>
          <p>Pour le regular performant, avec une probabilité de 68 %, le résultat sur 10 000 mains se situera dans la plage :</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="EV plus ou moins 1 SD est égal à 1000 BB plus ou moins 1000 BB, soit de 0 à 2000 grosses blindes">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
          <p>Autrement dit, même avec un winrate exceptionnel de 10 bb/100, il subsiste environ 16 % de chances (la moitié des 32 % restants) de terminer la semaine dans le rouge. Et inversement : le joueur perdant, avec cette même probabilité de 68 %, affichera un résultat compris entre −2000 et 0 BB — ce qui signifie qu'il a lui aussi environ 16 % de chances de boucler la distance dans le vert. C'est précisément cette particularité mathématique qui maintient les joueurs récréatifs dans l'écosystème du poker.</p>
          <p><strong>Mais tout ceci est le tableau avant déduction du rake.</strong> Ce que la commission en fait fait l'objet de la section suivante.</p>

          <h2>III. La charge de rake : le tueur silencieux du profit</h2>
          <p>Le rake est la commission que la room de poker prélève sur chaque pot ayant atteint le flop (dans certaines rooms, le rake est aussi prélevé au préflop — selon le scénario 3-bet-fold). La charge est déterminée par deux paramètres : le pourcentage de rake et son plafond (cap, exprimé en BB). Plus ces valeurs sont élevées, plus il est difficile de dégager un profit net. Si vous avez besoin des bases — ce que sont le rake et le rakeback et comment ils fonctionnent — commencez par le guide <a href="/fr/guides/rake-and-rakeback-in-poker/">« Le rake et le rakeback au poker »</a>.</p>
          <p>Prenons des paramètres standards pour les limites moyennes : un rake de 5 % et un cap de 5 BB. Selon le style de jeu (tight ou loose), un joueur paie en moyenne environ 10 BB de rake pour 100 mains.</p>
          <p>Revenons à notre regular. Sur 10 000 mains (100 intervalles), le rake engloutit :</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="100 multiplié par 10 grosses blindes est égal à 1000 grosses blindes — la totalité du rake sur 10 000 mains">100 × 10 BB = 1000 BB</div>
          <p>C'est exactement la totalité de son espérance mathématique. Toute la distribution se décale vers le bas de 1000 BB : <strong>l'espérance nette devient nulle</strong>, le couloir réel se transforme en [−1000 ; +1000] BB, et la probabilité de terminer la semaine dans le rouge passe de 16 % à près de <strong>50 %</strong> — autrement dit, un pile ou face. En d'autres termes, un excellent avantage technique de +10 bb/100 <em>avant</em> rake, après déduction de la commission, donne un winrate net d'exactement 0 bb/100. C'est ici que naît le besoin pressant d'un rakeback efficace.</p>

          <h2>IV. Le rakeback comme socle de stabilité financière</h2>
          <p>Le rakeback est la restitution d'une partie de la commission payée directement sur votre compte de jeu. Il existe plusieurs modèles :</p>
          <ul>
            <li><strong>Progressif (rooms centralisées) :</strong> la restitution démarre à 10 % et peut théoriquement atteindre 60–70 %. Mais pour accéder aux statuts élevés, il faut jouer une distance colossale en payant la commission à un taux réduit — ce qui conduit à perdre l'espérance mathématique initiale.</li>
            <li><strong>Statique (<a href="/fr/deals/decentralized/">applications de club décentralisées</a>) :</strong> les clubs proposent une restitution fixe et transparente de 20 % à 50 % dès le premier jour de jeu.</li>
            <li><strong>Par agent (par exemple, NUTS POKER) :</strong> les clubs accordent d'importantes conditions de partenariat aux agents, qui partagent ensuite le rakeback directement avec les joueurs — <a href="/fr/deals/">des deals fixes jusqu'à 70 %</a>. L'agent se porte alors garant de la sécurité des fonds et du paiement des gains (à l'exception des infractions aux règles de la plateforme — logiciels interdits, bots ou jeu en équipe).</li>
          </ul>

          <h2>V. Exemple pratique : le prix d'un bon choix</h2>
          <p>Revenons à notre regular. Il paie 10 BB de commission pour chaque tranche de 100 mains. Avec un bon <a href="/fr/deals/">deal de rakeback à 70 %</a>, il récupère 7 BB pour chaque 100 mains — ce qui fait remonter son winrate net de 0 à <strong>+7 bb/100</strong>. Toute la chaîne se présente concrètement ainsi :</p>
          <table class="pdh-tbl">
            <thead><tr><th>Indicateur</th><th>bb/100</th></tr></thead>
            <tbody>
              <tr><td>Winrate avant rake</td><td>+10</td></tr>
              <tr><td>Rake</td><td>−10</td></tr>
              <tr><td><strong>Net sans rakeback</strong></td><td><strong>0</strong></td></tr>
              <tr><td>Rakeback 70%</td><td>+7</td></tr>
              <tr><td><strong>Net avec rakeback</strong></td><td><strong>+7</strong></td></tr>
            </tbody>
          </table>
          <p>Sur une distance de 10 000 mains, la restitution représentera <strong>700 BB</strong> de profit net : l'espérance nette repasse dans le vert (+700 BB), la distribution se décale vers le haut, et la probabilité de terminer la semaine dans le rouge chute de ~50 % à environ 24 %. Même un joueur récréatif qui joue perdant récupérera ces mêmes 700 BB et réduira nettement ses pertes.</p>
          <p>Si ces joueurs évoluent sur la limite NL500 ($2/$5, où 1 BB vaut $5), le versement hebdomadaire de rakeback net s'élèvera à :</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="700 grosses blindes multiplié par 5 dollars est égal à 3500 dollars">700 BB × $5 = $3&#8239;500</div>
          <p>C'est pourquoi, lorsqu'on bâtit une carrière de poker sur le long terme, il est absolument impossible d'ignorer les conditions de rakeback. Jouer dans des rooms à forte charge de rake et sans restitution de commission est un moyen garanti de se priver d'un profit mérité. Vous pouvez <a href="/fr/deals/">comparer les deals de rakeback actuels</a> dans le catalogue PokerDealsHub.</p>

          <h2>Questions fréquentes</h2>
          <h3>Qu'est-ce que le winrate bb/100 et quel winrate est considéré comme bon ?</h3>
          <p>Le winrate est le gain moyen en grosses blindes pour 100 mains (bb/100), généralement calculé avant déduction du rake. 0 bb/100 correspond à un jeu à l'équilibre, 1–10 bb/100 à un avantage modéré, 10–20 bb/100 et plus à un fort avantage, typique du jeu contre des adversaires faibles.</p>
          <h3>Pourquoi peut-on perdre sur une semaine même avec un winrate de +10 bb/100 ?</h3>
          <p>À cause de la variance. Sur 10 000 mains, l'écart-type est de 1000 BB ; c'est pourquoi, même avec un winrate de +10 bb/100 avant rake (EV +1000 BB), le résultat se situe avec une probabilité de 68 % dans la plage [0; 2000] BB — soit environ 16 % de chances de partir dans le rouge. Et après déduction du rake, l'espérance nette tombe à zéro, si bien que sans rakeback la probabilité de terminer la semaine dans le rouge atteint déjà près de 50 %.</p>
          <h3>Comment le rakeback influe-t-il sur le profit final ?</h3>
          <p>Le rakeback restitue une partie de la commission payée. Avec un rake d'environ 10 BB/100 et un deal à 70 %, le joueur récupère 7 BB/100 — ce qui fait remonter le winrate net de 0 à +7 bb/100, soit 700 BB sur 10 000 mains, ou $3&#8239;500 sur la limite NL500. C'est souvent le rakeback qui transforme un résultat nul en un profit stable.</p>
          <h3>Quel rakeback est considéré comme élevé ?</h3>
          <p>Dans les rooms centralisées, les taux de restitution élevés (60–70 %) exigent des volumes de jeu colossaux. Les applications de club offrent 20–50 % fixes d'emblée, et les deals par agent jusqu'à 70 % dès le premier jour. Les offres actuelles sont réunies dans le catalogue <a href="/fr/deals/">PokerDealsHub</a>.</p>

