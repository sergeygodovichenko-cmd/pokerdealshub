  tr:
    title: "Rakeback'in pokerde winrate üzerindeki etkisi: matematik, variance ve gizli kâr"
    description: >-
      Rakeback'in pokerde winrate'i ve gerçek kârı nasıl etkilediğini inceliyoruz: winrate (bb/100), variance ve
      standart sapma, rake yükü ve rakeback modelleri — formüller ve hesaplama örnekleriyle.
    body: |-
      <article>

          <style>
          .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
          .pdh-fx sub{font-size:0.72em}
          .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
          .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
          .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
          .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
        </style>

          <p>Pokeri ister bir eğlence ister bir gelir kaynağı olarak görün, nihai finansal sonucunuz üç faktör tarafından belirlenir:</p>
          <ul>
            <li>rakiplerinize karşı üstünlüğünüz — <strong>winrate</strong>;</li>
            <li>poker masasındaki <strong>rake yapısı</strong> (komisyon);</li>
            <li><strong>rakeback</strong> yüzdesi — ödenen komisyonun bir kısmının geri iadesi.</li>
          </ul>

          <h2>I. Winrate kavramı ve variance'ın etkisi</h2>
          <p>Winrate ile ifade edilen masa üstünlüğü, hesaplanması en zor değerdir. Bunu sürekli değişen birçok faktör etkiler; bunların başlıcası masadaki rakiplerin gücüdür. Ayrıca kısa mesafelerde variance'ın etkisi devasadır: istatistiksel olarak anlamlı bir winrate ancak on binlerce el oynandıktan sonra tahmin edilebilir.</p>
          <p>Winrate genellikle 100 elde kazanılan büyük blindler (<strong>bb/100</strong>) cinsinden ölçülür. Analiz yazılımlarında çoğunlukla komisyon ödenmeden önce (pre-rake) hesaplanır. Kesin winrate'inizi bilmiyorsanız, aşağıdaki sınıflandırmayla yaklaşık olarak tahmin edebilirsiniz:</p>
          <ul>
            <li><strong>Negatif winrate</strong> — kendi limitinizde rakiplerinizden daha kötü oynuyorsunuz demektir;</li>
            <li><strong>0 bb/100</strong> — başa baş oyun, ortalama rakip seviyesinde;</li>
            <li><strong>1–10 bb/100</strong> — alana karşı ölçülü bir üstünlük;</li>
            <li><strong>10–20 bb/100 ve üzeri</strong> — belirgin bir üstünlük (genellikle zayıf rakiplere karşı düzenli oyunda görülür).</li>
          </ul>

          <h2>II. Standart sapma ve mesafenin matematiği</h2>
          <p>Sonuçların oynaklığını analiz etmek için standart sapma (Standard Deviation, SD) kullanılır. No-Limit Hold'em (NLH) cash oyunları için yaklaşık 100 bb/100'dür; beş kartlı Pot-Limit Omaha'da (PLO5) ise güçlü kombinasyonların yoğunluğu daha fazla olduğundan 200–250 bb/100'e kadar yükselir.</p>
          <p>Temel bir farkı anlamak kritik önemdedir: winrate oynanan el sayısıyla <strong>doğrusal</strong> olarak artarken, standart sapma mesafenin <strong>karekökü</strong> ile orantılı olarak artar.</p>
          <p>Herhangi bir mesafe için standart sapma formülü şöyledir:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="N aralık için SD, 100 el için SD çarpı N'in karekökü eşittir">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
          <p>burada <em>N</em> — oynanan 100 ellik aralıkların sayısıdır. Bu bir yaklaşımdır: 100 ellik dilimlerin birbirinden bağımsız olduğunu varsayar, ancak pratik bir tahmin için bu tamamen yeterlidir.</p>

          <h3>Hesaplama örneği (rake öncesi)</h3>
          <p>Hold'em'de 10 000 ellik bir mesafe, aktif bir oyuncunun 1–2 masada bir haftada oynadığı hacimdir. Winrate ve SD 100 el üzerinden hesaplandığından, bu mesafeyi 100 aralık olarak ele alıyoruz (<em>N</em> = 100).</p>
          <p>Önce tüm mesafe için standart sapmayı hesaplayalım:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="10 000 el için SD, 100 çarpı 100'ün karekökü eşittir 1000 büyük blind">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
          <p>Şimdi iki oyuncuyu karşılaştıralım (buradaki winrate <strong>rake öncesidir</strong>):</p>
          <ul>
            <li><strong>Başarılı regular, +10 bb/100.</strong> Bu mesafedeki matematiksel beklentisi <strong>+1000 BB</strong>'dir.</li>
            <li><strong>Kaybeden amatör, −10 bb/100.</strong> Matematiksel beklentisi <strong>−1000 BB</strong>'dir.</li>
          </ul>
          <p>Normal dağılımın güven aralığı kuralına göre:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Sonuç aralığı</th><th>Olasılık</th></tr></thead>
            <tbody>
              <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
              <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
              <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
            </tbody>
          </table>
          <p>Başarılı bir regular için, 10 000 ellik mesafedeki sonuç %68 olasılıkla şu aralıkta yer alır:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="EV artı eksi 1 SD, 1000 BB artı eksi 1000 BB eşittir 0'dan 2000 büyük blinde">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
          <p>Yani 10 bb/100 gibi olağanüstü bir winrate'le bile, haftayı ekside kapatma ihtimali yaklaşık %16'dır (kalan %32'nin yarısı). Ve tam tersine: kaybeden bir oyuncu da aynı %68 olasılıkla −2000 ile 0 BB arasında bir sonuç gösterir — yani onun da mesafeyi artıda kapatma ihtimali yaklaşık %16'dır. İşte bu matematiksel özellik, recreational player'ları poker ekosisteminde tutan şeydir.</p>
          <p><strong>Ancak tüm bunlar rake düşülmeden önceki tablodur.</strong> Komisyonun bu tabloya ne yaptığını bir sonraki bölümde göreceğiz.</p>

          <h2>III. Rake yükü: kârın sessiz katili</h2>
          <p>Rake, poker odasının flop'a ulaşan her pottan aldığı komisyondur (bazı odalarda rake preflop'ta da alınır — 3-bet-pas senaryosuna göre). Yük iki parametreyle belirlenir: rake yüzdesi ve üst limiti (BB cinsinden ifade edilen cap). Bu değerler ne kadar yüksekse, net artıya geçmek o kadar zorlaşır. Temelleri öğrenmek isterseniz — rake ve rakeback nedir ve nasıl işler — <a href="/tr/guides/rake-and-rakeback-in-poker/">«Pokerde rake ve rakeback»</a> rehberiyle başlayın.</p>
          <p>Orta limitler için standart parametreleri alalım: rake %5 ve cap 5 BB. Oyun tarzına (tight veya loose) bağlı olarak, oyuncu 100 elde ortalama yaklaşık 10 BB rake öder.</p>
          <p>Regular'ımıza geri dönelim. 10 000 elde (100 aralık) rake şunu yer:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="100 çarpı 10 büyük blind eşittir 1000 büyük blind — 10 000 el boyunca ödenen tüm rake">100 × 10 BB = 1000 BB</div>
          <p>Bu, tam olarak onun matematiksel beklentisinin tamamıdır. Tüm dağılım 1000 BB aşağı kayar: <strong>net beklenti sıfır olur</strong>, gerçek koridor [−1000; +1000] BB'ye döner ve haftayı ekside kapatma ihtimali %16'dan neredeyse <strong>%50</strong>'ye yükselir — pratikte bir yazı-tura atışı. Başka bir deyişle, rake <em>öncesi</em> mükemmel bir teknik üstünlük olan +10 bb/100, komisyon düşüldükten sonra tam olarak 0 bb/100 net winrate verir. İşte tam burada etkili bir rakeback'e olan yakıcı ihtiyaç ortaya çıkar.</p>

          <h2>IV. Finansal istikrarın temeli olarak rakeback</h2>
          <p>Rakeback, ödenen komisyonun bir kısmının oyun hesabınıza geri iadesidir. Birkaç model vardır:</p>
          <ul>
            <li><strong>Aşamalı (centralized odalar):</strong> iade %10'dan başlar ve teorik olarak %60–70'e kadar ulaşabilir. Ancak yüksek statüler için, komisyonu düşük bir orandan ödeyerek devasa bir mesafe oynamak gerekir — bu da başlangıçtaki matematiksel beklentinin kaybına yol açar.</li>
            <li><strong>Sabit (<a href="/tr/deals/decentralized/">decentralized kulüp uygulamaları</a>):</strong> kulüpler oyunun ilk gününden itibaren %20 ile %50 arasında sabit ve anlaşılır bir iade sunar.</li>
            <li><strong>Ajans (örneğin NUTS POKER):</strong> kulüpler ajanlara büyük ortaklık koşulları verir, ajanlar da rakeback'i doğrudan oyuncularla paylaşır — <a href="/tr/deals/">%70'e kadar sabit deal'ler</a>. Bu durumda ajan, paranın güvenliğinin ve kazançların ödenmesinin garantörü olarak hareket eder (platform kurallarının ihlali durumları hariç — yasaklı yazılım, botlar veya team play).</li>
          </ul>

          <h2>V. Pratik örnek: doğru seçimin bedeli</h2>
          <p>Regular'ımıza geri dönelim. Her 100 el için 10 BB komisyon ödüyor. Kaliteli bir <a href="/tr/deals/">%70'lik rakeback deal'iyle</a> her 100 el için 7 BB geri alır — bu, net winrate'ini 0'dan <strong>+7 bb/100</strong>'e yükseltir. Tüm zincir görsel olarak şöyledir:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Gösterge</th><th>bb/100</th></tr></thead>
            <tbody>
              <tr><td>Rake öncesi winrate</td><td>+10</td></tr>
              <tr><td>Rake</td><td>−10</td></tr>
              <tr><td><strong>Rakeback'siz net</strong></td><td><strong>0</strong></td></tr>
              <tr><td>Rakeback %70</td><td>+7</td></tr>
              <tr><td><strong>Rakeback'li net</strong></td><td><strong>+7</strong></td></tr>
            </tbody>
          </table>
          <p>10 000 ellik mesafede iade <strong>700 BB</strong> net kâr sağlar: net beklenti tekrar artıya geçer (+700 BB), dağılım yukarı kayar ve haftayı ekside kapatma ihtimali ~%50'den yeniden yaklaşık %24'e düşer. Ekside oynayan bir recreational player bile aynı 700 BB'yi geri kazanır ve kayıplarını belirgin şekilde azaltır.</p>
          <p>Bu oyuncular NL500 limitini (1 BB'nin $5 olduğu $2/$5) oynuyorsa, haftalık net rakeback ödemesi şu olur:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="700 büyük blind çarpı 5 dolar eşittir 3500 dolar">700 BB × $5 = $3&#8239;500</div>
          <p>İşte bu yüzden uzun vadeli bir poker kariyeri kurarken rakeback koşullarını kesinlikle göz ardı etmemek gerekir. Yüksek rake yüküne sahip ve komisyon iadesi olmayan odalarda oynamak, hak ettiğiniz kârdan kendinizi mahrum bırakmanın garantili yoludur. Güncel rakeback deal'lerini PokerDealsHub kataloğunda <a href="/tr/deals/">karşılaştırabilirsiniz</a>.</p>

          <h2>Sık sorulan sorular</h2>
          <h3>bb/100 winrate nedir ve hangi winrate iyi sayılır?</h3>
          <p>Winrate, 100 elde büyük blind cinsinden ortalama kazançtır (bb/100) ve genellikle rake düşülmeden önce hesaplanır. 0 bb/100 başa baş oyun, 1–10 bb/100 ölçülü bir üstünlük, 10–20 bb/100 ve üzeri ise zayıf rakiplere karşı oyuna özgü güçlü bir üstünlüktür.</p>
          <h3>+10 bb/100 winrate'le bile bir hafta neden kaybedilebilir?</h3>
          <p>Variance yüzünden. 10 000 elde standart sapma 1000 BB'dir, bu nedenle rake öncesi +10 bb/100 winrate'le bile (EV +1000 BB) sonuç %68 olasılıkla [0; 2000] BB aralığında yer alır — ekside kapatma ihtimali yaklaşık %16. Rake düşüldükten sonra ise net beklenti sıfıra iner ve rakeback olmadan haftayı ekside kapatma ihtimali neredeyse %50 olur.</p>
          <h3>Rakeback nihai kârı nasıl etkiler?</h3>
          <p>Rakeback, ödenen komisyonun bir kısmını geri verir. Yaklaşık 10 BB/100 rake ve %70'lik bir deal'de oyuncu 7 BB/100 geri alır — bu, net winrate'i 0'dan +7 bb/100'e, yani 10 000 elde 700 BB'ye ya da NL500 limitinde $3&#8239;500'e yükseltir. Çoğu zaman sıfır sonucu istikrarlı bir artıya çeviren şey tam da rakeback'tir.</p>
          <h3>Hangi rakeback yüksek sayılır?</h3>
          <p>Centralized odalarda yüksek iade oranları (%60–70) devasa oyun hacmi gerektirir. Kulüp uygulamaları anında sabit %20–50 verir, ajans deal'leri ise ilk günden itibaren %70'e kadar. Güncel teklifler <a href="/tr/deals/">PokerDealsHub</a> kataloğunda toplanmıştır.</p>

