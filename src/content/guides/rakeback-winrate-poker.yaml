  it:
    title: "L'impatto del rakeback sul winrate nel poker: matematica, varianza e profitto nascosto"
    description: >-
      Come il rakeback influisce sul winrate e sul profitto reale nel poker: analizziamo il winrate (bb/100), la
      varianza e la deviazione standard, il carico di rake e i modelli di rakeback, con formule ed esempi di calcolo.
    body: |-
      <article>

          <style>
          .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
          .pdh-fx sub{font-size:0.72em}
          .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
          .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
          .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
          .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
        </style>

          <p>Che tu consideri il poker un intrattenimento o una fonte di reddito, il tuo risultato finanziario finale è determinato da tre fattori:</p>
          <ul>
            <li>il tuo vantaggio sugli avversari — il <strong>winrate</strong>;</li>
            <li>la <strong>struttura del rake</strong> (la commissione) al tavolo da poker;</li>
            <li>la percentuale di <strong>rakeback</strong> — la restituzione di una parte della commissione pagata.</li>
          </ul>

          <h2>I. Il concetto di winrate e l'influenza della varianza</h2>
          <p>Il vantaggio sul campo, espresso come winrate, è l'elemento più difficile da calcolare. Ad esso concorrono numerosi fattori in costante mutamento, il principale dei quali è la forza degli avversari al tavolo. Inoltre, sulle brevi distanze l'influenza della varianza è enorme: un winrate statisticamente significativo può essere valutato solo dopo decine di migliaia di mani giocate.</p>
          <p>Il winrate si misura convenzionalmente in big blind ogni 100 mani (<strong>bb/100</strong>). Nei software di analisi viene calcolato quasi sempre al lordo della commissione (pre-rake). Se non conosci il tuo winrate esatto, puoi stimarlo approssimativamente in base a questa classificazione:</p>
          <ul>
            <li><strong>Winrate negativo</strong> — giochi peggio degli avversari al tuo limite;</li>
            <li><strong>0 bb/100</strong> — gioco in pari, al livello dell'avversario medio;</li>
            <li><strong>1–10 bb/100</strong> — vantaggio moderato sul campo;</li>
            <li><strong>10–20 bb/100 e oltre</strong> — vantaggio significativo (di norma con il gioco regolare contro avversari deboli).</li>
          </ul>

          <h2>II. La deviazione standard e la matematica della distanza</h2>
          <p>Per analizzare la volatilità dei risultati si utilizza la deviazione standard (Standard Deviation, SD). Per il cash game a No-Limit Hold'em (NLH) è pari a circa 100 bb/100, mentre nel Pot-Limit Omaha a cinque carte (PLO5) sale a 200–250 bb/100 a causa della maggiore densità di combinazioni forti.</p>
          <p>È fondamentale comprendere una differenza sostanziale: il winrate cresce in modo <strong>lineare</strong> con il numero di mani giocate, mentre la deviazione standard cresce in proporzione alla <strong>radice quadrata</strong> della distanza.</p>
          <p>La formula della deviazione standard per una distanza arbitraria è la seguente:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD su N intervalli è uguale a SD su 100 mani, moltiplicato per la radice quadrata di N">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
          <p>dove <em>N</em> è il numero di intervalli da 100 mani giocati. Si tratta di un'approssimazione: presuppone l'indipendenza dei segmenti da 100 mani, ma per una stima pratica è più che sufficiente.</p>

          <h3>Esempio di calcolo (al lordo del rake)</h3>
          <p>Una distanza di 10 000 mani a Hold'em è il volume che un giocatore attivo copre in una settimana su 1–2 tavoli. Poiché winrate e SD si calcolano su 100 mani, consideriamo questa distanza come 100 intervalli (<em>N</em> = 100).</p>
          <p>Calcoliamo per prima cosa la deviazione standard sull'intera distanza:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD su 10 000 mani è uguale a 100, moltiplicato per la radice quadrata di 100, uguale a 1000 big blind">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
          <p>Ora confrontiamo due giocatori (il winrate qui è <strong>al lordo del rake</strong>):</p>
          <ul>
            <li><strong>Regular vincente, +10 bb/100.</strong> Il suo valore atteso sulla distanza è <strong>+1000 BB</strong>.</li>
            <li><strong>Amatore perdente, −10 bb/100.</strong> Il suo valore atteso è <strong>−1000 BB</strong>.</li>
          </ul>
          <p>Secondo la regola degli intervalli di confidenza della distribuzione normale:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Intervallo del risultato</th><th>Probabilità</th></tr></thead>
            <tbody>
              <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
              <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
              <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
            </tbody>
          </table>
          <p>Per il regular vincente, con una probabilità del 68% il risultato su 10 000 mani ricadrà nell'intervallo:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="EV più o meno 1 SD è uguale a 1000 BB più o meno 1000 BB, cioè da 0 a 2000 big blind">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
          <p>Ciò significa che anche con un winrate eccezionale di 10 bb/100 resta circa il 16% di probabilità (metà del restante 32%) di chiudere la settimana in perdita. E viceversa: il giocatore perdente, con la stessa probabilità del 68%, mostrerà un risultato compreso tra −2000 e 0 BB, il che significa che anche lui ha circa il 16% di probabilità di chiudere la distanza in attivo. È proprio questa peculiarità matematica a trattenere i giocatori ricreativi nell'ecosistema del poker.</p>
          <p><strong>Ma tutto questo è il quadro al lordo del rake.</strong> Cosa gli fa la commissione lo vediamo nella prossima sezione.</p>

          <h2>III. Il carico di rake: il killer silenzioso del profitto</h2>
          <p>Il rake è la commissione che la poker room preleva da ogni piatto arrivato al flop (in alcune room il rake viene prelevato anche al preflop, secondo lo scenario 3-bet-fold). Il carico è determinato da due parametri: la percentuale di rake e il suo limite (il cap, espresso in BB). Più alti sono questi valori, più difficile è chiudere in attivo netto. Se ti servono le basi — cosa sono rake e rakeback e come funzionano — inizia dalla guida <a href="/it/guides/rake-and-rakeback-in-poker/">«Rake e rakeback nel poker»</a>.</p>
          <p>Prendiamo parametri standard per i limiti medi: rake al 5% e cap di 5 BB. A seconda dello stile di gioco (tight o loose), ogni 100 mani un giocatore paga in media circa 10 BB di rake.</p>
          <p>Torniamo al nostro regular. Su 10 000 mani (100 intervalli) il rake divora:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="100 moltiplicato per 10 big blind è uguale a 1000 big blind — l'intero rake su 10 000 mani">100 × 10 BB = 1000 BB</div>
          <p>Ovvero esattamente tutto il suo valore atteso. L'intera distribuzione si sposta verso il basso di 1000 BB: <strong>il valore atteso netto diventa nullo</strong>, l'intervallo reale si trasforma in [−1000; +1000] BB e la probabilità di chiudere la settimana in perdita sale dal 16% a quasi il <strong>50%</strong> — in pratica un lancio di moneta. In altre parole, un ottimo vantaggio tecnico di +10 bb/100 <em>al lordo</em> del rake, dopo la detrazione della commissione, produce un winrate netto esattamente di 0 bb/100. È proprio qui che sorge l'urgente necessità di un rakeback efficace.</p>

          <h2>IV. Il rakeback come fondamento della stabilità finanziaria</h2>
          <p>Il rakeback è la restituzione di una parte della commissione pagata sul tuo conto di gioco. Esistono diversi modelli:</p>
          <ul>
            <li><strong>Progressivo (room centralizzate):</strong> la restituzione parte dal 10% e teoricamente può arrivare al 60–70%. Ma per raggiungere gli status più alti bisogna macinare una distanza enorme, pagando la commissione a un tasso di rimborso ridotto — e questo porta a perdere il valore atteso di partenza.</li>
            <li><strong>Statico (<a href="/it/deals/decentralized/">app di club decentralizzate</a>):</strong> i club offrono una restituzione fissa e trasparente, dal 20% al 50%, fin dal primo giorno di gioco.</li>
            <li><strong>Agenziale (ad esempio NUTS POKER):</strong> i club concedono condizioni di partnership vantaggiose agli agenti, che condividono il rakeback direttamente con i giocatori — <a href="/it/deals/">deal fissi fino al 70%</a>. In questo caso l'agente funge da garante della sicurezza dei fondi e del pagamento delle vincite (fatta eccezione per le violazioni delle regole della piattaforma — software proibiti, bot o teamplay).</li>
          </ul>

          <h2>V. Esempio pratico: il prezzo della scelta giusta</h2>
          <p>Torniamo al nostro regular. Paga 10 BB di commissione ogni 100 mani. Con un buon <a href="/it/deals/">deal di rakeback al 70%</a> riceve indietro 7 BB ogni 100 mani — e questo porta il suo winrate netto da 0 a <strong>+7 bb/100</strong>. L'intera catena si presenta così:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Indicatore</th><th>bb/100</th></tr></thead>
            <tbody>
              <tr><td>Winrate al lordo del rake</td><td>+10</td></tr>
              <tr><td>Rake</td><td>−10</td></tr>
              <tr><td><strong>Netto senza rakeback</strong></td><td><strong>0</strong></td></tr>
              <tr><td>Rakeback 70%</td><td>+7</td></tr>
              <tr><td><strong>Netto con rakeback</strong></td><td><strong>+7</strong></td></tr>
            </tbody>
          </table>
          <p>Su una distanza di 10 000 mani la restituzione ammonterà a <strong>700 BB</strong> di profitto netto: il valore atteso netto torna in attivo (+700 BB), la distribuzione si sposta verso l'alto e la probabilità di chiudere la settimana in perdita scende dal ~50% di nuovo a circa il 24%. Anche il giocatore ricreativo, che gioca in perdita, recupererà gli stessi 700 BB e ridurrà sensibilmente le perdite.</p>
          <p>Se questi giocatori affrontano il limite NL500 ($2/$5, dove 1 BB equivale a $5), il pagamento settimanale del rakeback netto ammonterà a:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="700 big blind moltiplicato per 5 dollari è uguale a 3500 dollari">700 BB × $5 = $3&#8239;500</div>
          <p>Ecco perché, nel costruire una carriera pokeristica di lungo periodo, non si possono in alcun modo ignorare le condizioni di rakeback. Giocare in room con un alto carico di rake e senza restituzione della commissione è un modo garantito per privarsi del profitto meritato. Puoi <a href="/it/deals/">confrontare i deal di rakeback aggiornati</a> nel catalogo di PokerDealsHub.</p>

          <h2>Domande frequenti</h2>
          <h3>Cos'è il winrate bb/100 e quale winrate è considerato buono?</h3>
          <p>Il winrate è il guadagno medio in big blind ogni 100 mani (bb/100), di norma al lordo del rake. 0 bb/100 è il gioco in pari, 1–10 bb/100 è un vantaggio moderato, 10–20 bb/100 e oltre è un vantaggio forte, tipico del gioco contro avversari deboli.</p>
          <h3>Perché si può perdere una settimana anche con un winrate di +10 bb/100?</h3>
          <p>A causa della varianza. Su 10 000 mani la deviazione standard è pari a 1000 BB, quindi anche con un winrate di +10 bb/100 al lordo del rake (EV +1000 BB) il risultato, con una probabilità del 68%, ricade nell'intervallo [0; 2000] BB — circa il 16% di probabilità di finire in perdita. E dopo la detrazione del rake il valore atteso netto scende a zero, e senza rakeback la probabilità di chiudere la settimana in perdita è già quasi del 50%.</p>
          <h3>Come influisce il rakeback sul profitto finale?</h3>
          <p>Il rakeback restituisce una parte della commissione pagata. Con un rake di circa 10 BB/100 e un deal al 70% il giocatore recupera 7 BB/100 — e questo porta il winrate netto da 0 a +7 bb/100, cioè 700 BB su 10 000 mani, ovvero $3&#8239;500 al limite NL500. Spesso è proprio il rakeback a trasformare un risultato nullo in un attivo stabile.</p>
          <h3>Quale rakeback è considerato alto?</h3>
          <p>Nelle room centralizzate i tassi di restituzione elevati (60–70%) richiedono volumi di gioco enormi. Le app di club offrono un fisso del 20–50% da subito, mentre i deal agenziali arrivano fino al 70% dal primo giorno. Le offerte aggiornate sono raccolte nel catalogo di <a href="/it/deals/">PokerDealsHub</a>.</p>

