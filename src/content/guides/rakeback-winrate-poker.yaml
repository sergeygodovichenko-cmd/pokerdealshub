  pt:
    title: "Impacto do rakeback no winrate no poker: matemática, variance e lucro oculto"
    description: >-
      Como o rakeback afeta o winrate e o lucro real no poker: analisamos o winrate (bb/100), a variance e o desvio
      padrão, a carga de rake e os modelos de rakeback — com fórmulas e exemplos de cálculos.
    body: |-
      <article>

          <style>
          .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
          .pdh-fx sub{font-size:0.72em}
          .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
          .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
          .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
          .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
        </style>

          <p>Independentemente de você encarar o poker como diversão ou como fonte de renda, o seu resultado financeiro final é determinado por três fatores:</p>
          <ul>
            <li>a sua vantagem sobre os adversários — o <strong>winrate</strong>;</li>
            <li>a <strong>estrutura do rake</strong> (comissão) na mesa de poker;</li>
            <li>o percentual de <strong>rakeback</strong> — a devolução de parte da comissão paga.</li>
          </ul>

          <h2>I. O conceito de winrate e a influência da variance</h2>
          <p>A vantagem sobre o campo, expressa no winrate, é a mais difícil de calcular. Ela é influenciada por muitos fatores em constante mudança, sendo o principal deles a força dos oponentes na mesa. Além disso, em distâncias curtas a influência da variance é enorme: um winrate estatisticamente significativo só pode ser avaliado depois de dezenas de milhares de mãos jogadas.</p>
          <p>O winrate costuma ser medido em big blinds a cada 100 mãos (<strong>bb/100</strong>). Nos softwares de análise, ele geralmente é calculado antes do pagamento da comissão (pré-rake). Se você não sabe o seu winrate exato, pode estimá-lo aproximadamente por esta classificação:</p>
          <ul>
            <li><strong>Winrate negativo</strong> — você joga pior que os adversários no seu limite;</li>
            <li><strong>0 bb/100</strong> — jogo no zero a zero, no nível do oponente médio;</li>
            <li><strong>1–10 bb/100</strong> — vantagem moderada sobre o campo;</li>
            <li><strong>10–20 bb/100 ou mais</strong> — vantagem significativa (em geral, jogando regularmente contra adversários fracos).</li>
          </ul>

          <h2>II. O desvio padrão e a matemática da distância</h2>
          <p>Para analisar a volatilidade dos resultados usa-se o desvio padrão (Standard Deviation, SD). Nos jogos de cash em no-limit hold'em (NLH) ele é de aproximadamente 100 bb/100, enquanto no pot-limit Omaha de cinco cartas (PLO5) sobe para 200–250 bb/100, devido à maior densidade de combinações fortes.</p>
          <p>É fundamental entender uma diferença essencial: o winrate cresce de forma <strong>linear</strong> com o número de mãos jogadas, ao passo que o desvio padrão cresce proporcionalmente à <strong>raiz quadrada</strong> da distância.</p>
          <p>A fórmula do desvio padrão para uma distância qualquer é a seguinte:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD para N intervalos é igual ao SD para 100 mãos multiplicado pela raiz quadrada de N">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
          <p>em que <em>N</em> é o número de intervalos de 100 mãos jogados. Trata-se de uma aproximação: ela pressupõe a independência dos trechos de 100 mãos, mas para uma estimativa prática isso é mais do que suficiente.</p>

          <h3>Exemplo de cálculo (antes do rake)</h3>
          <p>Uma distância de 10 000 mãos no hold'em é o volume que um jogador ativo completa em uma semana jogando em 1–2 mesas. Como o winrate e o SD são calculados a cada 100 mãos, tratamos essa distância como 100 intervalos (<em>N</em> = 100).</p>
          <p>Primeiro, vamos calcular o desvio padrão para toda a distância:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD para 10 000 mãos é igual a 100 multiplicado pela raiz quadrada de 100, igual a 1000 big blinds">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
          <p>Agora vamos comparar dois jogadores (o winrate aqui é <strong>antes do rake</strong>):</p>
          <ul>
            <li><strong>Regular vencedor, +10 bb/100.</strong> A sua esperança matemática na distância é de <strong>+1000 BB</strong>.</li>
            <li><strong>Amador perdedor, −10 bb/100.</strong> A sua esperança matemática é de <strong>−1000 BB</strong>.</li>
          </ul>
          <p>Pela regra dos intervalos de confiança da distribuição normal:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Faixa de resultado</th><th>Probabilidade</th></tr></thead>
            <tbody>
              <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
              <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
              <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
            </tbody>
          </table>
          <p>Para o regular vencedor, com probabilidade de 68% o resultado em 10 000 mãos ficará na faixa:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="EV mais ou menos 1 SD é igual a 1000 BB mais ou menos 1000 BB, ou seja, de 0 a 2000 big blinds">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
          <p>Ou seja, mesmo com um winrate excepcional de 10 bb/100, resta cerca de 16% de chance (metade dos 32% restantes) de terminar a semana no negativo. E o inverso também vale: o jogador perdedor, com a mesma probabilidade de 68%, apresentará um resultado entre −2000 e 0 BB — o que significa que ele também tem cerca de 16% de chance de fechar a distância no positivo. É justamente essa particularidade matemática que mantém os jogadores recreativos no ecossistema do poker.</p>
          <p><strong>Mas tudo isso é o panorama antes do desconto do rake.</strong> O que a comissão faz com ele é o tema da próxima seção.</p>

          <h2>III. A carga de rake: o assassino silencioso do lucro</h2>
          <p>O rake é a comissão que a sala de poker cobra de cada pote que chega ao flop (em algumas salas o rake também é cobrado no pré-flop — no cenário 3-bet-fold). A carga é determinada por dois parâmetros: o percentual do rake e o seu limite (cap, expresso em BB). Quanto maiores esses valores, mais difícil é chegar ao lucro líquido. Se você precisa das bases — o que são rake e rakeback e como eles funcionam — comece pelo guia <a href="/pt/guides/rake-and-rakeback-in-poker/">«Rake e rakeback no poker»</a>.</p>
          <p>Vamos usar parâmetros padrão para limites médios: rake de 5% e cap de 5 BB. Dependendo do estilo de jogo (tight ou loose), a cada 100 mãos o jogador paga em média cerca de 10 BB de rake.</p>
          <p>Voltemos ao nosso regular. Em 10 000 mãos (100 intervalos) o rake consome:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="100 multiplicado por 10 big blinds é igual a 1000 big blinds — todo o rake em 10 000 mãos">100 × 10 BB = 1000 BB</div>
          <p>Isso é exatamente toda a sua esperança matemática. Toda a distribuição desloca-se para baixo em 1000 BB: a <strong>esperança matemática líquida torna-se nula</strong>, a faixa real vira [−1000; +1000] BB, e a chance de terminar a semana no negativo sobe de 16% para quase <strong>50%</strong> — na prática, um cara ou coroa. Em outras palavras, uma excelente vantagem técnica de +10 bb/100 <em>antes</em> do rake, depois do desconto da comissão, resulta em um winrate líquido de exatamente 0 bb/100. É aqui que surge a necessidade urgente de um rakeback eficiente.</p>

          <h2>IV. O rakeback como base da estabilidade financeira</h2>
          <p>O rakeback é a devolução de parte da comissão paga de volta à sua conta de jogo. Existem vários modelos:</p>
          <ul>
            <li><strong>Progressivo (salas centralizadas):</strong> a devolução começa em 10% e, teoricamente, pode chegar a 60–70%. Mas, para atingir os status mais altos, é preciso completar uma distância enorme pagando a comissão a uma taxa de devolução reduzida — e isso leva à perda da esperança matemática inicial.</li>
            <li><strong>Estático (<a href="/pt/deals/decentralized/">aplicativos de clube descentralizados</a>):</strong> os clubes oferecem uma devolução fixa e clara, de 20% a 50%, desde o primeiro dia de jogo.</li>
            <li><strong>De agente (por exemplo, NUTS POKER):</strong> os clubes concedem grandes condições de parceria aos agentes, e estes repassam o rakeback diretamente aos jogadores — <a href="/pt/deals/">deals fixos de até 70%</a>. Nesse caso, o agente atua como garantidor da segurança dos fundos e do pagamento dos ganhos (exceto em casos de violação das regras da plataforma — software proibido, bots ou jogo em equipe).</li>
          </ul>

          <h2>V. Exemplo prático: o preço da escolha certa</h2>
          <p>Voltemos ao nosso regular. Ele paga 10 BB de comissão a cada 100 mãos. Com um bom <a href="/pt/deals/">deal de rakeback de 70%</a>, ele recebe de volta 7 BB a cada 100 mãos — o que eleva o seu winrate líquido de 0 para <strong>+7 bb/100</strong>. Toda a cadeia fica visualmente assim:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Indicador</th><th>bb/100</th></tr></thead>
            <tbody>
              <tr><td>Winrate antes do rake</td><td>+10</td></tr>
              <tr><td>Rake</td><td>−10</td></tr>
              <tr><td><strong>Líquido sem rakeback</strong></td><td><strong>0</strong></td></tr>
              <tr><td>Rakeback 70%</td><td>+7</td></tr>
              <tr><td><strong>Líquido com rakeback</strong></td><td><strong>+7</strong></td></tr>
            </tbody>
          </table>
          <p>Na distância de 10 000 mãos, a devolução representará <strong>700 BB</strong> de lucro líquido: a esperança matemática líquida volta ao positivo (+700 BB), a distribuição desloca-se para cima e a chance de terminar a semana no negativo cai de ~50% de volta para cerca de 24%. Até um jogador recreativo que joga no negativo recuperará esses mesmos 700 BB e reduzirá suas perdas de forma perceptível.</p>
          <p>Se esses jogadores estiverem no limite NL500 ($2/$5, em que 1 BB equivale a $5), o pagamento semanal de rakeback líquido será de:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="700 big blinds multiplicado por 5 dólares é igual a 3500 dólares">700 BB × $5 = $3&#8239;500</div>
          <p>É por isso que, ao construir uma carreira de poker de longo prazo, é categoricamente impossível ignorar as condições de rakeback. Jogar em salas com alta carga de rake e sem devolução da comissão é uma forma garantida de privar-se do lucro merecido. É possível <a href="/pt/deals/">comparar os deals de rakeback atuais</a> no catálogo da PokerDealsHub.</p>

          <h2>Perguntas frequentes</h2>
          <h3>O que é o winrate bb/100 e qual winrate é considerado bom?</h3>
          <p>O winrate é o ganho médio em big blinds a cada 100 mãos (bb/100), geralmente antes do desconto do rake. 0 bb/100 é jogo no zero a zero, 1–10 bb/100 é uma vantagem moderada, 10–20 bb/100 ou mais é uma vantagem forte, característica do jogo contra adversários fracos.</p>
          <h3>Por que é possível perder uma semana mesmo com um winrate de +10 bb/100?</h3>
          <p>Por causa da variance. Em 10 000 mãos, o desvio padrão é de 1000 BB, por isso, mesmo com um winrate de +10 bb/100 antes do rake (EV +1000 BB), o resultado, com probabilidade de 68%, fica na faixa [0; 2000] BB — cerca de 16% de chance de ficar no negativo. E depois do desconto do rake, a esperança matemática líquida cai a zero e, sem rakeback, a chance de terminar a semana no negativo já é de quase 50%.</p>
          <h3>Como o rakeback afeta o lucro final?</h3>
          <p>O rakeback devolve parte da comissão paga. Com um rake de cerca de 10 BB/100 e um deal de 70%, o jogador recupera 7 BB/100 — o que eleva o winrate líquido de 0 para +7 bb/100, ou seja, 700 BB em 10 000 mãos, ou $3&#8239;500 no limite NL500. Muitas vezes é justamente o rakeback que transforma um resultado nulo em lucro estável.</p>
          <h3>Qual rakeback é considerado alto?</h3>
          <p>Nas salas centralizadas, as taxas de devolução altas (60–70%) exigem volumes enormes de jogo. Os aplicativos de clube dão 20–50% fixos de imediato, e os deals de agente chegam a 70% desde o primeiro dia. As ofertas atuais estão reunidas no catálogo da <a href="/pt/deals/">PokerDealsHub</a>.</p>

