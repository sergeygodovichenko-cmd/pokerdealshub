  uz:
    title: "Rakebekning pokerdagi winreytga ta'siri: matematika, variance va yashirin foyda"
    description: >-
      Rakebek pokerdagi winreytga va haqiqiy foydaga qanday ta'sir qiladi: winreyt (bb/100), variance va standart
      chetlanish, rake yuki hamda rakebek modellarini formulalar va hisob-kitob misollari bilan tahlil qilamiz.
    body: |-
      <article>

        <style>
          .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
          .pdh-fx sub{font-size:0.72em}
          .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
          .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
          .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
          .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
        </style>

        <p>Pokerni ko'ngilochar mashg'ulot sifatida ko'rasizmi yoki daromad manbai sifatidami — buning ahamiyati yo'q: sizning yakuniy moliyaviy natijangiz uch omil bilan belgilanadi:</p>
        <ul>
          <li>raqiblaringiz ustidan ustunligingiz — <strong>winreyt</strong>;</li>
          <li>poker stolidagi <strong>rake tuzilishi</strong> (komissiya);</li>
          <li><strong>rakebek</strong> foizi — to'langan komissiyaning bir qismini qaytarish.</li>
        </ul>

        <h2>I. Winreyt tushunchasi va variance ta'siri</h2>
        <p>Winreytda ifodalangan maydon ustidan ustunlikni hisoblash eng qiyini. Unga doimiy o'zgarib turadigan ko'plab omillar ta'sir qiladi, ularning asosiysi — stoldagi raqiblarning kuchi. Bundan tashqari, qisqa masofalarda variance ta'siri juda katta: statistik jihatdan ishonchli winreytni faqat o'n minglab qo'llar o'ynalgandan keyingina baholash mumkin.</p>
        <p>Winreytni odatda 100 ta qo'lga to'g'ri keladigan katta blaynd (<strong>bb/100</strong>) bilan o'lchashadi. Tahliliy dasturlarda u ko'pincha komissiya to'lanishidan oldin (pre-rake) hisoblanadi. Agar aniq winreytingizni bilmasangiz, uni quyidagi tasnif bo'yicha taxminan baholash mumkin:</p>
        <ul>
          <li><strong>Salbiy winreyt</strong> — siz o'z limitingizdagi raqiblardan yomonroq o'ynaysiz;</li>
          <li><strong>0 bb/100</strong> — nolga o'yin, o'rtacha raqib darajasida;</li>
          <li><strong>1–10 bb/100</strong> — maydon ustidan o'rtacha ustunlik;</li>
          <li><strong>10–20 bb/100 va undan yuqori</strong> — sezilarli ustunlik (odatda kuchsiz raqiblarga qarshi muntazam o'yinda).</li>
        </ul>

        <h2>II. Standart chetlanish va masofa matematikasi</h2>
        <p>Natijalarning o'zgaruvchanligini tahlil qilish uchun standart chetlanishdan (Standard Deviation, SD) foydalaniladi. Limitsiz holdem (NLH) kesh-o'yinlari uchun u taxminan 100 bb/100 ni tashkil qiladi, besh kartali pot-limit Omahada (PLO5) esa kuchli kombinatsiyalar zichligi kattaroq bo'lgani sababli 200–250 bb/100 gacha ko'tariladi.</p>
        <p>Fundamental farqni tushunish o'ta muhim: winreyt o'ynalgan qo'llar soniga <strong>chiziqli</strong> ravishda o'sadi, standart chetlanish esa — masofaning <strong>kvadrat ildiziga</strong> mutanosib ravishda.</p>
        <p>Ixtiyoriy masofa uchun standart chetlanish formulasi quyidagicha ko'rinadi:</p>
        <div class="pdh-fx" role="math" dir="ltr" aria-label="N intervaldagi SD 100 qo'ldagi SD ni N ning kvadrat ildiziga ko'paytirilganiga teng">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
        <p>bu yerda <em>N</em> — o'ynalgan 100-qo'lli intervallar soni. Bu — taxminiy hisob: u 100-qo'lli oraliqlarning bir-biridan mustaqilligini nazarda tutadi, biroq amaliy baholash uchun bu yetarli.</p>

        <h3>Hisoblash misoli (rake dan oldin)</h3>
        <p>Holdemda 10 000 qo'l masofasi — bu faol o'yinchi bir hafta davomida 1–2 stolda o'ynaydigan hajm. Winreyt va SD 100 ta qo'lga hisoblangani sababli, biz bu masofani 100 ta interval sifatida ko'rib chiqamiz (<em>N</em> = 100).</p>
        <p>Avval butun masofa uchun standart chetlanishni hisoblaymiz:</p>
        <div class="pdh-fx" role="math" dir="ltr" aria-label="10 000 qo'ldagi SD 100 ni 100 ning kvadrat ildiziga ko'paytirilganiga teng, ya'ni 1000 katta blaynd">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
        <p>Endi ikki o'yinchini taqqoslaymiz (bu yerda winreyt — <strong>rake dan oldin</strong>):</p>
        <ul>
          <li><strong>Muvaffaqiyatli regular, +10 bb/100.</strong> Uning masofadagi matematik kutilmasi — <strong>+1000 BB</strong>.</li>
          <li><strong>Yutqazayotgan havaskor, −10 bb/100.</strong> Uning matematik kutilmasi — <strong>−1000 BB</strong>.</li>
        </ul>
        <p>Normal taqsimotning ishonch oraliqlari qoidasiga ko'ra:</p>
        <table class="pdh-tbl">
          <thead><tr><th>Natija diapazoni</th><th>Ehtimollik</th></tr></thead>
          <tbody>
            <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
            <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
            <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
          </tbody>
        </table>
        <p>Muvaffaqiyatli regular uchun 68% ehtimollik bilan 10 000 qo'ldagi natija quyidagi diapazonda bo'ladi:</p>
        <div class="pdh-fx" role="math" dir="ltr" aria-label="EV plyus-minus 1 SD 1000 BB plyus-minus 1000 BB ga teng, ya'ni 0 dan 2000 katta blaynd gacha">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
        <p>Ya'ni hatto 10 bb/100 kabi ajoyib winreyt bilan ham haftani minusda yakunlash ehtimoli taxminan 16% (qolgan 32% ning yarmi) bo'lib qoladi. Aksincha: yutqazayotgan o'yinchi ham xuddi shu 68% ehtimollik bilan −2000 dan 0 BB gacha natija ko'rsatadi — demak, uning ham dis­tansiyani plyusda yakunlash ehtimoli taxminan 16% ni tashkil qiladi. Aynan shu matematik xususiyat rekreatsion o'yinchilarni poker ekotizimida ushlab turadi.</p>
        <p><strong>Ammo bularning barchasi — rake ayirilishidan oldingi manzara.</strong> Komissiya bu manzarani nima qilishini keyingi bo'limda ko'ramiz.</p>

        <h2>III. Rake yuki: foydaning sokin qotili</h2>
        <p>Rake — bu poker-rum floppgacha yetib borgan har bir bankdan oladigan komissiya (ba'zi xonalarda rake preflopda ham olinadi — 3-bet-pas ssenariysi bo'yicha). Yuk ikki parametr bilan belgilanadi: rake foizi va uning cheklovi (BB da ifodalangan kap). Bu ko'rsatkichlar qanchalik yuqori bo'lsa, sof plyusga chiqish shunchalik qiyin. Agar asoslar kerak bo'lsa — rake va rakebek nima va ular qanday ishlaydi — <a href="/uz/guides/rake-and-rakeback-in-poker/">«Pokerda rake va rakebek»</a> qo'llanmasidan boshlang.</p>
        <p>O'rta limitlar uchun standart parametrlarni olamiz: rake 5% va kap 5 BB. O'yin uslubiga (tayt yoki luz) qarab, o'yinchi 100 ta qo'lga o'rtacha 10 BB atrofida rake to'laydi.</p>
        <p>Regularimizga qaytamiz. 10 000 qo'lga (100 interval) rake shuni yeb qo'yadi:</p>
        <div class="pdh-fx" role="math" dir="ltr" aria-label="100 ni 10 katta blaynd ga ko'paytirsak 1000 katta blaynd bo'ladi — 10 000 qo'ldagi butun rake">100 × 10 BB = 1000 BB</div>
        <p>Bu — aynan uning butun matematik kutilmasi. Butun taqsimot 1000 BB ga pastga siljiydi: <strong>netto matematik kutilma nolga aylanadi</strong>, haqiqiy koridor [−1000; +1000] BB ga aylanadi, haftani minusda yakunlash ehtimoli esa 16% dan deyarli <strong>50%</strong> gacha ko'tariladi — aslida tanga tashlashning o'zi. Boshqacha aytganda, rake<em>dan oldin</em>gi +10 bb/100 kabi zo'r texnik ustunlik komissiya ayirilgandan keyin aynan 0 bb/100 netto-winreyt beradi. Aynan shu yerda samarali rakebekga keskin ehtiyoj paydo bo'ladi.</p>

        <h2>IV. Rakebek moliyaviy barqarorlik asosi sifatida</h2>
        <p>Rakebek — bu to'langan komissiyaning bir qismini o'yin hisobingizga qaytarish. Bir nechta model mavjud:</p>
        <ul>
          <li><strong>Progressiv (markazlashtirilgan rumlar):</strong> qaytarish 10% dan boshlanadi va nazariy jihatdan 60–70% ga yetishi mumkin. Ammo yuqori statuslar uchun ulkan masofani o'ynash kerak bo'ladi va bu davomida komissiya pasaytirilgan stavka bo'yicha to'lanadi — bu esa dastlabki matematik kutilmani yo'qotishga olib keladi.</li>
          <li><strong>Statik (<a href="/uz/deals/decentralized/">markazlashmagan klub ilovalar</a>):</strong> klublar o'yinning birinchi kunidanoq 20% dan 50% gacha bo'lgan qat'iy va tushunarli qaytarishni taklif qiladi.</li>
          <li><strong>Agentlik (masalan, NUTS POKER):</strong> klublar agentlarga yirik hamkorlik shartlarini beradi, agentlar esa rakebekni to'g'ridan-to'g'ri o'yinchilar bilan bo'lishadi — <a href="/uz/deals/">70% gacha qat'iy bitimlar</a>. Bunda agent mablag'larning saqlanishi va yutuqlarning to'lanishi kafili bo'lib chiqadi (platforma qoidalarining buzilishi bundan mustasno — taqiqlangan dasturiy ta'minot, botlar yoki timpley).</li>
        </ul>

        <h2>V. Amaliy misol: to'g'ri tanlovning narxi</h2>
        <p>Regularimizga qaytamiz. U har 100 ta qo'lga 10 BB komissiya to'laydi. Sifatli <a href="/uz/deals/">70% lik rakebek bitimi</a> bilan u har 100 ta qo'lga 7 BB ni qaytarib oladi — bu uning netto-winreytini 0 dan <strong>+7 bb/100</strong> ga ko'taradi. Butun zanjir aniq ko'rinishda quyidagicha:</p>
        <table class="pdh-tbl">
          <thead><tr><th>Ko'rsatkich</th><th>bb/100</th></tr></thead>
          <tbody>
            <tr><td>Rake dan oldingi winreyt</td><td>+10</td></tr>
            <tr><td>Rake</td><td>−10</td></tr>
            <tr><td><strong>Rakebeksiz netto</strong></td><td><strong>0</strong></td></tr>
            <tr><td>Rakebek 70%</td><td>+7</td></tr>
            <tr><td><strong>Rakebek bilan netto</strong></td><td><strong>+7</strong></td></tr>
          </tbody>
        </table>
        <p>10 000 qo'l masofasida qaytarish <strong>700 BB</strong> sof foydani tashkil qiladi: netto matematik kutilma yana plyusga o'tadi (+700 BB), taqsimot yuqoriga siljiydi, haftani minusda yakunlash ehtimoli esa ~50% dan yana taxminan 24% gacha tushadi. Hatto minusda o'ynayotgan rekreatsion o'yinchi ham o'sha 700 BB ni qaytarib oladi va yo'qotishlarni sezilarli darajada kamaytiradi.</p>
        <p>Agar bu o'yinchilar NL500 limitini ($2/$5, bu yerda 1 BB $5 ga teng) o'ynasa, sof rakebekning haftalik to'lovi shuni tashkil qiladi:</p>
        <div class="pdh-fx" role="math" dir="ltr" aria-label="700 katta blaynd ni 5 dollarga ko'paytirsak 3500 dollar bo'ladi">700 BB × $5 = $3&#8239;500</div>
        <p>Aynan shuning uchun uzoq muddatli poker karyerasini qurishda rakebek shartlarini mutlaqo e'tiborsiz qoldirib bo'lmaydi. Yuqori rake yukiga ega va komissiyani qaytarmaydigan rumlarda o'ynash — o'zingizni haqli foydadan mahrum qilishning kafolatlangan usuli. <a href="/uz/deals/">Dolzarb rakebek bitimlarini taqqoslashni</a> PokerDealsHub katalogida amalga oshirish mumkin.</p>

        <h2>Ko'p beriladigan savollar</h2>
        <h3>bb/100 winreyt nima va qanday winreyt yaxshi hisoblanadi?</h3>
        <p>Winreyt — bu 100 ta qo'lga to'g'ri keladigan katta blayndlardagi o'rtacha yutuq (bb/100), odatda rake ayirilishidan oldin. 0 bb/100 — nolga o'yin, 1–10 bb/100 — o'rtacha ustunlik, 10–20 bb/100 va undan yuqori — kuchsiz raqiblarga qarshi o'yinga xos kuchli ustunlik.</p>
        <h3>Nega hatto +10 bb/100 winreyt bilan ham haftani yutqazish mumkin?</h3>
        <p>Variance sababli. 10 000 qo'lda standart chetlanish 1000 BB ga teng, shu sababli hatto rake dan oldingi +10 bb/100 winreyt (EV +1000 BB) bilan ham natija 68% ehtimollik bilan [0; 2000] BB diapazonida yotadi — minusga tushish ehtimoli taxminan 16%. Rake ayirilgandan keyin esa netto matematik kutilma nolga tushadi va rakebeksiz haftani minusda yakunlash ehtimoli allaqachon deyarli 50%.</p>
        <h3>Rakebek yakuniy foydaga qanday ta'sir qiladi?</h3>
        <p>Rakebek to'langan komissiyaning bir qismini qaytaradi. Rake taxminan 10 BB/100 va bitim 70% bo'lganda o'yinchi 7 BB/100 ni qaytaradi — bu netto-winreytni 0 dan +7 bb/100 ga ko'taradi, ya'ni 10 000 qo'lga 700 BB yoki NL500 limitida $3&#8239;500. Ko'pincha aynan rakebek nol natijani barqaror plyusga aylantiradi.</p>
        <h3>Qanday rakebek yuqori hisoblanadi?</h3>
        <p>Markazlashtirilgan rumlarda yuqori qaytarish stavkalari (60–70%) ulkan o'yin hajmlarini talab qiladi. Klub ilovalari darhol qat'iy 20–50% ni beradi, agentlik bitimlari esa — birinchi kundanoq 70% gacha. Dolzarb takliflar <a href="/uz/deals/">PokerDealsHub</a> katalogida to'plangan.</p>

        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "inLanguage": "uz",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "bb/100 winreyt nima va qanday winreyt yaxshi hisoblanadi?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Winreyt — bu 100 ta qo'lga to'g'ri keladigan katta blayndlardagi o'rtacha yutuq (bb/100), odatda rake ayirilishidan oldin. 0 bb/100 — nolga o'yin, 1–10 bb/100 — o'rtacha ustunlik, 10–20 bb/100 va undan yuqori — kuchsiz raqiblarga qarshi o'yinga xos kuchli ustunlik."
              }
            },
            {
              "@type": "Question",
              "name": "Nega hatto +10 bb/100 winreyt bilan ham haftani yutqazish mumkin?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Variance sababli. 10 000 qo'lda standart chetlanish 1000 BB ga teng, shu sababli hatto rake dan oldingi +10 bb/100 winreyt (EV +1000 BB) bilan ham natija 68% ehtimollik bilan [0; 2000] BB diapazonida yotadi — minusga tushish ehtimoli taxminan 16%. Rake ayirilgandan keyin esa netto matematik kutilma nolga tushadi va rakebeksiz haftani minusda yakunlash ehtimoli allaqachon deyarli 50%."
              }
            },
            {
              "@type": "Question",
              "name": "Rakebek yakuniy foydaga qanday ta'sir qiladi?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Rakebek to'langan komissiyaning bir qismini qaytaradi. Rake taxminan 10 BB/100 va bitim 70% bo'lganda o'yinchi 7 BB/100 ni qaytaradi — bu netto-winreytni 0 dan +7 bb/100 ga ko'taradi, ya'ni 10 000 qo'lga 700 BB yoki NL500 limitida $3500. Ko'pincha aynan rakebek nol natijani barqaror plyusga aylantiradi."
              }
            },
            {
              "@type": "Question",
              "name": "Qanday rakebek yuqori hisoblanadi?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Markazlashtirilgan rumlarda yuqori qaytarish stavkalari (60–70%) ulkan o'yin hajmlarini talab qiladi. Klub ilovalari darhol qat'iy 20–50% ni beradi, agentlik bitimlari esa — birinchi kundanoq 70% gacha."
              }
