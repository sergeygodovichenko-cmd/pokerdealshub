date: 2026-07-01T00:00:00.000Z
category: guide
title: "Влияние рейкбэка на винрейт в покере: математика, дисперсия и скрытая прибыль"
description: >-
  Как рейкбэк влияет на винрейт и реальную прибыль в покере: разбираем винрейт (bb/100), дисперсию и стандартное
  отклонение, рейковую нагрузку и модели рейкбэка — с формулами и примерами расчётов.
body: |-
  <article>

    <style>
      .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
      .pdh-fx sub{font-size:0.72em}
      .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
      .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
      .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
      .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
    </style>

    <p>Независимо от того, рассматриваете ли вы покер как развлечение или как источник дохода, ваш итоговый финансовый результат определяется тремя факторами:</p>
    <ul>
      <li>вашим преимуществом над соперниками — <strong>винрейтом</strong>;</li>
      <li><strong>структурой рейка</strong> (комиссии) за покерным столом;</li>
      <li>процентом <strong>рейкбэка</strong> — возврата части уплаченной комиссии.</li>
    </ul>

    <h2>I. Понятие винрейта и влияние дисперсии</h2>
    <p>Преимущество над полем, выраженное в винрейте, рассчитать сложнее всего. На него влияет множество постоянно меняющихся факторов, главный из которых — сила оппонентов за столом. К тому же на коротких дистанциях огромно влияние дисперсии: статистически значимый винрейт можно оценить только после десятков тысяч сыгранных рук.</p>
    <p>Винрейт принято измерять в больших блайндах на 100 раздач (<strong>bb/100</strong>). В аналитическом софте он чаще всего считается до уплаты комиссии (пре-рейк). Если вы не знаете свой точный винрейт, его можно приблизительно оценить по такой классификации:</p>
    <ul>
      <li><strong>Отрицательный винрейт</strong> — вы играете хуже соперников на своём лимите;</li>
      <li><strong>0 bb/100</strong> — игра в ноль, на уровне среднего оппонента;</li>
      <li><strong>1–10 bb/100</strong> — умеренное преимущество над полем;</li>
      <li><strong>10–20 bb/100 и выше</strong> — значительное преимущество (как правило, при регулярной игре против слабых соперников).</li>
    </ul>

    <h2>II. Стандартное отклонение и математика дистанции</h2>
    <p>Для анализа волатильности результатов используют стандартное отклонение (Standard Deviation, SD). Для кэш-игр в безлимитный холдем (NLH) оно составляет ориентировочно 100 bb/100, а в пятикарточной пот-лимит Омахе (PLO5) возрастает до 200–250 bb/100 из-за большей плотности сильных комбинаций.</p>
    <p>Критически важно понимать фундаментальное различие: винрейт растёт <strong>линейно</strong> с числом сыгранных рук, а стандартное отклонение — пропорционально <strong>квадратному корню</strong> из дистанции.</p>
    <p>Формула стандартного отклонения для произвольной дистанции выглядит так:</p>
    <div class="pdh-fx" role="math" dir="ltr" aria-label="SD на N интервалов равно SD на 100 рук, умноженному на квадратный корень из N">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
    <p>где <em>N</em> — количество сыгранных 100-руковых интервалов. Это приближение: оно предполагает независимость 100-руковых отрезков, но для практической оценки этого вполне достаточно.</p>

    <h3>Пример расчёта (до рейка)</h3>
    <p>Дистанция 10 000 рук в холдеме — это объём, который активный игрок отыгрывает за неделю за 1–2 столами. Поскольку винрейт и SD считаются на 100 рук, рассматриваем эту дистанцию как 100 интервалов (<em>N</em> = 100).</p>
    <p>Сначала посчитаем стандартное отклонение для всей дистанции:</p>
    <div class="pdh-fx" role="math" dir="ltr" aria-label="SD на 10 000 рук равно 100, умноженное на квадратный корень из 100, равно 1000 больших блайндов">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
    <p>Теперь сравним двух игроков (винрейт здесь — <strong>до рейка</strong>):</p>
    <ul>
      <li><strong>Успешный регуляр, +10 bb/100.</strong> Его математическое ожидание на дистанции — <strong>+1000 BB</strong>.</li>
      <li><strong>Проигрывающий любитель, −10 bb/100.</strong> Его математическое ожидание — <strong>−1000 BB</strong>.</li>
    </ul>
    <p>По правилу доверительных интервалов нормального распределения:</p>
    <table class="pdh-tbl">
      <thead><tr><th>Диапазон результата</th><th>Вероятность</th></tr></thead>
      <tbody>
        <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
        <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
        <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
      </tbody>
    </table>
    <p>Для успешного регуляра с вероятностью 68% результат за 10 000 рук окажется в диапазоне:</p>
    <div class="pdh-fx" role="math" dir="ltr" aria-label="EV плюс-минус 1 SD равно 1000 BB плюс-минус 1000 BB, то есть от 0 до 2000 больших блайндов">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
    <p>То есть даже с выдающимся винрейтом 10 bb/100 остаётся примерно 16% шанс (половина от оставшихся 32%) закончить неделю в минусе. И наоборот: проигрывающий игрок с той же вероятностью 68% покажет результат от −2000 до 0 BB — значит, у него тоже около 16% шансов закрыть дистанцию в плюс. Именно эта математическая особенность удерживает рекреационных игроков в экосистеме покера.</p>
    <p><strong>Но всё это — картина до вычета рейка.</strong> Что с ней делает комиссия — в следующем разделе.</p>

    <h2>III. Рейковая нагрузка: тихий убийца прибыли</h2>
    <p>Рейк — это комиссия, которую покер-рум берёт с каждого банка, дошедшего до флопа (в некоторых комнатах рейк берётся и на префлопе — по сценарию 3-бет-пас). Нагрузка определяется двумя параметрами: процентом рейка и его ограничением (капом, выраженным в BB). Чем выше эти показатели, тем сложнее выйти в чистый плюс. Если нужны основы — что такое рейк и рейкбэк и как они устроены — начните с гайда <a href="/ru/guides/rake-and-rakeback-in-poker/">«Рейк и рейкбэк в покере»</a>.</p>
    <p>Возьмём стандартные параметры для средних лимитов: рейк 5% и кап 5 BB. В зависимости от стиля игры (тайтовый или лузовый) за 100 раздач игрок в среднем уплачивает около 10 BB рейка.</p>
    <p>Вернёмся к нашему регуляру. За 10 000 рук (100 интервалов) рейк съедает:</p>
    <div class="pdh-fx" role="math" dir="ltr" aria-label="100 умножить на 10 больших блайндов равно 1000 больших блайндов — весь рейк за 10 000 рук">100 × 10 BB = 1000 BB</div>
    <p>Это ровно всё его математическое ожидание. Всё распределение сдвигается вниз на 1000 BB: <strong>нетто-матожидание становится нулевым</strong>, реальный коридор превращается в [−1000; +1000] BB, а шанс закончить неделю в минусе вырастает с 16% почти до <strong>50%</strong> — фактически подбрасывание монеты. Иными словами, отличное техническое преимущество +10 bb/100 <em>до</em> рейка после вычета комиссии даёт нетто-винрейт ровно 0 bb/100. Именно здесь возникает острая необходимость в эффективном рейкбэке.</p>

    <h2>IV. Рейкбэк как основа финансовой стабильности</h2>
    <p>Рейкбэк — это возврат части уплаченной комиссии обратно на ваш игровой счёт. Существует несколько моделей:</p>
    <ul>
      <li><strong>Прогрессивная (централизованные румы):</strong> возврат стартует с 10% и теоретически может достигать 60–70%. Но для высоких статусов нужно наиграть огромную дистанцию, выплачивая комиссию по заниженной ставке, — а это ведёт к потере стартового математического ожидания.</li>
      <li><strong>Статическая (<a href="/ru/deals/decentralized/">децентрализованные клубные приложения</a>):</strong> клубы предлагают фиксированный и понятный возврат от 20% до 50% с первого дня игры.</li>
      <li><strong>Агентская (например, NUTS POKER):</strong> клубы дают крупные партнёрские условия агентам, а те делятся рейкбэком напрямую с игроками — <a href="/ru/deals/">фиксированные сделки до 70%</a>. При этом агент выступает гарантом сохранности средств и выплаты выигрышей (за исключением нарушений правил платформы — запрещённого ПО, ботов или тимплея).</li>
    </ul>

    <h2>V. Практический пример: цена правильного выбора</h2>
    <p>Вернёмся к нашему регуляру. Он платит 10 BB комиссии за каждые 100 рук. С качественной <a href="/ru/deals/">рейкбэк-сделкой на 70%</a> он получает обратно 7 BB за каждые 100 рук — это поднимает его нетто-винрейт с 0 до <strong>+7 bb/100</strong>. Наглядно вся цепочка выглядит так:</p>
    <table class="pdh-tbl">
      <thead><tr><th>Показатель</th><th>bb/100</th></tr></thead>
      <tbody>
        <tr><td>Винрейт до рейка</td><td>+10</td></tr>
        <tr><td>Рейк</td><td>−10</td></tr>
        <tr><td><strong>Нетто без рейкбэка</strong></td><td><strong>0</strong></td></tr>
        <tr><td>Рейкбэк 70%</td><td>+7</td></tr>
        <tr><td><strong>Нетто с рейкбэком</strong></td><td><strong>+7</strong></td></tr>
      </tbody>
    </table>
    <p>На дистанции 10 000 раздач возврат составит <strong>700 BB</strong> чистой прибыли: нетто-матожидание снова уходит в плюс (+700 BB), распределение сдвигается вверх, и шанс закончить неделю в минусе падает с ~50% обратно примерно до 24%. Даже рекреационный игрок, играющий в минус, вернёт себе те же 700 BB и заметно снизит потери.</p>
    <p>Если эти игроки разыгрывают лимит NL500 ($2/$5, где 1 BB равен $5), недельная выплата чистого рейкбэка составит:</p>
    <div class="pdh-fx" role="math" dir="ltr" aria-label="700 больших блайндов умножить на 5 долларов равно 3500 долларов">700 BB × $5 = $3&#8239;500</div>
    <p>Именно поэтому при построении долгосрочной покерной карьеры категорически нельзя игнорировать условия рейкбэка. Игра в румах с высокой рейковой нагрузкой и без возврата комиссии — гарантированный способ лишить себя заслуженной прибыли. <a href="/ru/deals/">Сравнить актуальные рейкбэк-сделки</a> можно в каталоге PokerDealsHub.</p>

    <h2>Частые вопросы</h2>
    <h3>Что такое винрейт bb/100 и какой винрейт считается хорошим?</h3>
    <p>Винрейт — это средний выигрыш в больших блайндах на 100 раздач (bb/100), обычно до вычета рейка. 0 bb/100 — игра в ноль, 1–10 bb/100 — умеренное преимущество, 10–20 bb/100 и выше — сильное преимущество, характерное для игры против слабых соперников.</p>
    <h3>Почему можно проиграть неделю даже с винрейтом +10 bb/100?</h3>
    <p>Из-за дисперсии. На 10 000 рук стандартное отклонение равно 1000 BB, поэтому даже при винрейте +10 bb/100 до рейка (EV +1000 BB) результат с вероятностью 68% лежит в диапазоне [0; 2000] BB — около 16% шанс уйти в минус. А после вычета рейка нетто-матожидание падает до нуля, и без рейкбэка шанс закончить неделю в минусе — уже почти 50%.</p>
    <h3>Как рейкбэк влияет на итоговую прибыль?</h3>
    <p>Рейкбэк возвращает часть уплаченной комиссии. При рейке около 10 BB/100 и сделке 70% игрок возвращает 7 BB/100 — это поднимает нетто-винрейт с 0 до +7 bb/100, то есть 700 BB за 10 000 рук, или $3&#8239;500 на лимите NL500. Часто именно рейкбэк превращает нулевой результат в стабильный плюс.</p>
    <h3>Какой рейкбэк считается высоким?</h3>
    <p>В централизованных румах высокие ставки возврата (60–70%) требуют огромных объёмов игры. Клубные приложения дают фиксированные 20–50% сразу, а агентские сделки — до 70% с первого дня. Актуальные предложения собраны в каталоге <a href="/ru/deals/">PokerDealsHub</a>.</p>

