  id:
    title: "Pengaruh rakeback terhadap winrate di poker: matematika, variance, dan profit tersembunyi"
    description: >-
      Bagaimana rakeback memengaruhi winrate dan profit nyata di poker: kita bahas winrate (bb/100), variance dan
      standar deviasi, beban rake, serta model-model rakeback — lengkap dengan rumus dan contoh perhitungan.
    body: |-
      <article>

          <style>
          .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
          .pdh-fx sub{font-size:0.72em}
          .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
          .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
          .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
          .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
        </style>

          <p>Terlepas dari apakah Anda memandang poker sebagai hiburan atau sebagai sumber penghasilan, hasil finansial akhir Anda ditentukan oleh tiga faktor:</p>
          <ul>
            <li>keunggulan Anda atas lawan — <strong>winrate</strong>;</li>
            <li><strong>struktur rake</strong> (komisi) di meja poker;</li>
            <li>persentase <strong>rakeback</strong> — pengembalian sebagian komisi yang telah dibayarkan.</li>
          </ul>

          <h2>I. Konsep winrate dan pengaruh variance</h2>
          <p>Keunggulan atas lawan yang diukur dalam winrate adalah yang paling sulit dihitung. Banyak faktor yang terus berubah memengaruhinya, dan yang utama adalah kekuatan lawan di meja. Selain itu, pada jarak pendek pengaruh variance sangat besar: winrate yang signifikan secara statistik baru bisa dinilai setelah puluhan ribu tangan dimainkan.</p>
          <p>Winrate biasanya diukur dalam big blind per 100 tangan (<strong>bb/100</strong>). Di software analisis, angka ini paling sering dihitung sebelum komisi dipotong (pre-rake). Jika Anda tidak tahu winrate persis Anda, Anda bisa memperkirakannya secara kasar dengan klasifikasi berikut:</p>
          <ul>
            <li><strong>Winrate negatif</strong> — Anda bermain lebih buruk daripada lawan di limit Anda;</li>
            <li><strong>0 bb/100</strong> — bermain impas, setara dengan lawan rata-rata;</li>
            <li><strong>1–10 bb/100</strong> — keunggulan moderat atas lapangan;</li>
            <li><strong>10–20 bb/100 ke atas</strong> — keunggulan signifikan (biasanya saat bermain rutin melawan lawan yang lemah).</li>
          </ul>

          <h2>II. Standar deviasi dan matematika jarak</h2>
          <p>Untuk menganalisis volatilitas hasil digunakan standar deviasi (Standard Deviation, SD). Untuk cash game no-limit hold'em (NLH) nilainya berkisar sekitar 100 bb/100, sedangkan pada pot-limit Omaha lima kartu (PLO5) meningkat hingga 200–250 bb/100 karena kombinasi kuat muncul lebih rapat.</p>
          <p>Sangat penting untuk memahami perbedaan mendasar ini: winrate tumbuh <strong>secara linear</strong> seiring bertambahnya jumlah tangan yang dimainkan, sedangkan standar deviasi tumbuh sebanding dengan <strong>akar kuadrat</strong> dari jaraknya.</p>
          <p>Rumus standar deviasi untuk jarak sembarang terlihat seperti ini:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD untuk N interval sama dengan SD untuk 100 tangan dikalikan akar kuadrat dari N">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
          <p>di mana <em>N</em> adalah jumlah interval 100 tangan yang dimainkan. Ini adalah pendekatan: rumus ini mengasumsikan bahwa segmen-segmen 100 tangan saling independen, tetapi untuk perkiraan praktis hal itu sudah lebih dari cukup.</p>

          <h3>Contoh perhitungan (sebelum rake)</h3>
          <p>Jarak 10 000 tangan di hold'em adalah volume yang dimainkan oleh pemain aktif dalam seminggu di 1–2 meja. Karena winrate dan SD dihitung per 100 tangan, kita memandang jarak ini sebagai 100 interval (<em>N</em> = 100).</p>
          <p>Pertama, kita hitung standar deviasi untuk seluruh jarak:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD untuk 10 000 tangan sama dengan 100 dikalikan akar kuadrat dari 100 sama dengan 1000 big blind">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
          <p>Sekarang mari bandingkan dua pemain (winrate di sini adalah <strong>sebelum rake</strong>):</p>
          <ul>
            <li><strong>Regular yang sukses, +10 bb/100.</strong> Ekspektasi matematisnya pada jarak ini adalah <strong>+1000 BB</strong>.</li>
            <li><strong>Pemain amatir yang kalah, −10 bb/100.</strong> Ekspektasi matematisnya adalah <strong>−1000 BB</strong>.</li>
          </ul>
          <p>Menurut aturan interval kepercayaan pada distribusi normal:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Rentang hasil</th><th>Probabilitas</th></tr></thead>
            <tbody>
              <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
              <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
              <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
            </tbody>
          </table>
          <p>Untuk regular yang sukses, dengan probabilitas 68% hasil atas 10 000 tangan akan berada di rentang:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="EV plus minus 1 SD sama dengan 1000 BB plus minus 1000 BB, yaitu dari 0 hingga 2000 big blind">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
          <p>Artinya, bahkan dengan winrate luar biasa 10 bb/100, masih tersisa sekitar 16% peluang (setengah dari sisa 32%) untuk menutup pekan dalam kondisi rugi. Sebaliknya: pemain yang kalah dengan probabilitas 68% yang sama akan menunjukkan hasil dari −2000 hingga 0 BB — artinya ia juga punya sekitar 16% peluang menutup jarak dalam kondisi untung. Justru keunikan matematis inilah yang menahan para pemain rekreasi tetap berada dalam ekosistem poker.</p>
          <p><strong>Tapi semua ini adalah gambaran sebelum rake dipotong.</strong> Apa yang dilakukan komisi terhadap gambaran ini — kita bahas di bagian berikut.</p>

          <h2>III. Beban rake: pembunuh profit yang senyap</h2>
          <p>Rake adalah komisi yang diambil poker room dari setiap pot yang sampai ke flop (di sebagian room, rake juga diambil di preflop — dengan skenario 3-bet-fold). Bebannya ditentukan oleh dua parameter: persentase rake dan batasnya (cap, dinyatakan dalam BB). Semakin tinggi kedua angka ini, semakin sulit untuk keluar dalam untung bersih. Jika Anda butuh dasar-dasarnya — apa itu rake dan rakeback serta bagaimana keduanya bekerja — mulailah dari panduan <a href="/id/guides/rake-and-rakeback-in-poker/">«Rake dan rakeback di poker»</a>.</p>
          <p>Mari ambil parameter standar untuk limit menengah: rake 5% dan cap 5 BB. Tergantung gaya bermain (tight atau loose), per 100 tangan seorang pemain rata-rata membayar sekitar 10 BB rake.</p>
          <p>Kembali ke regular kita. Selama 10 000 tangan (100 interval), rake melahap:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="100 dikalikan 10 big blind sama dengan 1000 big blind — seluruh rake selama 10 000 tangan">100 × 10 BB = 1000 BB</div>
          <p>Itu persis seluruh ekspektasi matematisnya. Seluruh distribusi bergeser turun sebesar 1000 BB: <strong>ekspektasi neto menjadi nol</strong>, koridor nyatanya berubah menjadi [−1000; +1000] BB, dan peluang menutup pekan dalam kondisi rugi naik dari 16% menjadi hampir <strong>50%</strong> — praktis seperti melempar koin. Dengan kata lain, keunggulan teknis yang sangat baik +10 bb/100 <em>sebelum</em> rake, setelah komisi dipotong menghasilkan winrate neto tepat 0 bb/100. Di sinilah muncul kebutuhan mendesak akan rakeback yang efektif.</p>

          <h2>IV. Rakeback sebagai fondasi kestabilan finansial</h2>
          <p>Rakeback adalah pengembalian sebagian komisi yang telah dibayarkan kembali ke akun bermain Anda. Ada beberapa model:</p>
          <ul>
            <li><strong>Progresif (room tersentralisasi):</strong> pengembalian dimulai dari 10% dan secara teoretis bisa mencapai 60–70%. Namun untuk status tinggi Anda perlu memainkan jarak yang sangat besar sambil membayar komisi dengan tarif pengembalian yang rendah — dan ini menyebabkan hilangnya ekspektasi matematis awal.</li>
            <li><strong>Statis (<a href="/id/deals/decentralized/">aplikasi klub terdesentralisasi</a>):</strong> klub menawarkan pengembalian yang tetap dan jelas dari 20% hingga 50% sejak hari pertama bermain.</li>
            <li><strong>Keagenan (misalnya NUTS POKER):</strong> klub memberikan kondisi kemitraan yang besar kepada agen, dan agen membagikan rakeback langsung kepada pemain — <a href="/id/deals/">deal tetap hingga 70%</a>. Dalam hal ini agen bertindak sebagai penjamin keamanan dana dan pembayaran kemenangan (kecuali dalam kasus pelanggaran aturan platform — software terlarang, bot, atau team play).</li>
          </ul>

          <h2>V. Contoh praktis: harga dari pilihan yang tepat</h2>
          <p>Kembali ke regular kita. Ia membayar 10 BB komisi setiap 100 tangan. Dengan <a href="/id/deals/">deal rakeback berkualitas 70%</a> ia menerima kembali 7 BB setiap 100 tangan — ini menaikkan winrate neto-nya dari 0 menjadi <strong>+7 bb/100</strong>. Secara visual, seluruh rantainya terlihat seperti ini:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Indikator</th><th>bb/100</th></tr></thead>
            <tbody>
              <tr><td>Winrate sebelum rake</td><td>+10</td></tr>
              <tr><td>Rake</td><td>−10</td></tr>
              <tr><td><strong>Neto tanpa rakeback</strong></td><td><strong>0</strong></td></tr>
              <tr><td>Rakeback 70%</td><td>+7</td></tr>
              <tr><td><strong>Neto dengan rakeback</strong></td><td><strong>+7</strong></td></tr>
            </tbody>
          </table>
          <p>Pada jarak 10 000 tangan, pengembalian akan mencapai <strong>700 BB</strong> profit bersih: ekspektasi neto kembali menjadi positif (+700 BB), distribusi bergeser naik, dan peluang menutup pekan dalam kondisi rugi turun dari ~50% kembali menjadi sekitar 24%. Bahkan pemain rekreasi yang bermain dalam kondisi rugi akan mendapatkan kembali 700 BB yang sama dan menekan kerugiannya secara signifikan.</p>
          <p>Jika para pemain ini memainkan limit NL500 ($2/$5, di mana 1 BB setara dengan $5), pembayaran rakeback bersih mingguan akan berjumlah:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="700 big blind dikalikan 5 dolar sama dengan 3500 dolar">700 BB × $5 = $3&#8239;500</div>
          <p>Itulah sebabnya, saat membangun karier poker jangka panjang, kondisi rakeback sama sekali tidak boleh diabaikan. Bermain di room dengan beban rake tinggi dan tanpa pengembalian komisi adalah cara pasti untuk merampas profit yang layak Anda dapatkan. Anda bisa <a href="/id/deals/">membandingkan deal rakeback terkini</a> di katalog PokerDealsHub.</p>

          <h2>Pertanyaan yang sering diajukan</h2>
          <h3>Apa itu winrate bb/100 dan winrate berapa yang dianggap bagus?</h3>
          <p>Winrate adalah rata-rata kemenangan dalam big blind per 100 tangan (bb/100), biasanya sebelum rake dipotong. 0 bb/100 — bermain impas, 1–10 bb/100 — keunggulan moderat, 10–20 bb/100 ke atas — keunggulan kuat yang khas untuk bermain melawan lawan yang lemah.</p>
          <h3>Mengapa Anda bisa kalah dalam sepekan bahkan dengan winrate +10 bb/100?</h3>
          <p>Karena variance. Pada 10 000 tangan, standar deviasi sama dengan 1000 BB, sehingga bahkan dengan winrate +10 bb/100 sebelum rake (EV +1000 BB), hasilnya dengan probabilitas 68% berada di rentang [0; 2000] BB — sekitar 16% peluang untuk merugi. Dan setelah rake dipotong, ekspektasi neto turun menjadi nol, dan tanpa rakeback peluang menutup pekan dalam kondisi rugi sudah hampir 50%.</p>
          <h3>Bagaimana rakeback memengaruhi profit akhir?</h3>
          <p>Rakeback mengembalikan sebagian komisi yang telah dibayarkan. Dengan rake sekitar 10 BB/100 dan deal 70%, pemain mendapatkan kembali 7 BB/100 — ini menaikkan winrate neto dari 0 menjadi +7 bb/100, yaitu 700 BB per 10 000 tangan, atau $3&#8239;500 pada limit NL500. Sering kali justru rakeback-lah yang mengubah hasil nol menjadi keuntungan yang stabil.</p>
          <h3>Rakeback berapa yang dianggap tinggi?</h3>
          <p>Di room tersentralisasi, tarif pengembalian tinggi (60–70%) menuntut volume permainan yang sangat besar. Aplikasi klub memberikan 20–50% tetap secara langsung, sedangkan deal keagenan — hingga 70% sejak hari pertama. Penawaran terkini dikumpulkan di katalog <a href="/id/deals/">PokerDealsHub</a>.</p>

