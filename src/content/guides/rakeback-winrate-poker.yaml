  es:
    title: "Cómo influye el rakeback en el winrate en el póker: matemáticas, varianza y ganancia oculta"
    description: >-
      Cómo influye el rakeback en el winrate y la ganancia real en el póker: analizamos el winrate (bb/100), la varianza
      y la desviación estándar, la carga de rake y los modelos de rakeback, con fórmulas y ejemplos de cálculo.
    body: |-
      <article>

          <style>
          .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
          .pdh-fx sub{font-size:0.72em}
          .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
          .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
          .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
          .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
        </style>

          <p>Ya sea que veas el póker como un entretenimiento o como una fuente de ingresos, tu resultado financiero final lo determinan tres factores:</p>
          <ul>
            <li>tu ventaja sobre los rivales, es decir, tu <strong>winrate</strong>;</li>
            <li>la <strong>estructura del rake</strong> (la comisión) en la mesa de póker;</li>
            <li>el porcentaje de <strong>rakeback</strong>, la devolución de parte de la comisión pagada.</li>
          </ul>

          <h2>I. El concepto de winrate y el impacto de la varianza</h2>
          <p>La ventaja sobre el campo, expresada en winrate, es lo más difícil de calcular. Sobre ella influyen numerosos factores en constante cambio, y el principal es la fuerza de los oponentes en la mesa. Además, en distancias cortas el impacto de la varianza es enorme: solo se puede estimar un winrate estadísticamente significativo después de decenas de miles de manos jugadas.</p>
          <p>El winrate suele medirse en grandes ciegas por cada 100 manos (<strong>bb/100</strong>). En el software de análisis lo más habitual es calcularlo antes de la comisión (pre-rake). Si no conoces tu winrate exacto, puedes estimarlo de forma aproximada con esta clasificación:</p>
          <ul>
            <li><strong>Winrate negativo</strong>: juegas peor que tus rivales en tu límite;</li>
            <li><strong>0 bb/100</strong>: juegas a la par, al nivel del oponente promedio;</li>
            <li><strong>1–10 bb/100</strong>: ventaja moderada sobre el campo;</li>
            <li><strong>10–20 bb/100 y más</strong>: ventaja considerable (por lo general, jugando de forma regular contra rivales débiles).</li>
          </ul>

          <h2>II. La desviación estándar y las matemáticas de la distancia</h2>
          <p>Para analizar la volatilidad de los resultados se utiliza la desviación estándar (Standard Deviation, SD). Para las partidas de cash de hold'em sin límite (NLH) ronda los 100 bb/100, mientras que en el Omaha pot-limit de cinco cartas (PLO5) aumenta hasta 200–250 bb/100 debido a la mayor densidad de combinaciones fuertes.</p>
          <p>Es fundamental entender una diferencia esencial: el winrate crece de forma <strong>lineal</strong> con el número de manos jugadas, mientras que la desviación estándar lo hace de forma proporcional a la <strong>raíz cuadrada</strong> de la distancia.</p>
          <p>La fórmula de la desviación estándar para una distancia arbitraria es la siguiente:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD para N intervalos es igual a SD para 100 manos multiplicado por la raíz cuadrada de N">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
          <p>donde <em>N</em> es el número de intervalos de 100 manos jugados. Es una aproximación: supone la independencia de los tramos de 100 manos, pero para una estimación práctica resulta más que suficiente.</p>

          <h3>Ejemplo de cálculo (antes del rake)</h3>
          <p>Una distancia de 10 000 manos en hold'em es el volumen que un jugador activo completa en una semana jugando en 1–2 mesas. Como el winrate y la SD se calculan por cada 100 manos, tratamos esta distancia como 100 intervalos (<em>N</em> = 100).</p>
          <p>Primero calculamos la desviación estándar para toda la distancia:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD para 10 000 manos es igual a 100 multiplicado por la raíz cuadrada de 100, igual a 1000 grandes ciegas">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
          <p>Ahora comparemos a dos jugadores (aquí el winrate es <strong>antes del rake</strong>):</p>
          <ul>
            <li><strong>Regular exitoso, +10 bb/100.</strong> Su esperanza matemática en la distancia es <strong>+1000 BB</strong>.</li>
            <li><strong>Aficionado perdedor, −10 bb/100.</strong> Su esperanza matemática es <strong>−1000 BB</strong>.</li>
          </ul>
          <p>Según la regla de los intervalos de confianza de la distribución normal:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Rango del resultado</th><th>Probabilidad</th></tr></thead>
            <tbody>
              <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
              <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
              <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
            </tbody>
          </table>
          <p>Para el regular exitoso, con una probabilidad del 68% el resultado de las 10 000 manos quedará en el rango:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="EV más menos 1 SD es igual a 1000 BB más menos 1000 BB, es decir, de 0 a 2000 grandes ciegas">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
          <p>Es decir, incluso con un winrate sobresaliente de 10 bb/100 sigue existiendo alrededor de un 16% de probabilidad (la mitad del 32% restante) de terminar la semana en pérdidas. Y al revés: el jugador perdedor mostrará, con esa misma probabilidad del 68%, un resultado de entre −2000 y 0 BB, lo que significa que también tiene cerca de un 16% de probabilidades de cerrar la distancia en positivo. Es precisamente esta particularidad matemática la que mantiene a los jugadores recreativos dentro del ecosistema del póker.</p>
          <p><strong>Pero todo esto es el panorama antes de descontar el rake.</strong> Lo que la comisión le hace a ese panorama lo veremos en la siguiente sección.</p>

          <h2>III. La carga de rake: el asesino silencioso de la ganancia</h2>
          <p>El rake es la comisión que la sala de póker cobra de cada bote que llega al flop (en algunas salas el rake se cobra también en el preflop, en el escenario 3-bet-fold). La carga la determinan dos parámetros: el porcentaje de rake y su tope (el cap, expresado en BB). Cuanto más altos sean estos valores, más difícil será salir en positivo neto. Si necesitas los fundamentos —qué son el rake y el rakeback y cómo funcionan— empieza por la guía <a href="/es/guides/rake-and-rakeback-in-poker/">«Rake y rakeback en el póker»</a>.</p>
          <p>Tomemos parámetros estándar para límites medios: rake del 5% y cap de 5 BB. Según el estilo de juego (tight o loose), en 100 manos un jugador paga de media unos 10 BB de rake.</p>
          <p>Volvamos a nuestro regular. En 10 000 manos (100 intervalos) el rake se lleva:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="100 multiplicado por 10 grandes ciegas es igual a 1000 grandes ciegas, todo el rake de las 10 000 manos">100 × 10 BB = 1000 BB</div>
          <p>Esto es exactamente toda su esperanza matemática. Toda la distribución se desplaza hacia abajo en 1000 BB: <strong>la esperanza matemática neta se vuelve nula</strong>, el rango real se convierte en [−1000; +1000] BB, y la probabilidad de terminar la semana en pérdidas sube del 16% hasta casi el <strong>50%</strong>, es decir, prácticamente lanzar una moneda al aire. En otras palabras, una excelente ventaja técnica de +10 bb/100 <em>antes</em> del rake, tras descontar la comisión, deja un winrate neto de exactamente 0 bb/100. Es aquí donde surge la necesidad imperiosa de un rakeback eficaz.</p>

          <h2>IV. El rakeback como base de la estabilidad financiera</h2>
          <p>El rakeback es la devolución de parte de la comisión pagada a tu cuenta de juego. Existen varios modelos:</p>
          <ul>
            <li><strong>Progresivo (salas centralizadas):</strong> la devolución arranca en el 10% y, en teoría, puede llegar al 60–70%. Pero para alcanzar los estatus altos hay que jugar una distancia enorme pagando la comisión a una tasa de devolución reducida, y eso lleva a perder la esperanza matemática inicial.</li>
            <li><strong>Estático (<a href="/es/deals/decentralized/">aplicaciones de clubes descentralizadas</a>):</strong> los clubes ofrecen una devolución fija y clara del 20% al 50% desde el primer día de juego.</li>
            <li><strong>De agencia (por ejemplo, NUTS POKER):</strong> los clubes conceden grandes condiciones de socio a los agentes, y estos comparten el rakeback directamente con los jugadores mediante <a href="/es/deals/">acuerdos fijos de hasta el 70%</a>. Además, el agente actúa como garante de la seguridad de los fondos y del pago de las ganancias (salvo en casos de infracción de las reglas de la plataforma: software prohibido, bots o juego en equipo).</li>
          </ul>

          <h2>V. Ejemplo práctico: el precio de elegir bien</h2>
          <p>Volvamos a nuestro regular. Paga 10 BB de comisión por cada 100 manos. Con un buen <a href="/es/deals/">acuerdo de rakeback del 70%</a> recupera 7 BB por cada 100 manos, y eso eleva su winrate neto de 0 a <strong>+7 bb/100</strong>. Toda la cadena se ve así de claramente:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Indicador</th><th>bb/100</th></tr></thead>
            <tbody>
              <tr><td>Winrate antes del rake</td><td>+10</td></tr>
              <tr><td>Rake</td><td>−10</td></tr>
              <tr><td><strong>Neto sin rakeback</strong></td><td><strong>0</strong></td></tr>
              <tr><td>Rakeback 70%</td><td>+7</td></tr>
              <tr><td><strong>Neto con rakeback</strong></td><td><strong>+7</strong></td></tr>
            </tbody>
          </table>
          <p>En una distancia de 10 000 manos la devolución supondrá <strong>700 BB</strong> de ganancia limpia: la esperanza matemática neta vuelve a ser positiva (+700 BB), la distribución se desplaza hacia arriba y la probabilidad de terminar la semana en pérdidas cae desde ~50% de nuevo hasta cerca del 24%. Incluso un jugador recreativo que juega en pérdidas recuperará esos mismos 700 BB y reducirá notablemente sus pérdidas.</p>
          <p>Si estos jugadores disputan el límite NL500 ($2/$5, donde 1 BB equivale a $5), el pago semanal de rakeback limpio será:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="700 grandes ciegas multiplicado por 5 dólares es igual a 3500 dólares">700 BB × $5 = $3&#8239;500</div>
          <p>Por eso, al construir una carrera de póker a largo plazo, es absolutamente imprescindible no ignorar las condiciones de rakeback. Jugar en salas con una carga de rake alta y sin devolución de la comisión es una forma garantizada de privarte de la ganancia que mereces. Puedes <a href="/es/deals/">comparar los acuerdos de rakeback vigentes</a> en el catálogo de PokerDealsHub.</p>

          <h2>Preguntas frecuentes</h2>
          <h3>¿Qué es el winrate bb/100 y qué winrate se considera bueno?</h3>
          <p>El winrate es la ganancia media en grandes ciegas por cada 100 manos (bb/100), normalmente antes de descontar el rake. 0 bb/100 significa jugar a la par; 1–10 bb/100 es una ventaja moderada; 10–20 bb/100 y más es una ventaja fuerte, propia del juego contra rivales débiles.</p>
          <h3>¿Por qué se puede perder una semana incluso con un winrate de +10 bb/100?</h3>
          <p>Por la varianza. En 10 000 manos la desviación estándar es de 1000 BB, así que incluso con un winrate de +10 bb/100 antes del rake (EV +1000 BB) el resultado, con una probabilidad del 68%, queda en el rango [0; 2000] BB, con cerca de un 16% de probabilidad de acabar en pérdidas. Y tras descontar el rake, la esperanza matemática neta cae a cero, y sin rakeback la probabilidad de terminar la semana en pérdidas ya es de casi el 50%.</p>
          <h3>¿Cómo influye el rakeback en la ganancia final?</h3>
          <p>El rakeback devuelve parte de la comisión pagada. Con un rake de unos 10 BB/100 y un acuerdo del 70%, el jugador recupera 7 BB/100, lo que eleva el winrate neto de 0 a +7 bb/100, es decir, 700 BB en 10 000 manos, o $3&#8239;500 en el límite NL500. A menudo es precisamente el rakeback lo que convierte un resultado nulo en un positivo estable.</p>
          <h3>¿Qué rakeback se considera alto?</h3>
          <p>En las salas centralizadas, las tasas de devolución altas (60–70%) exigen volúmenes de juego enormes. Las aplicaciones de clubes dan un 20–50% fijo de inmediato, y los acuerdos de agencia, hasta el 70% desde el primer día. Las ofertas vigentes están reunidas en el catálogo de <a href="/es/deals/">PokerDealsHub</a>.</p>

