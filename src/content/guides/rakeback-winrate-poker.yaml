  uk:
    title: "Вплив рейкбеку на вінрейт у покері: математика, дисперсія та прихований прибуток"
    description: >-
      Як рейкбек впливає на вінрейт і реальний прибуток у покері: розбираємо вінрейт (bb/100), дисперсію та стандартне
      відхилення, рейкове навантаження та моделі рейкбеку — з формулами й прикладами розрахунків.
    body: |-
      <article>

          <style>
          .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
          .pdh-fx sub{font-size:0.72em}
          .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
          .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
          .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
          .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
        </style>

          <p>Незалежно від того, чи розглядаєте ви покер як розвагу, чи як джерело доходу, ваш підсумковий фінансовий результат визначається трьома чинниками:</p>
          <ul>
            <li>вашою перевагою над суперниками — <strong>вінрейтом</strong>;</li>
            <li><strong>структурою рейку</strong> (комісії) за покерним столом;</li>
            <li>відсотком <strong>рейкбеку</strong> — поверненням частини сплаченої комісії.</li>
          </ul>

          <h2>I. Поняття вінрейту та вплив дисперсії</h2>
          <p>Перевагу над полем, виражену у вінрейті, розрахувати найскладніше. На неї впливає безліч чинників, що постійно змінюються, головний із яких — сила опонентів за столом. До того ж на коротких дистанціях величезним є вплив дисперсії: статистично значущий вінрейт можна оцінити лише після десятків тисяч зіграних роздач.</p>
          <p>Вінрейт прийнято вимірювати у великих блайндах на 100 роздач (<strong>bb/100</strong>). В аналітичному софті його найчастіше рахують до сплати комісії (пре-рейк). Якщо ви не знаєте свого точного вінрейту, його можна приблизно оцінити за такою класифікацією:</p>
          <ul>
            <li><strong>Від'ємний вінрейт</strong> — ви граєте гірше за суперників на своєму ліміті;</li>
            <li><strong>0 bb/100</strong> — гра в нуль, на рівні середнього опонента;</li>
            <li><strong>1–10 bb/100</strong> — помірна перевага над полем;</li>
            <li><strong>10–20 bb/100 і вище</strong> — значна перевага (як правило, за регулярної гри проти слабких суперників).</li>
          </ul>

          <h2>II. Стандартне відхилення та математика дистанції</h2>
          <p>Для аналізу волатильності результатів використовують стандартне відхилення (Standard Deviation, SD). Для кеш-ігор у безлімітний холдем (NLH) воно становить орієнтовно 100 bb/100, а в п'ятикартковій пот-лімітній Омасі (PLO5) зростає до 200–250 bb/100 через більшу щільність сильних комбінацій.</p>
          <p>Критично важливо розуміти фундаментальну відмінність: вінрейт зростає <strong>лінійно</strong> з кількістю зіграних роздач, а стандартне відхилення — пропорційно <strong>квадратному кореню</strong> з дистанції.</p>
          <p>Формула стандартного відхилення для довільної дистанції має такий вигляд:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD на N інтервалів дорівнює SD на 100 роздач, помноженому на квадратний корінь з N">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
          <p>де <em>N</em> — кількість зіграних 100-роздачних інтервалів. Це наближення: воно припускає незалежність 100-роздачних відрізків, але для практичної оцінки цього цілком достатньо.</p>

          <h3>Приклад розрахунку (до рейку)</h3>
          <p>Дистанція 10 000 роздач у холдемі — це обсяг, який активний гравець відіграє за тиждень за 1–2 столами. Оскільки вінрейт і SD рахують на 100 роздач, розглядаємо цю дистанцію як 100 інтервалів (<em>N</em> = 100).</p>
          <p>Спершу порахуємо стандартне відхилення для всієї дистанції:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD на 10 000 роздач дорівнює 100, помноженому на квадратний корінь з 100, дорівнює 1000 великих блайндів">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
          <p>Тепер порівняємо двох гравців (вінрейт тут — <strong>до рейку</strong>):</p>
          <ul>
            <li><strong>Успішний регуляр, +10 bb/100.</strong> Його математичне сподівання на дистанції — <strong>+1000 BB</strong>.</li>
            <li><strong>Програшний любитель, −10 bb/100.</strong> Його математичне сподівання — <strong>−1000 BB</strong>.</li>
          </ul>
          <p>За правилом довірчих інтервалів нормального розподілу:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Діапазон результату</th><th>Імовірність</th></tr></thead>
            <tbody>
              <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
              <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
              <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
            </tbody>
          </table>
          <p>Для успішного регуляра з імовірністю 68% результат за 10 000 роздач опиниться в діапазоні:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="EV плюс-мінус 1 SD дорівнює 1000 BB плюс-мінус 1000 BB, тобто від 0 до 2000 великих блайндів">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
          <p>Тобто навіть із видатним вінрейтом 10 bb/100 залишається приблизно 16% шанс (половина від решти 32%) завершити тиждень у мінусі. І навпаки: програшний гравець із тією самою ймовірністю 68% покаже результат від −2000 до 0 BB — отже, у нього теж близько 16% шансів закрити дистанцію в плюс. Саме ця математична особливість утримує рекреаційних гравців в екосистемі покеру.</p>
          <p><strong>Але все це — картина до вирахування рейку.</strong> Що з нею робить комісія — у наступному розділі.</p>

          <h2>III. Рейкове навантаження: тихий убивця прибутку</h2>
          <p>Рейк — це комісія, яку покер-рум бере з кожного банку, що дійшов до флопу (у деяких кімнатах рейк беруть і на префлопі — за сценарієм 3-бет-пас). Навантаження визначається двома параметрами: відсотком рейку та його обмеженням (капом, вираженим у BB). Що вищі ці показники, то важче вийти в чистий плюс. Якщо потрібні основи — що таке рейк і рейкбек і як вони влаштовані — почніть із гайду <a href="/uk/guides/rake-and-rakeback-in-poker/">«Рейк і рейкбек у покері»</a>.</p>
          <p>Візьмемо стандартні параметри для середніх лімітів: рейк 5% і кап 5 BB. Залежно від стилю гри (тайтового чи лузового) за 100 роздач гравець у середньому сплачує близько 10 BB рейку.</p>
          <p>Повернімося до нашого регуляра. За 10 000 роздач (100 інтервалів) рейк з'їдає:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="100 помножити на 10 великих блайндів дорівнює 1000 великих блайндів — весь рейк за 10 000 роздач">100 × 10 BB = 1000 BB</div>
          <p>Це рівно все його математичне сподівання. Увесь розподіл зсувається вниз на 1000 BB: <strong>нетто-сподівання стає нульовим</strong>, реальний коридор перетворюється на [−1000; +1000] BB, а шанс завершити тиждень у мінусі зростає з 16% майже до <strong>50%</strong> — фактично підкидання монети. Інакше кажучи, чудова технічна перевага +10 bb/100 <em>до</em> рейку після вирахування комісії дає нетто-вінрейт рівно 0 bb/100. Саме тут виникає гостра потреба в ефективному рейкбеку.</p>

          <h2>IV. Рейкбек як основа фінансової стабільності</h2>
          <p>Рейкбек — це повернення частини сплаченої комісії назад на ваш ігровий рахунок. Існує кілька моделей:</p>
          <ul>
            <li><strong>Прогресивна (централізовані руми):</strong> повернення стартує з 10% і теоретично може сягати 60–70%. Але для високих статусів потрібно награти величезну дистанцію, сплачуючи комісію за заниженою ставкою, — а це веде до втрати стартового математичного сподівання.</li>
            <li><strong>Статична (<a href="/uk/deals/decentralized/">децентралізовані клубні застосунки</a>):</strong> клуби пропонують фіксоване та зрозуміле повернення від 20% до 50% з першого дня гри.</li>
            <li><strong>Агентська (наприклад, NUTS POKER):</strong> клуби дають великі партнерські умови агентам, а ті діляться рейкбеком безпосередньо з гравцями — <a href="/uk/deals/">фіксовані угоди до 70%</a>. При цьому агент виступає гарантом збереження коштів і виплати виграшів (за винятком порушень правил платформи — забороненого ПЗ, ботів або тимплею).</li>
          </ul>

          <h2>V. Практичний приклад: ціна правильного вибору</h2>
          <p>Повернімося до нашого регуляра. Він платить 10 BB комісії за кожні 100 роздач. З якісною <a href="/uk/deals/">рейкбек-угодою на 70%</a> він отримує назад 7 BB за кожні 100 роздач — це піднімає його нетто-вінрейт з 0 до <strong>+7 bb/100</strong>. Наочно весь ланцюжок має такий вигляд:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Показник</th><th>bb/100</th></tr></thead>
            <tbody>
              <tr><td>Вінрейт до рейку</td><td>+10</td></tr>
              <tr><td>Рейк</td><td>−10</td></tr>
              <tr><td><strong>Нетто без рейкбеку</strong></td><td><strong>0</strong></td></tr>
              <tr><td>Рейкбек 70%</td><td>+7</td></tr>
              <tr><td><strong>Нетто з рейкбеком</strong></td><td><strong>+7</strong></td></tr>
            </tbody>
          </table>
          <p>На дистанції 10 000 роздач повернення становитиме <strong>700 BB</strong> чистого прибутку: нетто-сподівання знову йде в плюс (+700 BB), розподіл зсувається вгору, і шанс завершити тиждень у мінусі падає з ~50% назад приблизно до 24%. Навіть рекреаційний гравець, який грає в мінус, поверне собі ті самі 700 BB і помітно знизить втрати.</p>
          <p>Якщо ці гравці розігрують ліміт NL500 ($2/$5, де 1 BB дорівнює $5), тижнева виплата чистого рейкбеку становитиме:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="700 великих блайндів помножити на 5 доларів дорівнює 3500 доларів">700 BB × $5 = $3&#8239;500</div>
          <p>Саме тому під час побудови довгострокової покерної кар'єри категорично не можна ігнорувати умови рейкбеку. Гра в румах із високим рейковим навантаженням і без повернення комісії — гарантований спосіб позбавити себе заслуженого прибутку. <a href="/uk/deals/">Порівняти актуальні рейкбек-угоди</a> можна в каталозі PokerDealsHub.</p>

          <h2>Часті запитання</h2>
          <h3>Що таке вінрейт bb/100 і який вінрейт вважається хорошим?</h3>
          <p>Вінрейт — це середній виграш у великих блайндах на 100 роздач (bb/100), зазвичай до вирахування рейку. 0 bb/100 — гра в нуль, 1–10 bb/100 — помірна перевага, 10–20 bb/100 і вище — сильна перевага, характерна для гри проти слабких суперників.</p>
          <h3>Чому можна програти тиждень навіть із вінрейтом +10 bb/100?</h3>
          <p>Через дисперсію. На 10 000 роздач стандартне відхилення дорівнює 1000 BB, тому навіть за вінрейту +10 bb/100 до рейку (EV +1000 BB) результат з імовірністю 68% лежить у діапазоні [0; 2000] BB — близько 16% шанс піти в мінус. А після вирахування рейку нетто-сподівання падає до нуля, і без рейкбеку шанс завершити тиждень у мінусі — уже майже 50%.</p>
          <h3>Як рейкбек впливає на підсумковий прибуток?</h3>
          <p>Рейкбек повертає частину сплаченої комісії. За рейку близько 10 BB/100 і угоди 70% гравець повертає 7 BB/100 — це піднімає нетто-вінрейт з 0 до +7 bb/100, тобто 700 BB за 10 000 роздач, або $3&#8239;500 на ліміті NL500. Часто саме рейкбек перетворює нульовий результат на стабільний плюс.</p>
          <h3>Який рейкбек вважається високим?</h3>
          <p>У централізованих румах високі ставки повернення (60–70%) вимагають величезних обсягів гри. Клубні застосунки дають фіксовані 20–50% одразу, а агентські угоди — до 70% з першого дня. Актуальні пропозиції зібрані в каталозі <a href="/uk/deals/">PokerDealsHub</a>.</p>

