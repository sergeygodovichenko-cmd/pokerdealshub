                  "text": "Winrate, 100 elde büyük blind cinsinden ortalama kazançtır (bb/100) ve genellikle rake düşülmeden önce hesaplanır. 0 bb/100 başa baş oyun, 1–10 bb/100 ölçülü bir üstünlük, 10–20 bb/100 ve üzeri ise zayıf rakiplere karşı oyuna özgü güçlü bir üstünlüktür."
                }
              },
              {
                "@type": "Question",
                "name": "+10 bb/100 winrate'le bile bir hafta neden kaybedilebilir?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Variance yüzünden. 10 000 elde standart sapma 1000 BB'dir, bu nedenle rake öncesi +10 bb/100 winrate'le bile (EV +1000 BB) sonuç %68 olasılıkla [0; 2000] BB aralığında yer alır — ekside kapatma ihtimali yaklaşık %16. Rake düşüldükten sonra ise net beklenti sıfıra iner ve rakeback olmadan haftayı ekside kapatma ihtimali neredeyse %50 olur."
                }
              },
              {
                "@type": "Question",
                "name": "Rakeback nihai kârı nasıl etkiler?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Rakeback, ödenen komisyonun bir kısmını geri verir. Yaklaşık 10 BB/100 rake ve %70'lik bir deal'de oyuncu 7 BB/100 geri alır — bu, net winrate'i 0'dan +7 bb/100'e, yani 10 000 elde 700 BB'ye ya da NL500 limitinde $3500'e yükseltir. Çoğu zaman sıfır sonucu istikrarlı bir artıya çeviren şey tam da rakeback'tir."
                }
              },
              {
                "@type": "Question",
                "name": "Hangi rakeback yüksek sayılır?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Centralized odalarda yüksek iade oranları (%60–70) devasa oyun hacmi gerektirir. Kulüp uygulamaları anında sabit %20–50 verir, ajans deal'leri ise ilk günden itibaren %70'e kadar."
                }
              }
            ]
          }
          </script>

