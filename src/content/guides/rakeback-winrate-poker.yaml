i18n:
  en:
    title: "How rakeback affects your poker winrate: the math, variance and hidden profit"
    description: >-
      How rakeback affects your winrate and real profit in poker: we break down winrate (bb/100), variance and standard
      deviation, rake load and rakeback models — with formulas and worked examples.
    body: |-
      <article>

          <style>
          .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
          .pdh-fx sub{font-size:0.72em}
          .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
          .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
          .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
          .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
        </style>

          <p>Whether you treat poker as entertainment or as a source of income, your bottom-line financial result comes down to three factors:</p>
          <ul>
            <li>your edge over your opponents — your <strong>winrate</strong>;</li>
            <li>the <strong>rake structure</strong> (the commission) at the poker table;</li>
            <li>your <strong>rakeback</strong> percentage — the share of the paid commission that is returned to you.</li>
          </ul>

          <h2>I. Understanding winrate and the impact of variance</h2>
          <p>Your edge over the field, expressed as a winrate, is the hardest of the three to pin down. It is shaped by a host of constantly shifting factors, the most important being the strength of the opponents at your table. On top of that, over short samples the impact of variance is enormous: a statistically meaningful winrate can only be estimated after tens of thousands of hands played.</p>
          <p>Winrate is conventionally measured in big blinds per 100 hands (<strong>bb/100</strong>). In tracking software it is most often calculated before the commission is taken (pre-rake). If you don't know your exact winrate, you can roughly estimate it using this classification:</p>
          <ul>
            <li><strong>A negative winrate</strong> — you play worse than your opponents at your stake;</li>
            <li><strong>0 bb/100</strong> — a break-even game, on par with the average opponent;</li>
            <li><strong>1–10 bb/100</strong> — a moderate edge over the field;</li>
            <li><strong>10–20 bb/100 and above</strong> — a significant edge (usually from regularly playing against weak opponents).</li>
          </ul>

          <h2>II. Standard deviation and the math of the long run</h2>
          <p>To analyze the volatility of your results, we use standard deviation (SD). For No-Limit Hold'em (NLH) cash games it runs at roughly 100 bb/100, while in 5-card Pot-Limit Omaha (PLO5) it climbs to 200–250 bb/100 because of the higher density of strong hands.</p>
          <p>It is critical to understand one fundamental difference: winrate grows <strong>linearly</strong> with the number of hands played, whereas standard deviation grows in proportion to the <strong>square root</strong> of the sample.</p>
          <p>The formula for standard deviation over an arbitrary sample looks like this:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD over N intervals equals SD over 100 hands multiplied by the square root of N">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
          <p>where <em>N</em> is the number of 100-hand intervals played. This is an approximation: it assumes the 100-hand segments are independent, but for a practical estimate that is perfectly adequate.</p>

          <h3>A worked example (before rake)</h3>
          <p>A sample of 10,000 hands in Hold'em is the volume an active player racks up in a week on 1–2 tables. Since winrate and SD are measured per 100 hands, we treat this sample as 100 intervals (<em>N</em> = 100).</p>
          <p>First, let's calculate the standard deviation for the entire sample:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD over 10,000 hands equals 100 multiplied by the square root of 100, equals 1000 big blinds">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
          <p>Now let's compare two players (winrate here is <strong>before rake</strong>):</p>
          <ul>
            <li><strong>A winning regular, +10 bb/100.</strong> His expected value over the sample is <strong>+1000 BB</strong>.</li>
            <li><strong>A losing recreational player, −10 bb/100.</strong> His expected value is <strong>−1000 BB</strong>.</li>
          </ul>
          <p>By the confidence-interval rule for the normal distribution:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Result range</th><th>Probability</th></tr></thead>
            <tbody>
              <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
              <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
              <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
            </tbody>
          </table>
          <p>For the winning regular, there is a 68% probability that his result over 10,000 hands lands in the range:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="EV plus or minus 1 SD equals 1000 BB plus or minus 1000 BB, that is from 0 to 2000 big blinds">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
          <p>In other words, even with an outstanding winrate of 10 bb/100 there remains roughly a 16% chance (half of the remaining 32%) of finishing the week in the red. And conversely: the losing player has, with the same 68% probability, a result between −2000 and 0 BB — meaning he too has about a 16% chance of closing the sample in profit. It is precisely this mathematical quirk that keeps recreational players in the poker ecosystem.</p>
          <p><strong>But all of this is the picture before rake is deducted.</strong> What the commission does to it comes in the next section.</p>

          <h2>III. Rake load: the silent profit killer</h2>
          <p>Rake is the commission the poker room takes from every pot that reaches the flop (in some rooms rake is also taken preflop — on a 3-bet-fold scenario). The load is defined by two parameters: the rake percentage and its cap (expressed in BB). The higher these figures, the harder it is to turn a clean profit. If you need the basics — what rake and rakeback are and how they work — start with the guide <a href="/en/guides/rake-and-rakeback-in-poker/">"Rake and rakeback in poker"</a>.</p>
          <p>Let's take standard parameters for mid stakes: 5% rake with a 5 BB cap. Depending on playing style (tight or loose), over 100 hands a player pays on average about 10 BB in rake.</p>
          <p>Back to our regular. Over 10,000 hands (100 intervals) the rake eats up:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="100 multiplied by 10 big blinds equals 1000 big blinds — the total rake over 10,000 hands">100 × 10 BB = 1000 BB</div>
          <p>That is exactly all of his expected value. The entire distribution shifts down by 1000 BB: <strong>net expected value becomes zero</strong>, the real range turns into [−1000; +1000] BB, and the chance of finishing the week in the red jumps from 16% to nearly <strong>50%</strong> — effectively a coin flip. Put differently, an excellent technical edge of +10 bb/100 <em>before</em> rake, once the commission is deducted, yields a net winrate of exactly 0 bb/100. This is exactly where the pressing need for effective rakeback arises.</p>

          <h2>IV. Rakeback as the foundation of financial stability</h2>
          <p>Rakeback is the return of part of the commission you paid back into your playing account. There are several models:</p>
          <ul>
            <li><strong>Progressive (centralized rooms):</strong> the return starts at 10% and can theoretically reach 60–70%. But to reach the high tiers you have to grind an enormous sample while paying commission at a reduced rate — and that erodes your starting expected value.</li>
            <li><strong>Static (<a href="/en/deals/decentralized/">decentralized club apps</a>):</strong> clubs offer a fixed, transparent return of 20% to 50% from day one.</li>
            <li><strong>Agent-based (for example, NUTS POKER):</strong> clubs grant large affiliate terms to agents, and the agents share the rakeback directly with players — <a href="/en/deals/">fixed deals up to 70%</a>. In this model the agent also acts as a guarantor for the safety of your funds and the payout of your winnings (except in cases of platform rule violations — prohibited software, bots, or team play).</li>
          </ul>

          <h2>V. A practical example: the price of the right choice</h2>
          <p>Back to our regular. He pays 10 BB in commission for every 100 hands. With a quality <a href="/en/deals/">70% rakeback deal</a> he gets 7 BB back for every 100 hands — which lifts his net winrate from 0 to <strong>+7 bb/100</strong>. Laid out clearly, the whole chain looks like this:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Metric</th><th>bb/100</th></tr></thead>
            <tbody>
              <tr><td>Winrate before rake</td><td>+10</td></tr>
              <tr><td>Rake</td><td>−10</td></tr>
              <tr><td><strong>Net without rakeback</strong></td><td><strong>0</strong></td></tr>
              <tr><td>Rakeback 70%</td><td>+7</td></tr>
              <tr><td><strong>Net with rakeback</strong></td><td><strong>+7</strong></td></tr>
            </tbody>
          </table>
          <p>Over a sample of 10,000 hands the return amounts to <strong>700 BB</strong> in clean profit: net expected value swings back into the positive (+700 BB), the distribution shifts upward, and the chance of finishing the week in the red drops from ~50% back to about 24%. Even a recreational player who is losing will recover that same 700 BB and noticeably cut his losses.</p>
          <p>If these players are grinding the NL500 stake ($2/$5, where 1 BB equals $5), the weekly payout of net rakeback comes to:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="700 big blinds multiplied by 5 dollars equals 3500 dollars">700 BB × $5 = $3&#8239;500</div>
          <p>This is exactly why, when building a long-term poker career, you simply cannot ignore rakeback terms. Playing in rooms with a heavy rake load and no commission return is a guaranteed way to deprive yourself of the profit you've earned. You can <a href="/en/deals/">compare current rakeback deals</a> in the PokerDealsHub catalog.</p>

          <h2>Frequently asked questions</h2>
          <h3>What is bb/100 winrate and what counts as a good winrate?</h3>
          <p>Winrate is the average profit in big blinds per 100 hands (bb/100), usually measured before rake is deducted. 0 bb/100 is a break-even game, 1–10 bb/100 is a moderate edge, and 10–20 bb/100 and above is a strong edge, typical of playing against weak opponents.</p>
          <h3>Why can you lose over a week even with a +10 bb/100 winrate?</h3>
          <p>Because of variance. Over 10,000 hands the standard deviation equals 1000 BB, so even with a winrate of +10 bb/100 before rake (EV +1000 BB) the result has a 68% probability of landing in the range [0; 2000] BB — about a 16% chance of going into the red. And once rake is deducted, net expected value falls to zero, and without rakeback the chance of finishing the week in the red is already nearly 50%.</p>
          <h3>How does rakeback affect your bottom-line profit?</h3>
          <p>Rakeback returns part of the commission you paid. With rake of about 10 BB/100 and a 70% deal, a player gets back 7 BB/100 — which lifts net winrate from 0 to +7 bb/100, that is 700 BB over 10,000 hands, or $3&#8239;500 at the NL500 stake. Often it is rakeback that turns a break-even result into a steady profit.</p>
          <h3>What counts as high rakeback?</h3>
          <p>In centralized rooms, high return rates (60–70%) require enormous volumes of play. Club apps give a fixed 20–50% right away, and agent-based deals offer up to 70% from day one. Current offers are gathered in the <a href="/en/deals/">PokerDealsHub</a> catalog.</p>

