  he:
    title: "השפעת ה-rakeback על ה-winrate בפוקר: מתמטיקה, variance ורווח נסתר"
    description: >-
      כיצד ה-rakeback משפיע על ה-winrate ועל הרווח האמיתי בפוקר: מנתחים את ה-winrate (bb/100), את ה-variance ואת סטיית
      התקן, את עומס ה-rake ואת מודלי ה-rakeback — עם נוסחאות ודוגמאות חישוב.
    body: |-
      <article>

          <style>
          .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
          .pdh-fx sub{font-size:0.72em}
          .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
          .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
          .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
          .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
        </style>

          <p>בין אם אתם רואים בפוקר בידור ובין אם מקור הכנסה, התוצאה הכספית הסופית שלכם נקבעת על ידי שלושה גורמים:</p>
          <ul>
            <li>היתרון שלכם על היריבים — <strong>ה-winrate</strong>;</li>
            <li><strong>מבנה ה-rake</strong> (העמלה) בשולחן הפוקר;</li>
            <li>אחוז ה-<strong>rakeback</strong> — החזר של חלק מהעמלה ששילמתם.</li>
          </ul>

          <h2>I. מושג ה-winrate והשפעת ה-variance</h2>
          <p>את היתרון על השדה, המבוטא ב-winrate, קשה מכול לחשב. עליו משפיעים גורמים רבים המשתנים ללא הרף, והעיקרי שבהם — עוצמת היריבים בשולחן. יתרה מזו, במרחקים קצרים השפעת ה-variance עצומה: winrate בעל מובהקות סטטיסטית ניתן להעריך רק לאחר עשרות אלפי ידיים ששוחקו.</p>
          <p>נהוג למדוד את ה-winrate בבליינדים גדולים ל-100 ידיים (<strong>bb/100</strong>). בתוכנות אנליטיות הוא מחושב לרוב לפני תשלום העמלה (pre-rake). אם אינכם יודעים את ה-winrate המדויק שלכם, ניתן להעריך אותו באופן משוער לפי הסיווג הבא:</p>
          <ul>
            <li><strong>winrate שלילי</strong> — אתם משחקים גרוע יותר מהיריבים בלימיט שלכם;</li>
            <li><strong>0 bb/100</strong> — משחק באפס, ברמת היריב הממוצע;</li>
            <li><strong>1–10 bb/100</strong> — יתרון מתון על השדה;</li>
            <li><strong>10–20 bb/100 ומעלה</strong> — יתרון משמעותי (בדרך כלל במשחק קבוע מול יריבים חלשים).</li>
          </ul>

          <h2>II. סטיית התקן והמתמטיקה של המרחק</h2>
          <p>לניתוח התנודתיות של התוצאות משתמשים בסטיית תקן (Standard Deviation, SD). במשחקי cash בהולדם ללא הגבלה (NLH) היא עומדת על כ-100 bb/100 בקירוב, ובאומהה פוט-לימיט של חמישה קלפים (PLO5) היא עולה ל-200–250 bb/100 בשל צפיפות גבוהה יותר של קומבינציות חזקות.</p>
          <p>חשוב מאוד להבין את ההבדל היסודי: ה-winrate גדל <strong>באופן ליניארי</strong> עם מספר הידיים ששוחקו, ואילו סטיית התקן — באופן פרופורציונלי ל<strong>שורש הריבועי</strong> של המרחק.</p>
          <p>נוסחת סטיית התקן למרחק שרירותי נראית כך:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD על N מרווחים שווה ל-SD על 100 ידיים כפול השורש הריבועי של N">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
          <p>כאשר <em>N</em> — מספר מרווחי 100-הידיים ששוחקו. זהו קירוב: הוא מניח אי-תלות בין מקטעי 100-הידיים, אך להערכה מעשית די בכך בהחלט.</p>

          <h3>דוגמת חישוב (לפני ה-rake)</h3>
          <p>מרחק של 10 000 ידיים בהולדם — זהו נפח ששחקן פעיל משחק במהלך שבוע ב-1–2 שולחנות. מאחר שה-winrate וה-SD מחושבים ל-100 ידיים, אנו מתייחסים למרחק זה כאל 100 מרווחים (<em>N</em> = 100).</p>
          <p>תחילה נחשב את סטיית התקן עבור כל המרחק:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD על 10 000 ידיים שווה 100 כפול השורש הריבועי של 100, שווה 1000 בליינדים גדולים">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
          <p>כעת נשווה בין שני שחקנים (ה-winrate כאן — <strong>לפני ה-rake</strong>):</p>
          <ul>
            <li><strong>regular מצליח, ‎+10 bb/100.</strong> התוחלת שלו על המרחק — <strong>‎+1000 BB</strong>.</li>
            <li><strong>חובב מפסיד, ‎−10 bb/100.</strong> התוחלת שלו — <strong>‎−1000 BB</strong>.</li>
          </ul>
          <p>לפי כלל רווחי הסמך של ההתפלגות הנורמלית:</p>
          <table class="pdh-tbl">
            <thead><tr><th>טווח התוצאה</th><th>הסתברות</th></tr></thead>
            <tbody>
              <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
              <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
              <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
            </tbody>
          </table>
          <p>עבור regular מצליח, בהסתברות של 68% התוצאה על 10 000 ידיים תיפול בטווח:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="EV פלוס-מינוס 1 SD שווה 1000 BB פלוס-מינוס 1000 BB, כלומר מ-0 עד 2000 בליינדים גדולים">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
          <p>כלומר, אפילו עם winrate יוצא דופן של 10 bb/100 נותר סיכוי של כ-16% (מחצית מ-32% הנותרים) לסיים את השבוע במינוס. ולהפך: שחקן מפסיד יראה באותה הסתברות של 68% תוצאה שבין ‎−2000 ל-0 BB — כלומר גם לו יש כ-16% סיכוי לסגור את המרחק בפלוס. דווקא תכונה מתמטית זו משאירה את השחקנים הרקרייישן (recreational) באקוסיסטם של הפוקר.</p>
          <p><strong>אבל כל זה — תמונה לפני ניכוי ה-rake.</strong> מה עושה בה העמלה — בחלק הבא.</p>

          <h2>III. עומס ה-rake: הרוצח השקט של הרווח</h2>
          <p>ה-rake הוא העמלה שחדר הפוקר גובה מכל קופה שהגיעה לפלופ (בחלק מהחדרים ה-rake נגבה גם בפריפלופ — לפי תרחיש 3-bet-fold). העומס נקבע על ידי שני פרמטרים: אחוז ה-rake והמגבלה שלו (ה-cap, המבוטא ב-BB). ככל שמדדים אלה גבוהים יותר, כך קשה יותר לצאת לפלוס נקי. אם דרושים היסודות — מהם rake ו-rakeback וכיצד הם בנויים — התחילו במדריך <a href="/he/guides/rake-and-rakeback-in-poker/">«Rake ו-rakeback בפוקר»</a>.</p>
          <p>ניקח פרמטרים סטנדרטיים ללימיטים בינוניים: rake של 5% ו-cap של 5 BB. בהתאם לסגנון המשחק (טייט או לוז), ל-100 ידיים משלם השחקן בממוצע כ-10 BB של rake.</p>
          <p>נחזור ל-regular שלנו. על 10 000 ידיים (100 מרווחים) ה-rake אוכל:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="100 כפול 10 בליינדים גדולים שווה 1000 בליינדים גדולים — כל ה-rake על 10 000 ידיים">100 × 10 BB = 1000 BB</div>
          <p>זו בדיוק כל התוחלת שלו. כל ההתפלגות נעה כלפי מטה ב-1000 BB: <strong>התוחלת נטו הופכת לאפס</strong>, המסדרון האמיתי הופך ל-[−1000; +1000] BB, והסיכוי לסיים את השבוע במינוס עולה מ-16% לכמעט <strong>50%</strong> — למעשה הטלת מטבע. במילים אחרות, יתרון טכני מצוין של ‎+10 bb/100 <em>לפני</em> ה-rake נותן לאחר ניכוי העמלה winrate נטו של 0 bb/100 בדיוק. דווקא כאן מתעורר הצורך החד ב-rakeback יעיל.</p>

          <h2>IV. Rakeback כבסיס ליציבות פיננסית</h2>
          <p>Rakeback הוא החזר של חלק מהעמלה ששולמה בחזרה לחשבון המשחק שלכם. קיימים כמה מודלים:</p>
          <ul>
            <li><strong>פרוגרסיבי (חדרים centralized):</strong> ההחזר מתחיל מ-10% ותאורטית יכול להגיע ל-60–70%. אך לסטטוסים הגבוהים דרוש לשחק מרחק עצום, תוך תשלום עמלה בשיעור מוקטן — וזה מוביל לאובדן התוחלת ההתחלתית.</li>
            <li><strong>סטטי (<a href="/he/deals/decentralized/">אפליקציות מועדון decentralized</a>):</strong> המועדונים מציעים החזר קבוע וברור שבין 20% ל-50% מהיום הראשון של המשחק.</li>
            <li><strong>סוכנותי (לדוגמה, NUTS POKER):</strong> המועדונים מעניקים לסוכנים תנאי שותפות גדולים, והם חולקים את ה-rakeback ישירות עם השחקנים — <a href="/he/deals/">עסקאות קבועות עד 70%</a>. בכך הסוכן משמש ערב לשמירת הכספים ולתשלום הזכיות (למעט הפרות של כללי הפלטפורמה — תוכנה אסורה, בוטים או teamplay).</li>
          </ul>

          <h2>V. דוגמה מעשית: מחיר הבחירה הנכונה</h2>
          <p>נחזור ל-regular שלנו. הוא משלם 10 BB עמלה על כל 100 ידיים. עם <a href="/he/deals/">עסקת rakeback איכותית של 70%</a> הוא מקבל בחזרה 7 BB על כל 100 ידיים — זה מרים את ה-winrate נטו שלו מ-0 ל-<strong>‎+7 bb/100</strong>. באופן ויזואלי כל השרשרת נראית כך:</p>
          <table class="pdh-tbl">
            <thead><tr><th>מדד</th><th>bb/100</th></tr></thead>
            <tbody>
              <tr><td>winrate לפני ה-rake</td><td>+10</td></tr>
              <tr><td>Rake</td><td>−10</td></tr>
              <tr><td><strong>נטו ללא rakeback</strong></td><td><strong>0</strong></td></tr>
              <tr><td>Rakeback 70%</td><td>+7</td></tr>
              <tr><td><strong>נטו עם rakeback</strong></td><td><strong>+7</strong></td></tr>
            </tbody>
          </table>
          <p>על מרחק של 10 000 ידיים ההחזר יסתכם ב-<strong>700 BB</strong> של רווח נקי: התוחלת נטו שבה לפלוס (+700 BB), ההתפלגות נעה כלפי מעלה, והסיכוי לסיים את השבוע במינוס יורד מ-~50% בחזרה לכ-24%. אפילו שחקן recreational המשחק במינוס יחזיר לעצמו את אותם 700 BB ויצמצם משמעותית את ההפסדים.</p>
          <p>אם שחקנים אלה משחקים בלימיט NL500 ($2/$5, שבו 1 BB שווה $5), התשלום השבועי של ה-rakeback הנקי יסתכם ב:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="700 בליינדים גדולים כפול 5 דולר שווה 3500 דולר">700 BB × $5 = $3&#8239;500</div>
          <p>לכן, בבניית קריירת פוקר לטווח ארוך אסור בשום אופן להתעלם מתנאי ה-rakeback. משחק בחדרים בעלי עומס rake גבוה וללא החזר עמלה — זו דרך מובטחת לשלול מעצמכם את הרווח המגיע לכם. ניתן <a href="/he/deals/">להשוות עסקאות rakeback עדכניות</a> בקטלוג של PokerDealsHub.</p>

          <h2>שאלות נפוצות</h2>
          <h3>מהו winrate של bb/100 ואיזה winrate נחשב טוב?</h3>
          <p>Winrate הוא הרווח הממוצע בבליינדים גדולים ל-100 ידיים (bb/100), בדרך כלל לפני ניכוי ה-rake. 0 bb/100 — משחק באפס, 1–10 bb/100 — יתרון מתון, 10–20 bb/100 ומעלה — יתרון חזק, אופייני למשחק מול יריבים חלשים.</p>
          <h3>מדוע אפשר להפסיד שבוע אפילו עם winrate של ‎+10 bb/100?</h3>
          <p>בגלל ה-variance. על 10 000 ידיים סטיית התקן שווה 1000 BB, ולכן אפילו ב-winrate של ‎+10 bb/100 לפני ה-rake (EV ‎+1000 BB) התוצאה נמצאת בהסתברות של 68% בטווח [0; 2000] BB — כ-16% סיכוי להיכנס למינוס. ולאחר ניכוי ה-rake התוחלת נטו יורדת לאפס, וללא rakeback הסיכוי לסיים את השבוע במינוס הוא כבר כמעט 50%.</p>
          <h3>כיצד ה-rakeback משפיע על הרווח הסופי?</h3>
          <p>Rakeback מחזיר חלק מהעמלה ששולמה. ב-rake של כ-10 BB/100 ובעסקה של 70% השחקן מחזיר 7 BB/100 — זה מרים את ה-winrate נטו מ-0 ל-‎+7 bb/100, כלומר 700 BB על 10 000 ידיים, או $3&#8239;500 בלימיט NL500. לעיתים קרובות דווקא ה-rakeback הופך תוצאה אפסית לפלוס יציב.</p>
          <h3>איזה rakeback נחשב גבוה?</h3>
          <p>בחדרים centralized שיעורי החזר גבוהים (60–70%) דורשים נפחי משחק עצומים. אפליקציות מועדון נותנות 20–50% קבועים מיד, ועסקאות סוכנותיות — עד 70% מהיום הראשון. הצעות עדכניות מרוכזות בקטלוג של <a href="/he/deals/">PokerDealsHub</a>.</p>

