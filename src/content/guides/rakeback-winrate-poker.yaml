  th:
    title: "ผลของเรคแบ็กต่ออัตราชนะ (winrate) ในโป๊กเกอร์: คณิตศาสตร์ ความแปรปรวน และกำไรที่ซ่อนอยู่"
    description: >-
      เรคแบ็กส่งผลต่ออัตราชนะ (winrate) และกำไรจริงในโป๊กเกอร์อย่างไร: เราวิเคราะห์อัตราชนะ (bb/100)
      ความแปรปรวนและค่าเบี่ยงเบนมาตรฐาน ภาระเรค และโมเดลเรคแบ็ก — พร้อมสูตรและตัวอย่างการคำนวณ
    body: |-
      <article>

          <style>
            .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
            .pdh-fx sub{font-size:0.72em}
            .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
            .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
            .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
            .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
          </style>

          <p>ไม่ว่าคุณจะมองโป๊กเกอร์เป็นความบันเทิงหรือเป็นแหล่งรายได้ ผลลัพธ์ทางการเงินสุดท้ายของคุณถูกกำหนดด้วยสามปัจจัย:</p>
          <ul>
            <li>ความได้เปรียบเหนือคู่แข่งของคุณ — <strong>อัตราชนะ (winrate)</strong>;</li>
            <li><strong>โครงสร้างเรค</strong> (ค่าคอมมิชชัน) ที่โต๊ะโป๊กเกอร์;</li>
            <li>เปอร์เซ็นต์ <strong>เรคแบ็ก</strong> — การคืนส่วนหนึ่งของค่าคอมมิชชันที่จ่ายไป</li>
          </ul>

          <h2>I. ความเข้าใจเรื่องอัตราชนะและผลกระทบของความแปรปรวน</h2>
          <p>ความได้เปรียบเหนือสนามที่แสดงในรูปอัตราชนะนั้นคำนวณได้ยากที่สุด มันได้รับอิทธิพลจากปัจจัยที่เปลี่ยนแปลงตลอดเวลาจำนวนมาก โดยปัจจัยหลักคือความแข็งแกร่งของคู่แข่งที่โต๊ะ ยิ่งไปกว่านั้น ในระยะสั้นผลกระทบของความแปรปรวนนั้นมหาศาล: อัตราชนะที่มีนัยสำคัญทางสถิติสามารถประเมินได้ก็ต่อเมื่อเล่นไปแล้วหลายหมื่นมือ</p>
          <p>อัตราชนะโดยทั่วไปวัดเป็นบิ๊กบลายนด์ต่อ 100 มือ (<strong>bb/100</strong>) ในซอฟต์แวร์วิเคราะห์ มักคำนวณก่อนหักค่าคอมมิชชัน (pre-rake) หากคุณไม่ทราบอัตราชนะที่แม่นยำของตัวเอง คุณสามารถประเมินคร่าว ๆ ได้จากการจำแนกดังนี้:</p>
          <ul>
            <li><strong>อัตราชนะติดลบ</strong> — คุณเล่นได้แย่กว่าคู่แข่งในลิมิตของคุณ;</li>
            <li><strong>0 bb/100</strong> — เล่นเสมอตัว อยู่ในระดับเดียวกับคู่แข่งโดยเฉลี่ย;</li>
            <li><strong>1–10 bb/100</strong> — ความได้เปรียบเหนือสนามในระดับปานกลาง;</li>
            <li><strong>10–20 bb/100 ขึ้นไป</strong> — ความได้เปรียบอย่างมีนัยสำคัญ (โดยทั่วไปมาจากการเล่นกับคู่แข่งที่อ่อนแอเป็นประจำ)</li>
          </ul>

          <h2>II. ค่าเบี่ยงเบนมาตรฐานและคณิตศาสตร์ของระยะยาว</h2>
          <p>ในการวิเคราะห์ความผันผวนของผลลัพธ์ เราใช้ค่าเบี่ยงเบนมาตรฐาน (Standard Deviation, SD) สำหรับแคชเกมโนลิมิตโฮลเด็ม (NLH) มันอยู่ที่ประมาณ 100 bb/100 ส่วนในพ็อตลิมิตโอมาฮาห้าใบ (PLO5) จะเพิ่มขึ้นเป็น 200–250 bb/100 เนื่องจากความหนาแน่นของคอมบิเนชันที่แข็งแกร่งมากกว่า</p>
          <p>สิ่งสำคัญอย่างยิ่งคือต้องเข้าใจความแตกต่างพื้นฐาน: อัตราชนะเติบโต<strong>เชิงเส้น</strong>ตามจำนวนมือที่เล่น ในขณะที่ค่าเบี่ยงเบนมาตรฐานเติบโตเป็นสัดส่วนกับ<strong>รากที่สอง</strong>ของระยะทาง</p>
          <p>สูตรของค่าเบี่ยงเบนมาตรฐานสำหรับระยะทางใด ๆ มีลักษณะดังนี้:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD over N intervals equals SD over 100 hands multiplied by the square root of N">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
          <p>โดยที่ <em>N</em> คือจำนวนช่วง 100 มือที่เล่นไป นี่คือการประมาณค่า: มันสมมติว่าช่วง 100 มือแต่ละช่วงเป็นอิสระต่อกัน แต่สำหรับการประเมินในทางปฏิบัตินี่ก็เพียงพอแล้ว</p>

          <h3>ตัวอย่างการคำนวณ (ก่อนเรค)</h3>
          <p>ระยะทาง 10 000 มือในโฮลเด็ม คือปริมาณที่ผู้เล่นที่แอ็คทีฟเล่นได้ภายในหนึ่งสัปดาห์บน 1–2 โต๊ะ เนื่องจากอัตราชนะและ SD คำนวณต่อ 100 มือ เราจึงมองระยะทางนี้เป็น 100 ช่วง (<em>N</em> = 100)</p>
          <p>ก่อนอื่น มาคำนวณค่าเบี่ยงเบนมาตรฐานสำหรับระยะทางทั้งหมด:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="SD over 10,000 hands equals 100 multiplied by the square root of 100, equals 1000 big blinds">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
          <p>ตอนนี้มาเปรียบเทียบผู้เล่นสองคน (อัตราชนะในที่นี้คือ <strong>ก่อนเรค</strong>):</p>
          <ul>
            <li><strong>เรกกูลาร์ที่ประสบความสำเร็จ, +10 bb/100.</strong> ค่าคาดหวังทางคณิตศาสตร์ของเขาในระยะทางนี้คือ <strong>+1000 BB</strong>.</li>
            <li><strong>ผู้เล่นสมัครเล่นที่แพ้, −10 bb/100.</strong> ค่าคาดหวังทางคณิตศาสตร์ของเขาคือ <strong>−1000 BB</strong>.</li>
          </ul>
          <p>ตามกฎช่วงความเชื่อมั่นของการแจกแจงแบบปกติ:</p>
          <table class="pdh-tbl">
            <thead><tr><th>ช่วงของผลลัพธ์</th><th>ความน่าจะเป็น</th></tr></thead>
            <tbody>
              <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
              <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
              <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
            </tbody>
          </table>
          <p>สำหรับเรกกูลาร์ที่ประสบความสำเร็จ มีความน่าจะเป็น 68% ที่ผลลัพธ์ตลอด 10 000 มือจะอยู่ในช่วง:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="EV plus or minus 1 SD equals 1000 BB plus or minus 1000 BB, that is from 0 to 2000 big blinds">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
          <p>กล่าวคือ แม้จะมีอัตราชนะที่โดดเด่นถึง 10 bb/100 ก็ยังเหลือโอกาสประมาณ 16% (ครึ่งหนึ่งของ 32% ที่เหลือ) ที่จะจบสัปดาห์ในแดนลบ และในทางกลับกัน: ผู้เล่นที่แพ้ก็มีความน่าจะเป็น 68% เท่ากันที่จะแสดงผลลัพธ์ระหว่าง −2000 ถึง 0 BB — หมายความว่าเขาก็มีโอกาสประมาณ 16% เช่นกันที่จะปิดระยะทางในแดนบวก คุณสมบัติทางคณิตศาสตร์นี้เองที่ยึดเหนี่ยวผู้เล่นสายบันเทิงเอาไว้ในระบบนิเวศของโป๊กเกอร์</p>
          <p><strong>แต่ทั้งหมดนี้คือภาพก่อนหักเรค</strong> ค่าคอมมิชชันทำอะไรกับภาพนี้ — อยู่ในหัวข้อถัดไป</p>

          <h2>III. ภาระเรค: นักฆ่ากำไรที่เงียบงัน</h2>
          <p>เรคคือค่าคอมมิชชันที่ห้องโป๊กเกอร์เก็บจากทุกกองเงินเดิมพันที่ไปถึงฟล็อป (ในบางห้องเรคถูกเก็บที่พรีฟล็อปด้วย — ในสถานการณ์ 3-bet-fold) ภาระถูกกำหนดด้วยสองพารามิเตอร์: เปอร์เซ็นต์เรคและเพดานของมัน (แคป ซึ่งแสดงเป็น BB) ยิ่งตัวเลขเหล่านี้สูง ยิ่งยากที่จะทำกำไรสุทธิ หากคุณต้องการพื้นฐาน — เรคและเรคแบ็กคืออะไรและทำงานอย่างไร — เริ่มจากไกด์ <a href="/th/guides/rake-and-rakeback-in-poker/">«เรคและเรคแบ็กในโป๊กเกอร์»</a></p>
          <p>มาใช้พารามิเตอร์มาตรฐานสำหรับลิมิตกลาง: เรค 5% และแคป 5 BB ขึ้นอยู่กับสไตล์การเล่น (ไทต์หรือลูส) ตลอด 100 มือผู้เล่นจ่ายเรคโดยเฉลี่ยประมาณ 10 BB</p>
          <p>กลับมาที่เรกกูลาร์ของเรา ตลอด 10 000 มือ (100 ช่วง) เรคกินไป:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="100 multiplied by 10 big blinds equals 1000 big blinds — the total rake over 10,000 hands">100 × 10 BB = 1000 BB</div>
          <p>นี่คือค่าคาดหวังทางคณิตศาสตร์ทั้งหมดของเขาพอดี การแจกแจงทั้งหมดเลื่อนลง 1000 BB: <strong>ค่าคาดหวังสุทธิกลายเป็นศูนย์</strong> ช่วงจริงกลายเป็น [−1000; +1000] BB และโอกาสจบสัปดาห์ในแดนลบพุ่งจาก 16% ขึ้นไปเกือบ <strong>50%</strong> — แทบจะเป็นการโยนเหรียญ พูดอีกอย่างคือ ความได้เปรียบเชิงเทคนิคที่ยอดเยี่ยม +10 bb/100 <em>ก่อน</em>เรค เมื่อหักค่าคอมมิชชันแล้วให้อัตราชนะสุทธิเท่ากับ 0 bb/100 พอดี นี่เองคือจุดที่ความจำเป็นเร่งด่วนของเรคแบ็กที่มีประสิทธิภาพเกิดขึ้น</p>

          <h2>IV. เรคแบ็กในฐานะรากฐานของความมั่นคงทางการเงิน</h2>
          <p>เรคแบ็กคือการคืนส่วนหนึ่งของค่าคอมมิชชันที่คุณจ่ายไปกลับเข้าบัญชีเล่นเกมของคุณ มีอยู่หลายโมเดล:</p>
          <ul>
            <li><strong>แบบก้าวหน้า (ห้องแบบรวมศูนย์):</strong> การคืนเริ่มต้นที่ 10% และในทางทฤษฎีอาจสูงถึง 60–70% แต่การจะไปถึงสถานะสูง ๆ ต้องเล่นระยะทางมหาศาลในขณะที่จ่ายค่าคอมมิชชันในอัตราที่ต่ำลง — และนั่นทำให้สูญเสียค่าคาดหวังทางคณิตศาสตร์เริ่มต้นไป</li>
            <li><strong>แบบคงที่ (<a href="/th/deals/decentralized/">แอปคลับแบบกระจายศูนย์</a>):</strong> คลับเสนอการคืนที่คงที่และเข้าใจง่ายตั้งแต่ 20% ถึง 50% ตั้งแต่วันแรกที่เล่น</li>
            <li><strong>แบบเอเยนต์ (เช่น NUTS POKER):</strong> คลับให้เงื่อนไขพาร์ตเนอร์ก้อนใหญ่แก่เอเยนต์ และเอเยนต์แบ่งเรคแบ็กให้ผู้เล่นโดยตรง — <a href="/th/deals/">ดีลแบบคงที่สูงสุด 70%</a> โดยเอเยนต์ทำหน้าที่เป็นผู้ค้ำประกันความปลอดภัยของเงินทุนและการจ่ายเงินรางวัล (ยกเว้นกรณีละเมิดกฎของแพลตฟอร์ม — ซอฟต์แวร์ต้องห้าม บอท หรือการเล่นเป็นทีม)</li>
          </ul>

          <h2>V. ตัวอย่างในทางปฏิบัติ: ราคาของการเลือกที่ถูกต้อง</h2>
          <p>กลับมาที่เรกกูลาร์ของเรา เขาจ่ายค่าคอมมิชชัน 10 BB ทุก ๆ 100 มือ ด้วย<a href="/th/deals/">ดีลเรคแบ็ก 70%</a> ที่มีคุณภาพ เขาได้คืน 7 BB ทุก ๆ 100 มือ — ซึ่งยกอัตราชนะสุทธิของเขาจาก 0 เป็น <strong>+7 bb/100</strong> เมื่อแสดงให้เห็นอย่างชัดเจน ห่วงโซ่ทั้งหมดมีลักษณะดังนี้:</p>
          <table class="pdh-tbl">
            <thead><tr><th>ตัวชี้วัด</th><th>bb/100</th></tr></thead>
            <tbody>
              <tr><td>อัตราชนะก่อนเรค</td><td>+10</td></tr>
              <tr><td>เรค</td><td>−10</td></tr>
              <tr><td><strong>สุทธิเมื่อไม่มีเรคแบ็ก</strong></td><td><strong>0</strong></td></tr>
              <tr><td>เรคแบ็ก 70%</td><td>+7</td></tr>
              <tr><td><strong>สุทธิเมื่อมีเรคแบ็ก</strong></td><td><strong>+7</strong></td></tr>
            </tbody>
          </table>
          <p>ในระยะทาง 10 000 มือ การคืนจะเท่ากับ <strong>700 BB</strong> ของกำไรสุทธิ: ค่าคาดหวังสุทธิกลับไปเป็นบวกอีกครั้ง (+700 BB) การแจกแจงเลื่อนขึ้น และโอกาสจบสัปดาห์ในแดนลบลดลงจาก ~50% กลับไปเหลือประมาณ 24% แม้แต่ผู้เล่นสายบันเทิงที่เล่นขาดทุนก็จะได้ 700 BB เดียวกันนั้นคืนมาและลดการขาดทุนลงอย่างเห็นได้ชัด</p>
          <p>หากผู้เล่นเหล่านี้เล่นลิมิต NL500 ($2/$5 โดยที่ 1 BB เท่ากับ $5) การจ่ายเรคแบ็กสุทธิรายสัปดาห์จะเท่ากับ:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="700 big blinds multiplied by 5 dollars equals 3500 dollars">700 BB × $5 = $3&#8239;500</div>
          <p>นี่เองคือเหตุผลว่าทำไมในการสร้างอาชีพโป๊กเกอร์ระยะยาว คุณจึงไม่สามารถละเลยเงื่อนไขเรคแบ็กได้เด็ดขาด การเล่นในห้องที่มีภาระเรคสูงและไม่มีการคืนค่าคอมมิชชัน คือวิธีที่การันตีว่าจะทำให้ตัวเองสูญเสียกำไรที่ควรได้ คุณสามารถ<a href="/th/deals/">เปรียบเทียบดีลเรคแบ็กล่าสุด</a>ได้ในแคตตาล็อกของ PokerDealsHub</p>

          <h2>คำถามที่พบบ่อย</h2>
          <h3>อัตราชนะ bb/100 คืออะไร และอัตราชนะเท่าไรถือว่าดี?</h3>
          <p>อัตราชนะคือกำไรเฉลี่ยในหน่วยบิ๊กบลายนด์ต่อ 100 มือ (bb/100) โดยทั่วไปวัดก่อนหักเรค 0 bb/100 คือเล่นเสมอตัว 1–10 bb/100 คือความได้เปรียบระดับปานกลาง 10–20 bb/100 ขึ้นไปคือความได้เปรียบที่แข็งแกร่ง ซึ่งเป็นลักษณะของการเล่นกับคู่แข่งที่อ่อนแอ</p>
          <h3>ทำไมถึงแพ้ได้ตลอดหนึ่งสัปดาห์แม้จะมีอัตราชนะ +10 bb/100?</h3>
          <p>เพราะความแปรปรวน ตลอด 10 000 มือ ค่าเบี่ยงเบนมาตรฐานเท่ากับ 1000 BB ดังนั้นแม้จะมีอัตราชนะ +10 bb/100 ก่อนเรค (EV +1000 BB) ผลลัพธ์ก็มีความน่าจะเป็น 68% ที่จะอยู่ในช่วง [0; 2000] BB — โอกาสประมาณ 16% ที่จะเข้าสู่แดนลบ และเมื่อหักเรคแล้ว ค่าคาดหวังสุทธิลดลงเหลือศูนย์ และหากไม่มีเรคแบ็ก โอกาสจบสัปดาห์ในแดนลบก็เกือบ 50% แล้ว</p>
          <h3>เรคแบ็กส่งผลต่อกำไรสุดท้ายอย่างไร?</h3>
          <p>เรคแบ็กคืนส่วนหนึ่งของค่าคอมมิชชันที่จ่ายไป เมื่อเรคอยู่ที่ประมาณ 10 BB/100 และดีล 70% ผู้เล่นได้คืน 7 BB/100 — ซึ่งยกอัตราชนะสุทธิจาก 0 เป็น +7 bb/100 นั่นคือ 700 BB ตลอด 10 000 มือ หรือ $3&#8239;500 ที่ลิมิต NL500 บ่อยครั้งที่เรคแบ็กนี่เองที่เปลี่ยนผลลัพธ์เสมอตัวให้กลายเป็นกำไรที่มั่นคง</p>
          <h3>เรคแบ็กเท่าไรถือว่าสูง?</h3>
          <p>ในห้องแบบรวมศูนย์ อัตราการคืนที่สูง (60–70%) ต้องการปริมาณการเล่นมหาศาล แอปคลับให้ 20–50% แบบคงที่ทันที ส่วนดีลแบบเอเยนต์ให้สูงสุด 70% ตั้งแต่วันแรก ข้อเสนอล่าสุดถูกรวบรวมไว้ในแคตตาล็อกของ <a href="/th/deals/">PokerDealsHub</a></p>

