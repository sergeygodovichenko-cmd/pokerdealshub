  ar:
    title: "تأثير الريكباك على معدل الفوز (winrate) في البوكر: الرياضيات والتباين والربح الخفي"
    description: >-
      كيف يؤثر الريكباك على معدل الفوز والربح الحقيقي في البوكر: نشرح معدل الفوز (bb/100)، والتباين والانحراف المعياري،
      وعبء الريك، ونماذج الريكباك — مع صيغ رياضية وأمثلة حسابية.
    body: |-
      <article>

          <style>
          .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
          .pdh-fx sub{font-size:0.72em}
          .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
          .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
          .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
          .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
        </style>

          <p>سواء كنت تنظر إلى البوكر كوسيلة للترفيه أو كمصدر للدخل، فإن نتيجتك المالية النهائية تتحدد بثلاثة عوامل:</p>
          <ul>
            <li>أفضليتك على خصومك — أي <strong>معدل الفوز (winrate)</strong>؛</li>
            <li><strong>بنية الريك (rake)</strong> (العمولة) على طاولة البوكر؛</li>
            <li>نسبة <strong>الريكباك (rakeback)</strong> — أي إعادة جزء من العمولة المدفوعة.</li>
          </ul>

          <h2>أولاً. مفهوم معدل الفوز وتأثير التباين</h2>
          <p>الأفضلية على الطاولة، المعبَّر عنها بمعدل الفوز، هي الأصعب في الحساب. فهي تتأثر بعدد كبير من العوامل المتغيرة باستمرار، وأهمها قوة الخصوم على الطاولة. علاوة على ذلك، يكون تأثير التباين (variance) هائلاً على المسافات القصيرة: فلا يمكن تقدير معدل فوز ذي دلالة إحصائية إلا بعد لعب عشرات الآلاف من اليدين.</p>
          <p>جرت العادة على قياس معدل الفوز بعدد البلايندات الكبيرة لكل 100 توزيعة (<strong>bb/100</strong>). في البرامج التحليلية غالباً ما يُحسب قبل خصم العمولة (ما قبل الريك). وإذا كنت لا تعرف معدل فوزك بدقة، فيمكن تقديره تقريبياً وفق هذا التصنيف:</p>
          <ul>
            <li><strong>معدل فوز سلبي</strong> — أنت تلعب أسوأ من خصومك على حدّك؛</li>
            <li><strong>0 bb/100</strong> — لعب متعادل، على مستوى الخصم المتوسط؛</li>
            <li><strong>1–10 bb/100</strong> — أفضلية معتدلة على الطاولة؛</li>
            <li><strong>10–20 bb/100 وأعلى</strong> — أفضلية كبيرة (عادةً عند اللعب المنتظم ضد خصوم ضعفاء).</li>
          </ul>

          <h2>ثانياً. الانحراف المعياري ورياضيات المسافة</h2>
          <p>لتحليل تقلب النتائج يُستخدم الانحراف المعياري (Standard Deviation, SD). بالنسبة للألعاب النقدية في الهولدم بلا حدود (NLH) يبلغ نحو 100 bb/100، بينما يرتفع في أوماها بوت-ليميت بخمس أوراق (PLO5) إلى 200–250 bb/100 بسبب كثافة أكبر من التركيبات القوية.</p>
          <p>من الأهمية بمكان فهم الفرق الجوهري: معدل الفوز يزداد <strong>خطياً</strong> مع عدد اليدين الملعوبة، بينما يزداد الانحراف المعياري بما يتناسب مع <strong>الجذر التربيعي</strong> للمسافة.</p>
          <p>صيغة الانحراف المعياري لمسافة اعتباطية تبدو كالتالي:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="الانحراف المعياري على N فترة يساوي الانحراف المعياري على 100 يد مضروباً في الجذر التربيعي لـ N">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
          <p>حيث إن <em>N</em> هو عدد فترات المئة يد الملعوبة. هذا تقريب: فهو يفترض استقلالية مقاطع المئة يد، لكنه كافٍ تماماً للتقدير العملي.</p>

          <h3>مثال حسابي (قبل الريك)</h3>
          <p>مسافة 10 000 يد في الهولدم هي حجم يلعبه اللاعب النشط خلال أسبوع على طاولة أو طاولتين. وبما أن معدل الفوز والانحراف المعياري يُحسبان على 100 يد، فإننا ننظر إلى هذه المسافة على أنها 100 فترة (<em>N</em> = 100).</p>
          <p>أولاً نحسب الانحراف المعياري لكامل المسافة:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="الانحراف المعياري على 10 000 يد يساوي 100 مضروباً في الجذر التربيعي لـ 100 يساوي 1000 بلايند كبير">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
          <p>الآن نقارن بين لاعبَين (معدل الفوز هنا هو <strong>قبل الريك</strong>):</p>
          <ul>
            <li><strong>لاعب منتظم (regular) ناجح، ‎+10 bb/100.</strong> قيمته المتوقعة على المسافة هي <strong>‎+1000 BB</strong>.</li>
            <li><strong>هاوٍ خاسر، ‎−10 bb/100.</strong> قيمته المتوقعة هي <strong>‎−1000 BB</strong>.</li>
          </ul>
          <p>وفقاً لقاعدة فترات الثقة للتوزيع الطبيعي:</p>
          <table class="pdh-tbl">
            <thead><tr><th>نطاق النتيجة</th><th>الاحتمال</th></tr></thead>
            <tbody>
              <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
              <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
              <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
            </tbody>
          </table>
          <p>بالنسبة للاعب المنتظم الناجح، ستقع نتيجته على مدى 10 000 يد باحتمال 68% ضمن النطاق:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="القيمة المتوقعة زائد أو ناقص انحراف معياري واحد تساوي 1000 بلايند كبير زائد أو ناقص 1000 بلايند كبير، أي من 0 إلى 2000 بلايند كبير">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
          <p>أي أنه حتى مع معدل فوز استثنائي قدره 10 bb/100 يبقى احتمال يقارب 16% (نصف الـ 32% المتبقية) لإنهاء الأسبوع بخسارة. والعكس صحيح: اللاعب الخاسر سيُظهر بنفس الاحتمال 68% نتيجة تتراوح بين ‎−2000 و‎0 BB — ما يعني أن لديه أيضاً نحو 16% فرصة لإنهاء المسافة بربح. هذه الخاصية الرياضية بالتحديد هي ما يبقي اللاعبين الترفيهيين (recreational players) ضمن منظومة البوكر.</p>
          <p><strong>لكن كل هذا صورة قبل خصم الريك.</strong> أما ما تفعله العمولة بهذه الصورة — ففي القسم التالي.</p>

          <h2>ثالثاً. عبء الريك: القاتل الصامت للربح</h2>
          <p>الريك هو العمولة التي تأخذها غرفة البوكر من كل بوت يصل إلى الفلوب (في بعض الغرف يُؤخذ الريك على البريفلوب أيضاً — وفق سيناريو 3-بيت-فولد). ويتحدد العبء بمعاملين: نسبة الريك وحدّه الأقصى (الكاب، المعبَّر عنه بـ BB). كلما ارتفع هذان المؤشران صَعُب الخروج بربح صافٍ. وإذا كنت بحاجة إلى الأساسيات — ما هو الريك والريكباك وكيف يعملان — فابدأ بدليل <a href="/ar/guides/rake-and-rakeback-in-poker/">«الريك والريكباك في البوكر»</a>.</p>
          <p>لنأخذ معاملات قياسية للحدود المتوسطة: ريك 5% وكاب 5 BB. وبحسب أسلوب اللعب (المحكَم أو الفضفاض) يدفع اللاعب في المتوسط نحو 10 BB ريك لكل 100 توزيعة.</p>
          <p>لنعُد إلى لاعبنا المنتظم. على مدى 10 000 يد (100 فترة) يلتهم الريك:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="100 مضروباً في 10 بلايند كبير يساوي 1000 بلايند كبير — إجمالي الريك على 10 000 يد">100 × 10 BB = 1000 BB</div>
          <p>وهذا يساوي تماماً كامل قيمته المتوقعة. ينزاح التوزيع بأكمله إلى الأسفل بمقدار 1000 BB: <strong>تصبح القيمة المتوقعة الصافية صفراً</strong>، ويتحول المدى الفعلي إلى [−1000; +1000] BB، ويرتفع احتمال إنهاء الأسبوع بخسارة من 16% إلى نحو <strong>50%</strong> — أي عملياً رمي عملة. بعبارة أخرى، أفضلية تقنية ممتازة قدرها ‎+10 bb/100 <em>قبل</em> الريك تعطي بعد خصم العمولة معدل فوز صافياً قدره 0 bb/100 بالضبط. وهنا بالتحديد تنشأ الحاجة الماسّة إلى ريكباك فعّال.</p>

          <h2>رابعاً. الريكباك كأساس للاستقرار المالي</h2>
          <p>الريكباك هو إعادة جزء من العمولة المدفوعة إلى حسابك اللعبي. وتوجد عدة نماذج:</p>
          <ul>
            <li><strong>النموذج التصاعدي (الغرف المركزية):</strong> تبدأ الإعادة من 10% ويمكن نظرياً أن تصل إلى 60–70%. لكن للحصول على الحالات العليا يلزم لعب مسافة هائلة مع دفع العمولة بنسبة إعادة منخفضة — وهذا يؤدي إلى فقدان القيمة المتوقعة الأولية.</li>
            <li><strong>النموذج الثابت (<a href="/ar/deals/decentralized/">تطبيقات النوادي اللامركزية</a>):</strong> تقدّم النوادي إعادة ثابتة وواضحة من 20% إلى 50% منذ اليوم الأول من اللعب.</li>
            <li><strong>نموذج الوكالة (مثل NUTS POKER):</strong> تمنح النوادي شروطاً شراكية كبيرة للوكلاء، وهؤلاء يتقاسمون الريكباك مباشرةً مع اللاعبين — <a href="/ar/deals/">صفقات ثابتة تصل إلى 70%</a>. ويكون الوكيل في هذه الحالة ضامناً لسلامة الأموال ودفع الأرباح (باستثناء مخالفات قواعد المنصّة — البرمجيات المحظورة أو البوتات أو اللعب الجماعي).</li>
          </ul>

          <h2>خامساً. مثال عملي: ثمن الاختيار الصحيح</h2>
          <p>لنعُد إلى لاعبنا المنتظم. إنه يدفع 10 BB عمولة عن كل 100 يد. ومع <a href="/ar/deals/">صفقة ريكباك جيدة بنسبة 70%</a> يستعيد 7 BB عن كل 100 يد — وهذا يرفع معدل فوزه الصافي من 0 إلى <strong>‎+7 bb/100</strong>. وتبدو السلسلة كاملةً بوضوح كالتالي:</p>
          <table class="pdh-tbl">
            <thead><tr><th>المؤشر</th><th>bb/100</th></tr></thead>
            <tbody>
              <tr><td>معدل الفوز قبل الريك</td><td>+10</td></tr>
              <tr><td>الريك</td><td>−10</td></tr>
              <tr><td><strong>الصافي بدون ريكباك</strong></td><td><strong>0</strong></td></tr>
              <tr><td>ريكباك 70%</td><td>+7</td></tr>
              <tr><td><strong>الصافي مع الريكباك</strong></td><td><strong>+7</strong></td></tr>
            </tbody>
          </table>
          <p>على مدى 10 000 توزيعة ستبلغ الإعادة <strong>700 BB</strong> من الربح الصافي: تعود القيمة المتوقعة الصافية إلى الربح (‎+700 BB)، وينزاح التوزيع إلى الأعلى، ويهبط احتمال إنهاء الأسبوع بخسارة من نحو 50% مجدداً إلى ما يقارب 24%. وحتى اللاعب الترفيهي الذي يلعب بخسارة سيستعيد نفس الـ 700 BB ويقلّص خسائره بشكل ملحوظ.</p>
          <p>وإذا لعب هؤلاء اللاعبون على حد NL500 ($2/$5، حيث يساوي 1 BB مبلغ $5)، فإن دفعة الريكباك الصافية الأسبوعية ستكون:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="700 بلايند كبير مضروباً في 5 دولارات يساوي 3500 دولار">700 BB × $5 = $3&#8239;500</div>
          <p>لهذا السبب بالذات، عند بناء مسيرة بوكر طويلة الأمد، لا يجوز إطلاقاً تجاهل شروط الريكباك. فاللعب في غرف ذات عبء ريك مرتفع وبلا إعادة للعمولة هو وسيلة مضمونة لحرمان نفسك من ربح تستحقه. يمكنك <a href="/ar/deals/">مقارنة صفقات الريكباك المتاحة حالياً</a> في كتالوج PokerDealsHub.</p>

          <h2>الأسئلة الشائعة</h2>
          <h3>ما هو معدل الفوز bb/100 وأي معدل فوز يُعدّ جيداً؟</h3>
          <p>معدل الفوز هو متوسط الربح بالبلايندات الكبيرة لكل 100 توزيعة (bb/100)، عادةً قبل خصم الريك. 0 bb/100 يعني لعباً متعادلاً، و1–10 bb/100 أفضلية معتدلة، و10–20 bb/100 وأعلى أفضلية قوية مميزة للعب ضد خصوم ضعفاء.</p>
          <h3>لماذا يمكن أن تخسر أسبوعاً حتى مع معدل فوز ‎+10 bb/100؟</h3>
          <p>بسبب التباين. على 10 000 يد يساوي الانحراف المعياري 1000 BB، لذا حتى مع معدل فوز ‎+10 bb/100 قبل الريك (EV ‎+1000 BB) تقع النتيجة باحتمال 68% ضمن النطاق [0; 2000] BB — أي نحو 16% فرصة للدخول في الخسارة. وبعد خصم الريك تهبط القيمة المتوقعة الصافية إلى الصفر، وبدون ريكباك يصبح احتمال إنهاء الأسبوع بخسارة نحو 50% تقريباً.</p>
          <h3>كيف يؤثر الريكباك على الربح النهائي؟</h3>
          <p>الريكباك يعيد جزءاً من العمولة المدفوعة. عند ريك يقارب 10 BB/100 وصفقة بنسبة 70% يستعيد اللاعب 7 BB/100 — وهذا يرفع معدل الفوز الصافي من 0 إلى ‎+7 bb/100، أي 700 BB عن 10 000 يد، أو $3&#8239;500 على حد NL500. وغالباً ما يحوّل الريكباك تحديداً النتيجة الصفرية إلى ربح مستقر.</p>
          <h3>أي ريكباك يُعدّ مرتفعاً؟</h3>
          <p>في الغرف المركزية تتطلب نسب الإعادة المرتفعة (60–70%) أحجام لعب هائلة. تمنح تطبيقات النوادي نسباً ثابتة 20–50% فوراً، بينما تمنح صفقات الوكالة ما يصل إلى 70% منذ اليوم الأول. العروض المتاحة حالياً مجمّعة في كتالوج <a href="/ar/deals/">PokerDealsHub</a>.</p>

