  fil:
    title: "Epekto ng rakeback sa winrate sa poker: matematika, variance at nakatagong tubo"
    description: >-
      Paano nakakaapekto ang rakeback sa winrate at tunay na tubo sa poker: sinusuri natin ang winrate (bb/100),
      variance at standard deviation, ang bigat ng rake, at ang mga modelo ng rakeback — kasama ang mga formula at
      halimbawa ng kalkulasyon.
    body: |-
      <article>

          <style>
          .pdh-fx{margin:1.5rem 0;padding:0.9rem 1.15rem;background:#171717;border:1px solid #2a2a2a;border-left:3px solid #d4af37;border-radius:0.5rem;text-align:center;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.15rem;line-height:1.7;color:#f5f5f5;overflow-x:auto}
          .pdh-fx sub{font-size:0.72em}
          .pdh-fx .rad{border-top:1px solid currentColor;padding:0 .2em}
          .pdh-tbl{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.98em}
          .pdh-tbl th,.pdh-tbl td{border:1px solid #2a2a2a;padding:0.5rem 0.75rem;text-align:left}
          .pdh-tbl th{background:#171717;color:#d4af37;font-weight:600}
        </style>

          <p>Tinitingnan man ninyo ang poker bilang libangan o bilang pinagkukunan ng kita, ang inyong panghuling resulta sa pananalapi ay tinutukoy ng tatlong salik:</p>
          <ul>
            <li>ang inyong kalamangan laban sa mga kalaban — ang <strong>winrate</strong>;</li>
            <li>ang <strong>istruktura ng rake</strong> (komisyon) sa mesa ng poker;</li>
            <li>ang porsyento ng <strong>rakeback</strong> — ang pagbabalik ng bahagi ng binayarang komisyon.</li>
          </ul>

          <h2>I. Ang konsepto ng winrate at ang epekto ng variance</h2>
          <p>Ang kalamangan laban sa field, na ipinapahayag bilang winrate, ang pinakamahirap kalkulahin. Naiimpluwensyahan ito ng maraming patuloy na nagbabagong salik, na ang pinakamahalaga ay ang lakas ng mga kalaban sa mesa. Bukod pa rito, sa maiikling distansya napakalaki ng epekto ng variance: ang isang statistically significant na winrate ay masusukat lamang pagkatapos maglaro ng sampu-sampung libong kamay.</p>
          <p>Karaniwang sinusukat ang winrate sa big blinds kada 100 kamay (<strong>bb/100</strong>). Sa analytical software, kadalasang kinakalkula ito bago bawasan ang komisyon (pre-rake). Kung hindi ninyo alam ang tamang winrate ninyo, maaari itong tantyahin nang tinatayang sa pamamagitan ng ganitong klasipikasyon:</p>
          <ul>
            <li><strong>Negatibong winrate</strong> — mas mahina kayong maglaro kaysa sa mga kalaban sa inyong limit;</li>
            <li><strong>0 bb/100</strong> — laro sa break-even, katulad ng karaniwang kalaban;</li>
            <li><strong>1–10 bb/100</strong> — katamtamang kalamangan laban sa field;</li>
            <li><strong>10–20 bb/100 pataas</strong> — malaking kalamangan (kadalasan, sa regular na paglalaro laban sa mahihinang kalaban).</li>
          </ul>

          <h2>II. Standard deviation at ang matematika ng distansya</h2>
          <p>Para suriin ang volatility ng mga resulta, ginagamit ang standard deviation (Standard Deviation, SD). Para sa cash games sa no-limit hold'em (NLH) ito ay tinatayang 100 bb/100, samantalang sa five-card pot-limit Omaha (PLO5) ito ay tumataas sa 200–250 bb/100 dahil sa mas mataas na densidad ng malalakas na kombinasyon.</p>
          <p>Napakahalagang maunawaan ang isang pangunahing pagkakaiba: ang winrate ay lumalaki nang <strong>linear</strong> kasabay ng bilang ng mga kamay na nilaro, samantalang ang standard deviation ay lumalaki nang proporsyonal sa <strong>square root</strong> ng distansya.</p>
          <p>Ganito ang hitsura ng formula ng standard deviation para sa anumang distansya:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="Ang SD para sa N na interval ay katumbas ng SD para sa 100 kamay, na pinarami sa square root ng N">SD<sub>N</sub> = SD<sub>100</sub> × √<span class="rad">N</span></div>
          <p>kung saan ang <em>N</em> ay ang bilang ng mga 100-kamay na interval na nilaro. Isa itong approximation: ipinapalagay nito ang kalayaan ng mga 100-kamay na segment, ngunit para sa praktikal na pagtatantya, sapat na ito.</p>

          <h3>Halimbawa ng kalkulasyon (bago ang rake)</h3>
          <p>Ang distansyang 10 000 kamay sa hold'em ay ang dami na natatapos ng isang aktibong manlalaro sa loob ng isang linggo sa 1–2 mesa. Dahil ang winrate at SD ay kinakalkula kada 100 kamay, itinuturing natin ang distansyang ito bilang 100 interval (<em>N</em> = 100).</p>
          <p>Una, kalkulahin natin ang standard deviation para sa buong distansya:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="Ang SD para sa 10 000 kamay ay katumbas ng 100 na pinarami sa square root ng 100, na katumbas ng 1000 big blinds">SD<sub>10&#8239;000</sub> = 100 × √<span class="rad">100</span> = 1000 BB</div>
          <p>Ngayon ihambing natin ang dalawang manlalaro (ang winrate dito ay <strong>bago ang rake</strong>):</p>
          <ul>
            <li><strong>Matagumpay na regular, +10 bb/100.</strong> Ang kanyang expected value sa distansya ay <strong>+1000 BB</strong>.</li>
            <li><strong>Talunang manlalaro na baguhan, −10 bb/100.</strong> Ang kanyang expected value ay <strong>−1000 BB</strong>.</li>
          </ul>
          <p>Ayon sa panuntunan ng confidence intervals ng normal distribution:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Saklaw ng resulta</th><th>Probabilidad</th></tr></thead>
            <tbody>
              <tr><td>EV ± 1 SD</td><td>≈ 68%</td></tr>
              <tr><td>EV ± 2 SD</td><td>≈ 95%</td></tr>
              <tr><td>EV ± 3 SD</td><td>≈ 99.7%</td></tr>
            </tbody>
          </table>
          <p>Para sa matagumpay na regular, na may probabilidad na 68%, ang resulta sa 10 000 kamay ay malamang nasa saklaw na:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="Ang EV plus-minus 1 SD ay katumbas ng 1000 BB plus-minus 1000 BB, ibig sabihin mula 0 hanggang 2000 big blinds">EV ± 1 SD = 1000 BB ± 1000 BB = [0; 2000] BB</div>
          <p>Ibig sabihin, kahit may namumukod-tanging winrate na 10 bb/100, mananatiling may tinatayang 16% na tsansa (kalahati ng natitirang 32%) na tapusin ang linggo nang lugi. At kabaligtaran: ang isang talunang manlalaro, na may parehong 68% na probabilidad, ay magpapakita ng resulta mula −2000 hanggang 0 BB — kaya mayroon din siyang mga 16% na tsansang isara ang distansya nang panalo. Ito mismong tampok na matematikal na ito ang nagpapanatili sa mga recreational player sa ecosystem ng poker.</p>
          <p><strong>Ngunit lahat ng ito ay ang larawan bago ibawas ang rake.</strong> Kung ano ang ginagawa dito ng komisyon — nasa susunod na seksyon.</p>

          <h2>III. Ang bigat ng rake: ang tahimik na pumapatay ng tubo</h2>
          <p>Ang rake ay ang komisyon na kinukuha ng poker room mula sa bawat pot na umabot sa flop (sa ilang room, kinukuha ang rake maging sa preflop — ayon sa senaryong 3-bet-fold). Ang bigat nito ay tinutukoy ng dalawang parameter: ang porsyento ng rake at ang limitasyon nito (cap, na ipinapahayag sa BB). Kung mas mataas ang mga indikador na ito, mas mahirap lumabas nang malinis na panalo. Kung kailangan ninyo ng mga pangunahing kaalaman — kung ano ang rake at rakeback at kung paano sila gumagana — magsimula sa gabay na <a href="/fil/guides/rake-and-rakeback-in-poker/">«Rake at rakeback sa poker»</a>.</p>
          <p>Kunin natin ang mga karaniwang parameter para sa mga gitnang limit: rake na 5% at cap na 5 BB. Depende sa istilo ng laro (tight o loose), sa loob ng 100 kamay ang manlalaro ay nagbabayad sa karaniwan ng humigit-kumulang 10 BB ng rake.</p>
          <p>Balikan natin ang ating regular. Sa loob ng 10 000 kamay (100 interval), kinakain ng rake:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="100 na pinarami sa 10 big blinds ay katumbas ng 1000 big blinds — ang buong rake sa 10 000 kamay">100 × 10 BB = 1000 BB</div>
          <p>Ito mismo ang lahat ng kanyang expected value. Ang buong distribution ay bumababa nang 1000 BB: <strong>ang net expected value ay nagiging zero</strong>, ang tunay na koridor ay nagiging [−1000; +1000] BB, at ang tsansang tapusin ang linggo nang lugi ay tumataas mula 16% hanggang halos <strong>50%</strong> — sa katunayan ay parang paghagis ng barya. Sa madaling salita, ang mahusay na teknikal na kalamangan na +10 bb/100 <em>bago</em> ang rake, pagkatapos ibawas ang komisyon, ay nagbibigay ng net winrate na eksaktong 0 bb/100. Dito mismo lumilitaw ang matinding pangangailangan para sa isang epektibong rakeback.</p>

          <h2>IV. Ang rakeback bilang saligan ng katatagan sa pananalapi</h2>
          <p>Ang rakeback ay ang pagbabalik ng bahagi ng binayarang komisyon pabalik sa inyong game account. Mayroong ilang modelo:</p>
          <ul>
            <li><strong>Progresibo (mga centralized room):</strong> nagsisimula ang pagbabalik sa 10% at, sa teorya, maaaring umabot sa 60–70%. Ngunit para sa matataas na status, kailangang maglaro ng napakalaking distansya habang nagbabayad ng komisyon sa mababang rate — at ito ay humahantong sa pagkawala ng orihinal na expected value.</li>
            <li><strong>Static (<a href="/fil/deals/decentralized/">mga decentralized na club app</a>):</strong> nag-aalok ang mga club ng nakapirming at malinaw na pagbabalik mula 20% hanggang 50% mula sa unang araw ng laro.</li>
            <li><strong>Agency (halimbawa, NUTS POKER):</strong> nagbibigay ang mga club ng malalaking kondisyong pang-partner sa mga ahente, at ang mga ito naman ay nagbabahagi ng rakeback nang direkta sa mga manlalaro — <a href="/fil/deals/">mga nakapirming deal hanggang 70%</a>. Kasabay nito, ang ahente ay nagsisilbing garantiya ng kaligtasan ng pondo at pagbabayad ng mga panalo (maliban sa mga paglabag sa mga patakaran ng platform — bawal na software, mga bot o teamplay).</li>
          </ul>

          <h2>V. Praktikal na halimbawa: ang halaga ng tamang pagpili</h2>
          <p>Balikan natin ang ating regular. Nagbabayad siya ng 10 BB na komisyon kada 100 kamay. Sa isang de-kalidad na <a href="/fil/deals/">rakeback deal na 70%</a>, nakukuha niya pabalik ang 7 BB kada 100 kamay — itinataas nito ang kanyang net winrate mula 0 hanggang <strong>+7 bb/100</strong>. Ganito ang buong hitsura ng chain nang malinaw:</p>
          <table class="pdh-tbl">
            <thead><tr><th>Indikador</th><th>bb/100</th></tr></thead>
            <tbody>
              <tr><td>Winrate bago ang rake</td><td>+10</td></tr>
              <tr><td>Rake</td><td>−10</td></tr>
              <tr><td><strong>Net nang walang rakeback</strong></td><td><strong>0</strong></td></tr>
              <tr><td>Rakeback 70%</td><td>+7</td></tr>
              <tr><td><strong>Net na may rakeback</strong></td><td><strong>+7</strong></td></tr>
            </tbody>
          </table>
          <p>Sa distansyang 10 000 kamay, ang pagbabalik ay aabot sa <strong>700 BB</strong> na malinis na tubo: ang net expected value ay muling pumapasok sa panalo (+700 BB), ang distribution ay tumataas, at ang tsansang tapusin ang linggo nang lugi ay bumababa mula ~50% pabalik sa tinatayang 24%. Kahit ang isang recreational player na naglalaro nang lugi ay makababawi ng parehong 700 BB at malaki ang maibababa sa kanyang pagkalugi.</p>
          <p>Kung ang mga manlalarong ito ay naglalaro sa limit na NL500 ($2/$5, kung saan ang 1 BB ay katumbas ng $5), ang lingguhang bayad ng malinis na rakeback ay aabot sa:</p>
          <div class="pdh-fx" role="math" dir="ltr" aria-label="700 big blinds na pinarami sa 5 dolyar ay katumbas ng 3500 dolyar">700 BB × $5 = $3&#8239;500</div>
          <p>Ito mismo ang dahilan kung bakit sa pagbuo ng isang pangmatagalang karera sa poker ay talagang hindi maaaring balewalain ang mga kondisyon ng rakeback. Ang paglalaro sa mga room na may mataas na bigat ng rake at walang pagbabalik ng komisyon ay isang garantisadong paraan para pagkaitan ang sarili ng nararapat na tubo. <a href="/fil/deals/">Ikumpara ang mga kasalukuyang rakeback deal</a> sa katalogo ng PokerDealsHub.</p>

          <h2>Mga madalas itanong</h2>
          <h3>Ano ang winrate na bb/100 at anong winrate ang itinuturing na mabuti?</h3>
          <p>Ang winrate ay ang karaniwang panalo sa big blinds kada 100 kamay (bb/100), kadalasang bago ibawas ang rake. 0 bb/100 — laro sa break-even, 1–10 bb/100 — katamtamang kalamangan, 10–20 bb/100 pataas — malakas na kalamangan, katangian ng paglalaro laban sa mahihinang kalaban.</p>
          <h3>Bakit maaaring matalo sa buong linggo kahit may winrate na +10 bb/100?</h3>
          <p>Dahil sa variance. Sa 10 000 kamay, ang standard deviation ay katumbas ng 1000 BB, kaya kahit may winrate na +10 bb/100 bago ang rake (EV +1000 BB), ang resulta na may probabilidad na 68% ay nasa saklaw na [0; 2000] BB — mga 16% na tsansang lumugi. At pagkatapos ibawas ang rake, ang net expected value ay bumababa sa zero, at kung walang rakeback, ang tsansang tapusin ang linggo nang lugi ay halos 50% na.</p>
          <h3>Paano nakakaapekto ang rakeback sa panghuling tubo?</h3>
          <p>Ibinabalik ng rakeback ang bahagi ng binayarang komisyon. Sa rake na humigit-kumulang 10 BB/100 at deal na 70%, ibinabalik ng manlalaro ang 7 BB/100 — itinataas nito ang net winrate mula 0 hanggang +7 bb/100, ibig sabihin 700 BB sa 10 000 kamay, o $3&#8239;500 sa limit na NL500. Kadalasan ang rakeback mismo ang nagpapalit ng resultang zero tungo sa matatag na panalo.</p>
          <h3>Anong rakeback ang itinuturing na mataas?</h3>
          <p>Sa mga centralized room, ang matataas na rate ng pagbabalik (60–70%) ay nangangailangan ng napakalaking dami ng laro. Ang mga club app ay nagbibigay ng nakapirming 20–50% agad, samantalang ang mga agency deal — hanggang 70% mula sa unang araw. Ang mga kasalukuyang alok ay nakalap sa katalogo ng <a href="/fil/deals/">PokerDealsHub</a>.</p>

