  uk:
    title: RNG підкручений, гра нечесна — розбираємося, що відбувається насправді
    description: >-
      Чому здається, що RNG підкручений? Розбираємо дисперсію, вибіркову пам'ять і рейкове навантаження. Рахуємо
      стандартне відхилення й показуємо, як рейкбек до 70% перетворює мінус на плюс.
    body: |-
      <article>
          

          <p>П'ятий поспіль програний олл-ін. Дві години без влучань у флоп. Кожна роздача наче прописана проти вас.
          Виникає знайома думка: <em>«RNG точно підкручений».</em>
          Щоб розібратися, давайте спокійно подивимося, кому це може бути вигідно, як перевірити чесність гри і що насправді стоїть за цим відчуттям.</p>

          <h2>💸 Чи вигідно руму «підкручувати»?</h2>

          <p>На перший погляд — так. Якщо фішам щастить, вони довше живуть і продовжують вносити гроші. Регуляри бачать активне поле, думають, що просто не йде карта, і залишаються за столами. Усі грають — рейк капає.</p>

          <p>Насправді ж це короткострокова вигода й довготривалий крах. Щойно досвідчені гравці почнуть аналізувати статистику, правда розкриється, а репутація руму загине. Саме тому великі платформи на кшталт <a href="/uk/deals/clubgg">ClubGG</a>, <a href="/uk/deals/pppoker">PPPoker</a>, <a href="/uk/deals/pokerbros">PokerBros</a> та <a href="/uk/deals/xpoker">X-Poker</a> використовують сертифіковані генератори випадкових чисел, що перевіряються iTechLabs і GLI. Підробляти їх немає сенсу: виграш — хвилинний, втрати — назавжди.</p>

          <h2>🧮 Як перевірити, чи все чесно</h2>

          <p>Найпростіший спосіб — аналізувати історію рук. Дивитися потрібно не на емоції, а на цифри.</p>

          <ul>
            <li><strong>PokerCraft</strong> — вбудований у ClubGG та GGPoker;</li>
            <li><strong>PokerTracker 4</strong> та <strong>Hand2Note</strong> — підходять для PPPoker і PokerBros (через імпорт історії рук);</li>
            <li><strong>DriveHUD 2</strong> — зручна альтернатива з візуальним аналізом EV.</li>
          </ul>

          <p>Завантажте хоча б 50 000 роздач і порівняйте графіки <strong>All-in EV</strong> та реального результату. Якщо на дистанції вони сходяться — RNG працює чесно.
          Якщо розбіжність стійка й величезна — тоді можна копати глибше. І вже повірте, якби професійні гравці знайшли такі розбіжності, вони б напевно проаналізували дані сотні акаунтів і викотили викривальні матеріали на найавторитетніших покерних ресурсах.</p>

          <p>А щоб отримувати максимум із чесної гри — використовуйте рейкбек. На <a href="/uk/deals/">PokerDealsHub</a> зібрані найкращі пропозиції для <a href="/uk/deals/pppoker">PPPoker</a>, <a href="/uk/deals/clubgg">ClubGG</a>, <a href="/uk/deals/xpoker">X-Poker</a> та <a href="/uk/deals/pokerbros">PokerBros</a>. Угоди з поверненням до <strong>70%</strong> реально існують і змінюють економіку гри.</p>

          <h2>📉 То якщо це не підкрутка, то що?</h2>

          <h3>1. Дисперсія</h3>
          <p>Навіть ідеальна гра не захищає від мінусової смуги. Це не змова, а статистика.</p>

          <ul>
            <li><strong>NL50</strong> — дисперсія близько 80 ББ/100. За 400 рук стандартне відхилення (σ) ≈ √4 × 80 = 160 ББ ≈ $80.</li>
            <li><strong>PLO5 50</strong> — дисперсія близько 175 ББ/100. σ ≈ √4 × 175 = 350 ББ ≈ $175.</li>
          </ul>

          <p>Імовірність зіграти гірше ніж на 1σ (−$80 на NL50) становить близько <strong>16%</strong>.  
            Гірше ніж на 2σ (−$160 на NL50 або −$350 на PLO5) — приблизно <strong>2,5%</strong>.  
            Інакше кажучи, приблизно кожна сорокова коротка сесія здаватиметься проклятою.  
            Це навіть <strong>імовірніше, ніж зловити один аут на ривері</strong> — а такі ривери, як ми знаємо, трапляються постійно.  
            У PLO ж дисперсія від початку вища — коливання можуть бути до <strong>в 1,5 раза сильнішими</strong>, ніж у Холдемі,  
            тому просадки там відчуваються особливо болісно, навіть за абсолютно чесного RNG.</p>
          
          <h3>2. Вибіркова пам'ять</h3>
          <p>Ми пам'ятаємо біль, а не норму. П'ять програних олл-інів викликають бурю емоцій, а п'ять виграних поспіль проходять непоміченими. Без трекера й статистики сприйняття завжди буде спотворене.</p>

          <h3>3. Рейкове навантаження</h3>
          <p>Ось справжній ворог.
          Уявіть: ви граєте NL50 з винрейтом +8 ББ/100, але рум бере рейк 10 ББ/100.
          У підсумку ви програєте 2 ББ/100 і починаєте сумніватися в усьому — хоча причина суто математична.</p>

          <h2>💰 Як рейкбек змінює картину</h2>

          <p>Додамо рейкбек 60% — цілком реальну угоду для постійних гравців:</p>
