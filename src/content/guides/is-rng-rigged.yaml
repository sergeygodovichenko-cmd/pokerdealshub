          <li>Sem rakeback: −2 × 0.5 × 200 / 100 = <strong>−$2 por hora</strong></li>
          <li>Com rakeback de 60%: +4 × 0.5 × 200 / 100 = <strong>+$4 por hora</strong></li>
        </ul>

        <p>A diferença é de $6 por hora, ou cerca de $500-$1200 por mês, dependendo de quanto e em quais limites você joga.
