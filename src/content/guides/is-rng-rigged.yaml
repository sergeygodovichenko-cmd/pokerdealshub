  he:
    title: ה-RNG מסובב, המשחק לא הוגן — בואו נבין מה באמת קורה
    description: >-
      למה נדמה שה-RNG מסובב? אנחנו מנתחים שונות, זיכרון סלקטיבי ועומס רייק. מחשבים סטיית תקן ומראים כיצד רייקבק של עד
      70% הופך את המינוס לפלוס.
    body: |-
      <article>
        

        <p>אול-אין חמישי רצוף שהפסדת. שעתיים בלי שום פגיעה בפלופ. כל יד נדמית כאילו נכתבה נגדך.
        עולה המחשבה המוכרת: <em>«ה-RNG בטוח מסובב».</em>
        כדי להבין את זה, בואו נסתכל ברוגע על מי יכול להרוויח מכך, איך לבדוק את הגינות המשחק ומה באמת עומד מאחורי התחושה הזו.</p>

        <h2>💸 האם משתלם לחדר ל“סובב”?</h2>

        <p>במבט ראשון — כן. אם לדגים יש מזל, הם שורדים זמן רב יותר וממשיכים להזרים כסף. הרגולרים רואים שדה פעיל, חושבים שפשוט לא הולך להם הקלף, ונשארים ליד השולחנות. כולם משחקים — הרייק זורם.</p>

        <p>בפועל זה רווח קצר טווח וקריסה ארוכת טווח. ברגע ששחקנים מנוסים יתחילו לנתח את הסטטיסטיקה, האמת תתגלה, והמוניטין של החדר ייהרס. בדיוק לכן פלטפורמות גדולות כמו <a href="/he/deals/clubgg">ClubGG</a>, <a href="/he/deals/pppoker">PPPoker</a>, <a href="/he/deals/pokerbros">PokerBros</a> ו-<a href="/he/deals/xpoker">X-Poker</a> משתמשות במחוללי מספרים אקראיים (RNG) מוסמכים, הנבדקים על ידי iTechLabs ו-GLI. אין שום היגיון לזייף אותם: הרווח רגעי, וההפסדים — לנצח.</p>

        <h2>🧮 איך לבדוק שהכול הוגן</h2>

        <p>הדרך הפשוטה ביותר — לנתח את היסטוריית הידיים. צריך להסתכל לא על הרגשות, אלא על המספרים.</p>

        <ul>
          <li><strong>PokerCraft</strong> — מובנה ב-ClubGG וב-GGPoker;</li>
          <li><strong>PokerTracker 4</strong> ו-<strong>Hand2Note</strong> — מתאימים ל-PPPoker ו-PokerBros (דרך ייבוא היסטוריית הידיים);</li>
          <li><strong>DriveHUD 2</strong> — חלופה נוחה עם ניתוח חזותי של EV.</li>
        </ul>

        <p>טען לפחות 50,000 ידיים והשווה בין הגרפים של <strong>All-in EV</strong> והתוצאה האמיתית. אם לאורך המרחק הם מתכנסים — ה-RNG עובד בהגינות.
        אם הפער יציב ועצום — אז אפשר לחפור עמוק יותר. ותאמינו לי, אילו שחקנים מקצועיים היו מוצאים פערים כאלה, הם בוודאי היו מנתחים את הנתונים של מאות חשבונות ומפרסמים חומרי חשיפה באתרי הפוקר האמינים ביותר.</p>

        <p>וכדי להפיק את המקסימום ממשחק הוגן — השתמשו ברייקבק. ב-<a href="/he/deals/">PokerDealsHub</a> רוכזו ההצעות הטובות ביותר עבור <a href="/he/deals/pppoker">PPPoker</a>, <a href="/he/deals/clubgg">ClubGG</a>, <a href="/he/deals/xpoker">X-Poker</a> ו-<a href="/he/deals/pokerbros">PokerBros</a>. דילים עם החזר של עד <strong>70%</strong> באמת קיימים ומשנים את כלכלת המשחק.</p>

        <h2>📉 אז אם זה לא סיבוב, אז מה כן?</h2>

        <h3>1. שונות</h3>
        <p>אפילו משחק מושלם לא מגן מפני רצף הפסדים. זו לא קונספירציה, אלא סטטיסטיקה.</p>

        <ul>
          <li><strong>NL50</strong> — שונות של כ-80 ב"ב/100. עבור 400 ידיים סטיית התקן (σ) ≈ ‎√4 × 80 = 160 ב"ב ≈ $80.</li>
          <li><strong>PLO5 50</strong> — שונות של כ-175 ב"ב/100. σ ≈ ‎√4 × 175 = 350 ב"ב ≈ $175.</li>
        </ul>

        <p>ההסתברות לשחק גרוע יותר מ-1σ (‎−$80 ב-NL50) היא כ-<strong>16%</strong>.  
          גרוע יותר מ-2σ (‎−$160 ב-NL50 או ‎−$350 ב-PLO5) — כ-<strong>2.5%</strong>.  
          במילים אחרות, בערך כל סשן קצר ארבעים יורגש מקולל.  
          זה אפילו <strong>סביר יותר מלתפוס אאוט אחד על הריבר</strong> — וריברים כאלה, כפי שאנחנו יודעים, קורים כל הזמן.  
          ב-PLO השונות גבוהה יותר מלכתחילה — התנודות יכולות להיות חזקות עד <strong>פי 1.5</strong> מאשר בהולדם,  
          ולכן הדאונסווינגים שם מורגשים כואבים במיוחד, גם עם RNG הוגן לחלוטין.</p>
        
        <h3>2. זיכרון סלקטיבי</h3>
        <p>אנחנו זוכרים את הכאב, לא את הנורמה. חמישה אול-אין שהפסדת מעוררים סערת רגשות, ואילו חמישה ניצחונות רצופים חולפים מבלי שנשים לב. בלי טראקר וסטטיסטיקה התפיסה תמיד תהיה מעוותת.</p>

        <h3>3. עומס הרייק</h3>
        <p>הנה האויב האמיתי.
        תארו לעצמכם: אתם משחקים NL50 עם וינרייט של ‎+8 ב"ב/100, אבל החדר גובה רייק של 10 ב"ב/100.
        בסופו של דבר אתם מפסידים 2 ב"ב/100 ומתחילים לפקפק בכול — למרות שהסיבה מתמטית בלבד.</p>

        <h2>💰 איך הרייקבק משנה את התמונה</h2>

        <p>נוסיף רייקבק של 60% — דיל ריאלי לחלוטין עבור שחקנים קבועים:</p>
        <style>
          table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.95rem;
            color: #d0d0d0;
          }
          th, td {
            border: 1px solid #333;
            padding: 0.6rem 0.8rem;
            text-align: left;
          }
