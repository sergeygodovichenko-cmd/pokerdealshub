  it:
    title: Il RNG è truccato, il gioco non è onesto — capiamo cosa succede davvero
    description: >-
      Perché sembra che il RNG sia truccato? Analizziamo varianza, memoria selettiva e peso del rake. Calcoliamo la
      deviazione standard e mostriamo come un rakeback fino al 70% trasforma un minus in un plus.
    body: |-
      <article>
          

          <p>Il quinto all-in perso di fila. Due ore senza centrare il flop. Ogni mano sembra scritta contro di te.
          Affiora il pensiero di sempre: <em>«Il RNG è di sicuro truccato».</em>
          Per fare chiarezza, guardiamo con calma a chi potrebbe convenire, come verificare l'onestà del gioco e cosa si nasconde davvero dietro questa sensazione.</p>

          <h2>💸 Conviene alla room «truccare»?</h2>

          <p>A prima vista — sì. Se i fish sono fortunati, restano in gioco più a lungo e continuano a versare soldi. I regular vedono un campo attivo, pensano semplicemente di non ricevere carte e restano ai tavoli. Tutti giocano — il rake gocciola.</p>

          <p>In realtà è un vantaggio a breve termine e una rovina a lungo termine. Non appena i giocatori esperti iniziano ad analizzare le statistiche, la verità viene a galla e la reputazione della room crolla. Proprio per questo le grandi piattaforme come <a href="/it/deals/clubgg">ClubGG</a>, <a href="/it/deals/pppoker">PPPoker</a>, <a href="/it/deals/pokerbros">PokerBros</a> e <a href="/it/deals/xpoker">X-Poker</a> usano generatori di numeri casuali certificati, verificati da iTechLabs e GLI. Falsificarli non ha senso: il guadagno dura un attimo, le perdite restano per sempre.</p>

          <h2>🧮 Come verificare se è tutto onesto</h2>

          <p>Il modo più semplice è analizzare la cronologia delle mani. Bisogna guardare i numeri, non le emozioni.</p>

          <ul>
            <li><strong>PokerCraft</strong> — integrato in ClubGG e GGPoker;</li>
            <li><strong>PokerTracker 4</strong> e <strong>Hand2Note</strong> — adatti a PPPoker e PokerBros (tramite import della cronologia delle mani);</li>
            <li><strong>DriveHUD 2</strong> — una comoda alternativa con analisi visiva dell'EV.</li>
          </ul>

          <p>Carica almeno 50.000 mani e confronta i grafici dell'<strong>All-in EV</strong> e del risultato reale. Se sulla distanza convergono — il RNG lavora in modo onesto.
          Se lo scostamento è costante ed enorme — allora si può scavare più a fondo. E credimi, se i giocatori professionisti trovassero scostamenti del genere, di sicuro analizzerebbero i dati di centinaia di account e pubblicherebbero materiali di denuncia sui portali di poker più autorevoli.</p>

          <p>E per spremere il massimo dal gioco onesto — usa il rakeback. Su <a href="/it/deals/">PokerDealsHub</a> trovi le migliori offerte per <a href="/it/deals/pppoker">PPPoker</a>, <a href="/it/deals/clubgg">ClubGG</a>, <a href="/it/deals/xpoker">X-Poker</a> e <a href="/it/deals/pokerbros">PokerBros</a>. Le deal con un rimborso fino al <strong>70%</strong> esistono davvero e cambiano l'economia del gioco.</p>

          <h2>📉 Quindi, se non è un trucco, cos'è?</h2>

          <h3>1. La varianza</h3>
          <p>Nemmeno un gioco perfetto ti protegge da una striscia negativa. Non è un complotto, è statistica.</p>

          <ul>
            <li><strong>NL50</strong> — varianza intorno agli 80 BB/100. Su 400 mani la deviazione standard (σ) ≈ √4 × 80 = 160 BB ≈ $80.</li>
            <li><strong>PLO5 50</strong> — varianza intorno ai 175 BB/100. σ ≈ √4 × 175 = 350 BB ≈ $175.</li>
          </ul>

          <p>La probabilità di fare peggio di 1σ (−$80 su NL50) è circa il <strong>16%</strong>.  
            Peggio di 2σ (−$160 su NL50 o −$350 su PLO5) — circa il <strong>2,5%</strong>.  
            In altre parole, all'incirca una sessione corta su quaranta sembrerà maledetta.  
            È persino <strong>più probabile che pescare un solo out al river</strong> — e questi river, lo sappiamo, capitano di continuo.  
            Nel PLO, poi, la varianza è di base più alta — le oscillazioni possono essere fino a <strong>1,5 volte più forti</strong> che nell'Hold'em,  
            perciò i downswing si sentono in modo particolarmente doloroso, anche con un RNG perfettamente onesto.</p>
          
          <h3>2. La memoria selettiva</h3>
          <p>Ricordiamo il dolore, non la norma. Cinque all-in persi scatenano una tempesta di emozioni, mentre cinque vinti di fila passano inosservati. Senza un tracker e le statistiche, la percezione sarà sempre distorta.</p>

          <h3>3. Il peso del rake</h3>
          <p>Ecco il vero nemico.
          Immagina: giochi a NL50 con un winrate di +8 BB/100, ma la room preleva un rake di 10 BB/100.
          Alla fine perdi 2 BB/100 e cominci a dubitare di tutto — anche se la causa è puramente matematica.</p>

          <h2>💰 Come il rakeback cambia il quadro</h2>

          <p>Aggiungiamo un rakeback del 60% — una deal del tutto realistica per i giocatori abituali:</p>
          <style>
