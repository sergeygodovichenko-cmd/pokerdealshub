            <tr><td>Winrate sebelum rake</td><td>+8 BB/100</td></tr>
            <tr><td>Rake</td><td>10 BB/100</td></tr>
            <tr><td>Winrate tanpa rakeback </td><td>-2 BB/100</td></tr>
            <tr><td>Rakeback</td><td>60%</td></tr>
