        <p>A probabilidade de jogar pior do que 1σ (−$80 no NL50) é de cerca de <strong>16%</strong>.  
          Pior do que 2σ (−$160 no NL50 ou −$350 no PLO5) — aproximadamente <strong>2,5%</strong>.  
          Em outras palavras, mais ou menos a cada quarenta sessões curtas uma vai parecer amaldiçoada.  
          Isso é até <strong>mais provável do que pegar um out no river</strong>, e esses rivers, como sabemos, acontecem o tempo todo.  
          No PLO a variância já é mais alta de saída: as oscilações podem ser até <strong>1,5 vez mais fortes</strong> do que no Hold'em,  
          por isso os downswings ali doem especialmente, mesmo com um RNG absolutamente honesto.</p>
        
        <h3>2. Memória seletiva</h3>
        <p>Lembramos da dor, não do normal. Cinco all-ins perdidos provocam uma tempestade de emoções, enquanto cinco ganhos seguidos passam despercebidos. Sem tracker e sem estatísticas, a percepção sempre será distorcida.</p>

        <h3>3. Carga do rake</h3>
        <p>Aqui está o verdadeiro inimigo.
        Imagine: você joga NL50 com um winrate de +8 BB/100, mas a sala cobra um rake de 10 BB/100.
        No fim, você perde 2 BB/100 e começa a duvidar de tudo, embora a causa seja puramente matemática.</p>

