    <p>Теперь переведём в деньги, для NL50 (блайнд $0.5, 200 раздач в час, 4 стола):</p>
    <ul>
      <li>Без рейкбэка: −2 × 0.5 × 200 / 100 = <strong>−$2 в час</strong></li>
      <li>С рейкбэком 60%: +4 × 0.5 × 200 / 100 = <strong>+$4 в час</strong></li>
