        <p>El rake reduce directamente el winrate del jugador. Puedes ganar de forma estable a tus rivales, tener un EV positivo y, aun así, terminar el mes en negativo, todo por culpa de la comisión. Cuanto más altos son los límites y más manos juegas, mayor es el impacto.</p>
        <p>Aun así, el rake no es malo en sí mismo. Sin él no existiría el negocio del póker: con esas comisiones se mantienen las salas, se pagan los torneos, el soporte, el software y la seguridad del juego. Así que es un enemigo sin el cual la industria simplemente no sobreviviría.</p>

        <h2>Si el rake es el enemigo, el rakeback es el aliado del jugador</h2>
        <p>El rakeback es la devolución de una parte del rake pagado. Dicho de forma sencilla, la sala o el club devuelve al jugador un porcentaje de la comisión que este ya generó. Al principio el rakeback era solo un bono, pero con el tiempo se convirtió en una herramienta clave para captar y retener jugadores.</p>
