        <p>El rake es la comisión que la sala de póker cobra de cada bote jugado. Suele rondar el 5 % y, a primera vista, parece insignificante. Pero es importante entender que el rake se cobra <em>cada vez</em> que las fichas cambian de manos. En una sola sesión puede haber cientos de esas manos y, al final, incluso un jugador activo y ganador pierde una cantidad considerable.</p>
