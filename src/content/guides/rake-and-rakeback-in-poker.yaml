          <p>Dabei ist Rake an sich nichts Böses. Ohne ihn gäbe es kein Poker-Business: Von diesen Gebühren leben die Rooms, werden Turniere, Support, Software und Spielsicherheit finanziert. Es ist also ein Feind, ohne den die Branche schlicht nicht überleben würde.</p>

