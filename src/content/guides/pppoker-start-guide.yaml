        <p>Oʻyin hajmi qancha katta boʻlsa, reyk-bek foizi shuncha yuqori boʻladi. Bundan tashqari, koʻplab klublar faol oʻyinchilar uchun qoʻshimcha bonuslar, sadoqat dasturlari va aksiyalar taklif etadi.</p>

