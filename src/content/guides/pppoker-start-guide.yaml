          <p>بعد التسجيل ستتمكن من اختيار النادي والحدود وصيغة اللعب. للحصول على الريكباك يكفي الاتفاق على الشروط مع وكيل أو شريك يقترح نسبة ريكباك بحسب حجم لعبك.</p>

