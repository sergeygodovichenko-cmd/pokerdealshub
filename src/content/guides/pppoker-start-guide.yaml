          <ul>
            <li>Новачки — 40–50%</li>
            <li>Регуляри — до 60%</li>
            <li>Партнери — до 70% і вище</li>
          </ul>

          <p>Що більший обсяг гри, то вищий відсоток рейкбеку. Крім того, багато клубів пропонують додаткові бонуси, програми лояльності й акції для активних гравців.</p>

