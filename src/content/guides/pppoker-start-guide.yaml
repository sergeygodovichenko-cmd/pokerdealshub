          <h2>💰 الريك والريكباك في PPPoker</h2>

          <p><strong>الريك</strong> هو العمولة التي يأخذها النادي من كل توزيعة أو بطولة. في PPPoker يُحدَّد بشكل فردي ويتراوح عادةً بين 3–5%.</p>

          <p>عبر الوكلاء يحصل اللاعبون على <strong>ريكباك</strong> — استرداد جزء من الريك:</p>
