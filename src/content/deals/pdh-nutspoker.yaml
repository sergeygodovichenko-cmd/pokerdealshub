  рекреационных игроков из Азии.</p>


  <h3>О союзе</h3>

  <p>NUTS POKER — централизованное покерное приложение. Хоть оно и имеет клубную систему, но клубы используются только
  для назначения игрокам рейкбэков. При этом все игры происходят в общем пуле игроков. Депозиты и кешауты производятся
  через автоматизированный процессинг. Интерфейс максимально прост и удобен: игра запускается в пару кликов, статистика
  и касса полностью внедрены в систему, а служба безопасности круглосуточно контролирует игру.</p>

  <p>Ключевые особенности:</p>

  <ul>
    <li>Поддержка всех популярных форматов — NLH, PLO4/5/6, MTT, SpinUp</li>
    <li>Клиенты для iOS, Android и Windows</li>
    <li>Игра идёт 24/7 на низких и средних лимитах</li>
    <li>Реглуярные акции и бесплатные турниры. Рекордная гарантия фриролла – $36,000!</li>
  </ul>


  <h3>О сделке</h3>

  <p>Игрокам предоставляется на выбор:</p>

  <ul>
    <li><strong>Динамический рейкбэк до 50%</strong> Рейкбэк зависит от недельного объема рейка.</li>
    <li><strong>Фиксированный рейкбэк 25%</strong> Получите возможность начать игру с преимуществом сразу после регистрации. В последствии можно перейти на динамический.</li>
  </ul>
