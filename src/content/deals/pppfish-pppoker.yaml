body: >-
  <h3>Описание</h3>

  <p>Покерная сделка в клубе Kangaroo, который состоит в известном союзе PPPFish на PPPoker. В клубе играют
  преимущественно австралийцы и китайцы.</p>


  <h3>О союзе PPPFish на PPPoker</h3>

  <p>PPPFish — крупнейший австралийский союз в котором, в основном, играют рекреационные игроки из китая и австралии.
  Союз славится своей мякгой поляной в турнирах и Омахе.</p>

  <p>Доступные дисциплины: NLH, PLO4/5/6, MTT а также модификаторы Bomb Pot, Pot Or Fold и Double Board. Активная игра
  идёт преимущественно в 7:00 – 14:00 по GMT (UTC+0)</p>


  <h3>О сделке</h3>

  <p>Игрокам предоставляется на выбор:</p>

  <ul>
    <li><strong>Динамический рейкбэк до 55%</strong> Рейкбэк зависит от недельного объема рейка.</li>
    <li><strong>Фиксированный рейкбэк 35%</strong> Получите возможность начать игру с преимуществом сразу после регистрации. В последствии можно перейти на динамический.</li>
  </ul>
