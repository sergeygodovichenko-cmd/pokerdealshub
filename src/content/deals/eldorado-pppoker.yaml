  Bomb Pot, Double Board и HeadsUp.</p>

  <p>Бразильцы славятся своим лузово-агрессивным стилем игры в покер. И поэтому дисциплинированные игроки со
  сбалансированной стратегией как правило получают значительное преимущество.</p>

  <p>Рекомендуемые дисциплины: PLO4, PLO5, PLO6. Игра идет круглосуточно, пик активности приходится на 18:00 - 20:00 по
  GMT-3.</p>


  <h3>О сделке</h3>

  <p>Игрокам предоставляется на выбор:</p>

  <ul>
    <li><strong>Динамический рейкбэк до 70%</strong> Рейкбэк зависит от недельного объема рейка.</li>
    <li><strong>Фиксированный рейкбэк 35%</strong> Получите возможность начать игру с преимуществом сразу после регистрации. В последствии можно перейти на динамический.</li>
  </ul>
