body: >-
  <h3>Описание</h3>

  <p>Monkeys VIPS — эксклюзивный клуб в союзе Paradise на платформе PokerBros. Клуб предлагает высокий рейкбэк и
  активную игру на всех лимитах с 19:00 до 23:00 по GMT-7. Идеально подходит для игроков из Северной и Южной
  Америки.</p>


  <h3>О союзе</h3>

  <p>Paradise Union — один из крупнейших союзов на платформе PokerBros, объединяющий более 30 клубов с игроками со всего
  мира. Союз предлагает разнообразные форматы игры, включая NLH, PLO4/5/6, MTT и другие. Игра в основном идёт на средних
  и низких лимитах. Союз известен своими рекреационными игроками.</p>

  <p>Доступные дисциплины: NLH, PLO4/5/6, MTT а также модификатор Bomb Pot. Активная игра идёт круглосуточно на всех
  лимитах с большим количеством рекреационных игроков из США.</p>


  <h3>О сделке</h3>

  <p>Игрокам предоставляется на выбор:</p>

  <ul>
    <li><strong>Динамический рейкбэк до 55%</strong> Рейкбэк зависит от недельного объема рейка.</li>
    <li><strong>Фиксированный рейкбэк 25%</strong> Получите возможность начать игру с преимуществом сразу после регистрации. В последствии можно перейти на динамический.</li>
  </ul>
