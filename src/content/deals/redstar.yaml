body: >
  <h3>О руме</h3>


  <p>Red Star Poker работает с 2005 года в сети iPoker — одной из старейших покерных сетей Европы. Это единственный её
  скин, который принимает игроков из стран СНГ, поэтому для русскоязычной аудитории рум занимает особое место.</p>


  <p>Общий пул сети в пиковые часы — около семи тысяч игроков. Генератор случайных чисел сертифицирован iTech Labs,
  счета ведутся в евро, минимальный депозит — 10 единиц валюты счёта.</p>


  <h3>Игра и форматы</h3>


  <p>За столами идут безлимитный холдем, пот-лимитная Омаха и турниры — от дешёвых сателлитов до серий с крупными
  гарантиями. Для рума можно организовать закрытые фрироллы под конкретную группу игроков.</p>


  <p>В отличие от многих современных площадок, здесь разрешены трекеры и HUD, а также доступны прямые переводы средств
  между игроками (P2P) — это заметно упрощает ввод и вывод в СНГ.</p>


  <h3>Бонус и условия</h3>


  <ul>
    <li><strong>Приветственный бонус 200%</strong>.</li>
    <li><strong>Приём игроков из СНГ</strong> — редкость для сети iPoker.</li>
    <li><strong>P2P-переводы и эксклюзивные фрироллы</strong>.</li>
  </ul>


  <p>Персональные условия сделки по Red Star Poker уточняйте у менеджера PDH — мы на связи 24/7.</p>
