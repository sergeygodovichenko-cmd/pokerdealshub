body: >-
  <h3>Описание</h3>

  <p>Покерная сделка в клубе Stampede, который состоит в крупнейшем союзе Massiv Union на ClubGG. Сочетание удобного и
  надежного приложения, отличного пула игроков и высокого рейкбэка делает эту сделку одной из лучших.</p>


  <h3>О союзе</h3>

  <p>Massiv Union — без преувеличения легендарный союз на ClubGG. Костяк аудитории - игроки из США, Канады, Израиля и
  стран Азии. Создатели союза поставили в приоритет поддержание честной и мягкой игры, максимально поощряя слабых
  рекреационных игроков. Благодаря этому, играть и выигрывать в этом союзе вполне реально!</p>

  <p>Доступные дисциплины: NLH, PLO4/5/6, MTT а также модификатор Bomb Pot. Благодаря широкой географии, активная игра
  идёт круглосуточно на всех лимитах. Значительная часть людей за столом - рекреационные игроки.</p>

  <p>В союзе действует огромный <strong>Bad Beat Jackpot</strong>, фонд которого переваливает за <strong>$500
  000</strong>. Это дополнительная возможность получить крупный выигрыш даже при неудачной раздаче.</p>


  <h3>О сделке</h3>

  <p>Игрокам предоставляется на выбор:</p>

  <ul>

  <li><strong>Динамический рейкбэк до 55%</strong> Рейкбэк зависит от недельного объема рейка.</li>

  <li><strong>Фиксированный рейкбэк 25%</strong> Получите возможность начать игру с преимуществом сразу после
  регистрации. В последствии можно перейти на динамический.</li>

  </ul>
