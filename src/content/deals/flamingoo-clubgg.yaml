body: >-
  <h3>Описание</h3>

  <p>Покерная сделка в клубе Monkeys Paradise, который состоит в международном союзе Flamingoo на ClubGG — оффициальном
  приложении от GGPoker. Помимо надёжной платформы клуб предлагает отличную площадку для рекреационных игроков.</p>


  <h3>О союзе</h3>

  <p>Flamingoo — один из ведущих союзов на платформах ClubGG и PokerBros, специализирующийся на американском рынке. Союз
  был основан в 2020 году и зарекомендовал себя как надёжный партнёр для игроков всех уровней.</p>

  <p>Доступные дисциплины: NLH, PLO4/5/6, MTT. Активная игра идёт круглосуточно.</p>


  <h3>О сделке</h3>

  <p>Игрокам предоставляется на выбор:</p>

  <ul>

  <li><strong>Динамический рейкбэк до 60%</strong> Рейкбэк зависит от недельного объема рейка.</li>

  <li><strong>Фиксированный рейкбэк 30%</strong> Получите возможность начать игру с преимуществом сразу после
  регистрации. В последствии можно перейти на динамический.</li>

  </ul>
