body: >-
  <h3>Описание</h3>

  <p>Покерная сделка в клубе Rake2Win, который состоит в Тайваньском союзе Rake2High на ClubGG. В клубе играют в
  основном низкие лимиты.</p>


  <h3>О союзе</h3>

  <p>Rake2High — один из самых динамичных тайваньских союзов на платформе ClubGG, объединяющий множество клубов из Азии.
  Союз ориентирован на рекреационных игроков и предлагает активное поле с постоянным экшеном на низких и средних
  лимитах.</p>


  <h3>О сделке</h3>

  <p>Игрокам предоставляется на выбор:</p>

  <ul>
    <li><strong>Динамический рейкбэк до 45%</strong> Рейкбэк зависит от недельного объема рейка.</li>
    <li><strong>Фиксированный рейкбэк 30%</strong> Получите возможность начать игру с преимуществом сразу после регистрации. В последствии можно перейти на динамический.</li>
  </ul>
