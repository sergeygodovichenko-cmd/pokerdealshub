  vi:
    title: Backing trong poker — staking và tài trợ người chơi
    description: >-
      Backing, staking và tài trợ người chơi poker (stable poker / chuồng ngựa) từ PokerDealsHub: chơi cao hơn bankroll
      của bạn với makeup. Còn các deal của chúng tôi — những club hàng đầu với soft field, rakeback cao và bảo đảm chi
      trả — dành cho tất cả mọi người, kể cả khi không cần backing.
    body: |-
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>Backing (staking)</strong> là hình thức tài trợ cho người chơi: backer bỏ tiền cho ván đấu, người chơi poker thi đấu và chia lợi nhuận. Nhóm người chơi được backing gọi là <strong>stable poker</strong> (chuồng ngựa). Chúng tôi nhận vào stable những người chơi tài năng, sẵn sàng chơi ở mức cược cao hơn khả năng bankroll của họ — <strong>tiền chơi là do chúng tôi cấp, bạn chơi với makeup</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          Nhưng quan trọng nhất — quyền tiếp cận những câu lạc bộ poker tốt nhất với soft field, rakeback cao và bảo đảm chi trả thì chúng tôi mở cho <strong>tất cả mọi người</strong>: cả trong khuôn khổ backing lẫn khi chơi bằng tiền của bạn. Dưới đây là những gì bạn nhận được khi hợp tác với các deal của chúng tôi.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Các deal của chúng tôi — dành cho tất cả mọi người</h2>
        <p class="text-neutral-300 mb-6">
          Điều kiện của PokerDealsHub không đòi hỏi backing — bạn có thể sử dụng chúng khi chơi bằng tiền của mình. Bạn được tiếp cận những deal thường chỉ dành cho các đối tác nội bộ của club:
        </p>
        <ul class="space-y-3 text-neutral-300 mb-6">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Những club và union tốt nhất với soft field</strong> — nơi bạn thật sự đánh bại được bàn chơi, chứ không phải vật lộn với đám regular.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Rakeback cố định cao — lên đến 70%</strong> — lợi nhuận cộng thêm ngoài kết quả tại bàn, ngay từ ngày đầu tiên.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Bảo đảm chi trả</strong> — ngoại trừ trường hợp có bằng chứng sử dụng bot hoặc chơi đồng đội (teamplay).</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Các club đã được kiểm chứng và điều kiện minh bạch</strong> — rakeback rõ ràng, chi trả nhanh, hỗ trợ 24/7.</span>
          </li>
        </ul>
        <div class="flex justify-center">
          <a href="/vi/deals/" class="flex items-center justify-center gap-2 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
            Xem danh mục deal
          </a>
        </div>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Backing: chơi cao hơn bankroll của bạn</h2>
        <p class="text-neutral-300 mb-4">
          Nếu bạn muốn chơi ở mức cao hơn nhưng vốn của bạn hiện chưa đủ — chúng tôi có thể nhận bạn vào stable poker của mình. Chúng tôi tìm kiếm những ai:
        </p>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Người chơi có lãi, muốn chơi cao hơn mức bankroll cho phép.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Những regular kỷ luật, sẵn sàng chơi theo khối lượng và tuân thủ nghiêm ngặt quy định của các nền tảng.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Những ai có thể chứng minh năng lực — bằng lịch sử winrate ở các club khác nhau.</span>
          </li>
        </ul>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Điều kiện hợp tác</h3>
        <p class="text-neutral-300 mb-4">
          Bankroll để chơi do chúng tôi cung cấp. Bạn chơi <strong>với makeup</strong>: phần chia lợi nhuận của bạn được tính sau khi đã bù xong khoản âm, nếu có. Không cần bỏ vốn của riêng bạn vào ván đấu — chỉ cần thời gian và tay nghề của bạn.
        </p>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Cách thức chi trả</h3>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
