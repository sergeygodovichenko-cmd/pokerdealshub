  fil:
    title: Backing sa poker — staking at financing ng mga player
    description: >-
      Backing, staking at financing ng mga poker player (poker stable) mula sa PokerDealsHub: maglaro nang mas mataas sa
      iyong bankroll gamit ang makeup. At ang aming mga deal — top club na may soft field, mataas na rakeback at
      garantiya sa payout — bukas para sa lahat, kahit walang backing.
    body: |-
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>Backing (staking)</strong> — ito ang financing sa isang manlalaro: ibinibigay ng backer ang pera para sa laro, ang poker player ang naglalaro at hinahati ang kita. Ang pool ng mga player na naka-backing ay tinatawag na <strong>poker stable</strong>. Kinukuha namin sa aming stable ang mga talentadong player na handang maglaro sa mga limit na mas mataas kaysa pinapayagan ng kanilang bankroll — <strong>kami ang nagbibigay ng pera para sa laro, ikaw ang naglalaro na may makeup</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          Pero ang pinakamahalaga — ang access sa pinakamahuhusay na poker club na may soft field, mataas na rakeback at garantiya sa payout ay binubuksan namin para sa <strong>lahat</strong>: kapwa sa loob ng backing, at para sa paglalaro gamit ang sariling pera. Sa ibaba — kung ano ang makukuha mo sa pagtatrabaho sa aming mga deal.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Ang aming mga deal — bukas para sa lahat</h2>
        <p class="text-neutral-300 mb-6">
          Ang mga kondisyon ng PokerDealsHub ay hindi nangangailangan ng backing — magagamit ang mga ito habang naglalaro gamit ang sariling pera. Makukuha mo ang access sa mga deal na karaniwang para lang sa mga internal na partner ng mga club:
        </p>
        <ul class="space-y-3 text-neutral-300 mb-6">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Pinakamahuhusay na club at union na may soft field</strong> — kung saan talagang kaya mong talunin ang field, sa halip na makipaglaban sa mga regular.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Mataas na fixed na rakeback — hanggang 70%</strong> — dagdag na kita bukod sa resulta sa mesa, mula sa unang araw.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Garantiya sa payout</strong> — maliban sa mga kaso kung saan napatunayang gumamit ng bot o teamplay.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Beripikadong club at malinaw na kondisyon</strong> — malinaw na rakeback, mabilis na payout, suporta 24/7.</span>
          </li>
        </ul>
        <div class="flex justify-center">
          <a href="/fil/deals/" class="flex items-center justify-center gap-2 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
            Tingnan ang catalog ng mga deal
          </a>
        </div>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Backing: maglaro nang mas mataas sa iyong bankroll</h2>
        <p class="text-neutral-300 mb-4">
          Kung gusto mong maglaro nang mas mataas, pero kulang pa ang iyong sariling pondo — maaari ka naming kunin sa aming poker stable. Sino ang hinahanap namin:
        </p>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Mga winning player na gustong maglaro nang mas mataas kaysa pinapayagan ng bankroll.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Mga disiplinadong regular na handang maglaro sa volume at mahigpit na sumusunod sa mga patakaran ng platform.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Mga makakapagpatunay ng kanilang husay — sa pamamagitan ng history ng winrate sa iba't ibang club.</span>
          </li>
        </ul>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Mga kondisyon ng pakikipagtulungan</h3>
        <p class="text-neutral-300 mb-4">
          Kami ang nagbibigay ng bankroll para sa laro. Naglalaro ka <strong>na may makeup</strong>: ang iyong bahagi mula sa kita ay ikakalkula pagkatapos mabawi ang minus, kung mayroon man. Walang pamumuhunan ng sariling pera sa laro — ang oras at galing mo lang.
        </p>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Paano ginagawa ang mga payout</h3>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Nagbabayad sa amin ang mga club para sa naglaro na linggo, kadalasan tuwing Lunes–Martes ng sumunod na linggo.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Ang bahagi ng player para sa linggong iyon ay hinahawakan pa namin nang isa pang linggo pagkatapos ng settlement — ibig sabihin, ang payout ay may shift na <strong>+1 linggo</strong> mula sa araw ng settlement.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Bakit ito kailangan: kung ang isang kumikitang linggo ay susundan ng lugi na linggo, ang hinawakang bahagi ay sumasaklaw sa bahagi ng downswing. Sa ganitong paraan binabawasan namin ang paglaki ng makeup na utang, at kapwa panig ay nananatili sa matatag na posisyon.</span>
          </li>
        </ul>
      </div>

      <div class="bg-gold/10 border border-gold/30 rounded-xl p-8 text-center">
