  tr:
    title: Pokerde backing — staking ve oyuncu finansmanı
    description: >-
      PokerDealsHub'tan poker backing, staking ve oyuncu finansmanı (poker ahırı / stable): makeup ile bankroll'unuzun
      üstünde oynayın. Sunduğumuz deal'ler ise — soft field'e sahip top kulüpler, yüksek rakeback ve ödeme garantisi —
      backing olmadan bile herkese açık.
    body: |-
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>Backing (staking)</strong> — oyuncunun finanse edilmesidir: oyun için parayı backer verir, poker oyuncusu oynar ve karı paylaşır. Backing altındaki oyuncu havuzuna <strong>poker ahırı</strong> (stable) denir. Ahırımıza, bankroll'unun izin verdiğinden daha yüksek limitlerde oynamaya hazır yetenekli oyuncuları alıyoruz — <strong>oyun için parayı biz veriyoruz, siz makeup ile oynuyorsunuz</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          Ama asıl önemli olan — soft field'e, yüksek rakeback'e ve ödeme garantisine sahip en iyi poker kulüplerine erişimi <strong>herkese</strong> açıyoruz: hem backing kapsamında, hem de kendi paranızla oynamak için. Aşağıda — deal'lerimizle çalışarak neler kazandığınızı bulacaksınız.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Deal'lerimiz — herkese açık</h2>
        <p class="text-neutral-300 mb-6">
          PokerDealsHub koşulları backing gerektirmez — bunları kendi paranızla oynayarak da kullanabilirsiniz. Genellikle yalnızca kulüplerin iç ortaklarına açık olan deal'lere erişim elde edersiniz:
        </p>
        <ul class="space-y-3 text-neutral-300 mb-6">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Soft field'e sahip en iyi kulüpler ve union'lar</strong> — regular'larla boğuşmak yerine, sahayı gerçekten yenebileceğiniz yerler.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Yüksek sabit rakeback — %70'e kadar</strong> — masadaki sonucunuzun üzerine, ilk günden itibaren ek kar.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Ödeme garantileri</strong> — bot veya team play kullanımının kanıtlandığı durumlar hariç.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Doğrulanmış kulüpler ve şeffaf koşullar</strong> — anlaşılır rakeback, hızlı ödemeler, 7/24 destek.</span>
          </li>
        </ul>
        <div class="flex justify-center">
          <a href="/tr/deals/" class="flex items-center justify-center gap-2 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
            Deal kataloğunu gör
          </a>
        </div>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Backing: bankroll'unun üstünde oyna</h2>
        <p class="text-neutral-300 mb-4">
          Daha yüksekte oynamak istiyorsanız ama kendi paranız henüz yeterli değilse — sizi poker ahırımıza (stable) alabiliriz. Kimleri arıyoruz:
        </p>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Bankroll'unun izin verdiğinden daha yüksekte oynamak isteyen artıda oyuncular.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Hacme göre ve platformların kurallarına harfiyen uyarak oynamaya hazır disiplinli regular'lar.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Yetkinliğini kanıtlayabilenler — farklı kulüplerdeki winrate geçmişiyle.</span>
          </li>
        </ul>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">İş birliği koşulları</h3>
        <p class="text-neutral-300 mb-4">
          Oyun için bankroll'u biz sağlıyoruz. Siz <strong>makeup ile</strong> (makeup) oynuyorsunuz: kardan payınız, varsa eksinin kapatılmasından sonra tahakkuk eder. Oyuna kendi paranızı yatırmanız gerekmez — yalnızca zamanınız ve beceriniz.
        </p>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Ödemeler nasıl yapılır</h3>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Kulüpler oynanan hafta için bizimle, genellikle bir sonraki haftanın pazartesi–salı günleri hesaplaşır.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Oyuncunun o haftaki payını, hesaplaşmadan sonra bir hafta daha elimizde tutuyoruz — yani ödeme, hesaplaşma gününden <strong>+1 hafta</strong> kaymayla yapılır.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Bu neden gerekli: karlı bir haftayı zararlı bir hafta izlerse, tutulan pay düşüşün bir kısmını karşılar. Böylece makeup borcunun büyümesini azaltıyoruz ve her iki taraf da sağlam bir konumda kalıyor.</span>
          </li>
        </ul>
      </div>

      <div class="bg-gold/10 border border-gold/30 rounded-xl p-8 text-center">
        <h2 class="text-2xl font-semibold text-gold mb-3">Daha yüksekte oynamaya hazır mısınız?</h2>
        <p class="text-neutral-300 text-lg mb-2">
          Bize Telegram'dan yazın ve <strong>farklı kulüplerdeki winrate geçmişinizi</strong> gönderin — böylece oyununuzu değerlendirip size uygun backing koşullarını belirleriz. Her adaya kişisel olarak yanıt veriyoruz.
        </p>
        <p class="text-neutral-400 mb-6">
          Backing gerekmiyorsa — sadece <a href="/tr/deals/">katalogdan bir deal seçin</a> ve kendi paranızla en iyi koşullarda oynayın.
        </p>
        <div class="flex justify-center">
          <a href="https://t.me/pdh_support_bot" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-3 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.693-1.653-1.124-2.678-1.8-1.185-.781-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.244-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.001.321.023.465.141.121.099.155.232.171.326.016.093.036.306.02.472z"/></svg>
            Telegram'dan yaz
          </a>
        </div>
      </div>
