  he:
    title: בקינג בפוקר — סטייקינג ומימון שחקנים
    description: >-
      בקינג, סטייקינג ומימון שחקני פוקר (אורוות פוקר / stable) מ-PokerDealsHub: שחקו מעל הבנקרול שלכם עם מייקאפ.
      והעסקאות שלנו — מועדונים מובילים עם שדה רך, רייקבק גבוה וערבות לתשלומים — זמינות לכל אחד, גם בלי בקינג.
    body: |-
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>בקינג (סטייקינג)</strong> — זהו מימון של שחקן: הבקר נותן כסף למשחק, שחקן הפוקר משחק ומחלק את הרווח. מאגר השחקנים תחת בקינג נקרא <strong>אורוות פוקר</strong> (stable). אנחנו מקבלים לאורווה שחקנים מוכשרים שמוכנים לשחק בלימיטים גבוהים ממה שהבנקרול שלהם מאפשר, — <strong>את הכסף למשחק נותנים אנחנו, אתם משחקים עם מייקאפ</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          אבל העיקר — את הגישה למועדוני הפוקר הטובים ביותר עם שדה רך, רייקבק גבוה וערבות לתשלומים אנחנו פותחים <strong>לכל אחד</strong>: גם במסגרת בקינג, וגם למשחק על הכסף שלכם. למטה — מה אתם מקבלים כשאתם עובדים עם העסקאות שלנו.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">העסקאות שלנו — זמינות לכל אחד</h2>
        <p class="text-neutral-300 mb-6">
          התנאים של PokerDealsHub לא דורשים בקינג — אפשר להשתמש בהם גם כשמשחקים על הכסף שלכם. אתם מקבלים גישה לעסקאות שבדרך כלל זמינות רק לשותפים פנימיים של המועדונים:
        </p>
        <ul class="space-y-3 text-neutral-300 mb-6">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>המועדונים והאיגודים הטובים ביותר עם שדה רך</strong> — שם באמת אפשר להכות את השדה, ולא להיאבק ברגולרים.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>רייקבק קבוע גבוה — עד 70%</strong> — רווח נוסף מעבר לתוצאה בשולחן, כבר מהיום הראשון.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>ערבות לתשלומים</strong> — למעט מקרים שבהם הוכח שימוש בבוטים או במשחק צוותי.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>מועדונים מאומתים ותנאים שקופים</strong> — רייקבק ברור, תשלומים מהירים, תמיכה 24/7.</span>
          </li>
        </ul>
        <div class="flex justify-center">
          <a href="/he/deals/" class="flex items-center justify-center gap-2 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
            לצפייה בקטלוג העסקאות
          </a>
        </div>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">בקינג: שחקו גבוה מהבנקרול שלכם</h2>
        <p class="text-neutral-300 mb-4">
          אם אתם רוצים לשחק גבוה יותר, אבל האמצעים שלכם עדיין לא מספיקים, — אנחנו יכולים לקבל אתכם לאורוות הפוקר שלנו (stable). את מי אנחנו מחפשים:
        </p>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>שחקנים מנצחים, שרוצים לשחק גבוה יותר ממה שהבנקרול מאפשר.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>רגולרים ממושמעים, שמוכנים לשחק בנפח ובהתאם מלא לחוקי הפלטפורמות.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>מי שיכול להוכיח מיומנות — עם היסטוריית וינרייט במועדונים שונים.</span>
          </li>
        </ul>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">תנאי שיתוף הפעולה</h3>
        <p class="text-neutral-300 mb-4">
          את הבנקרול למשחק מספקים אנחנו. אתם משחקים <strong>עם מייקאפ</strong> (makeup): החלק שלכם מהרווח נצבר לאחר שכוסה המינוס, אם היה. בלי שום השקעה של כספכם במשחק — רק הזמן והמיומנות שלכם.
        </p>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">איך מתבצעים התשלומים</h3>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>המועדונים מתחשבנים איתנו על השבוע ששוחק, בדרך כלל ביום שני–שלישי של השבוע שאחריו.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>את חלקו של השחקן על השבוע הזה אנחנו מחזיקים עוד שבוע לאחר ההתחשבנות — כלומר התשלום יוצא בהיסט של <strong>+1 שבוע</strong> מיום ההתחשבנות.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>למה זה נחוץ: אם אחרי שבוע רווחי מגיע שבוע מפסיד, החלק שהוחזק מכסה חלק מהירידה. כך אנחנו מצמצמים את הצטברות חוב המייקאפ, ושני הצדדים נשארים במצב יציב.</span>
          </li>
        </ul>
      </div>

      <div class="bg-gold/10 border border-gold/30 rounded-xl p-8 text-center">
        <h2 class="text-2xl font-semibold text-gold mb-3">מוכנים לשחק גבוה יותר?</h2>
