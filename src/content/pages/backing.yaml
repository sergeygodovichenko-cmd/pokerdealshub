  en:
    title: Poker Backing — Staking and Player Financing
    description: >-
      Backing, staking and poker player financing (a poker stable) from PokerDealsHub: play above your bankroll with
      makeup. And our deals — top clubs with soft games, high rakeback and payout guarantees — are open to everyone,
      even without backing.
    body: |-
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>Backing (staking)</strong> is financing a player: the backer puts up the money, the player plays and shares the profit. A pool of players under backing is called a <strong>poker stable</strong>. We take talented players into our stable who are ready to play stakes higher than their bankroll allows — <strong>we put up the money, you play with makeup</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          But most importantly — access to the best poker clubs with soft games, high rakeback and payout guarantees is open to <strong>everyone</strong>: both under backing and for playing on your own money. Below is what you get by working with our deals.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Our deals — open to everyone</h2>
        <p class="text-neutral-300 mb-6">
          PokerDealsHub terms require no backing — you can use them while playing on your own money. You get access to deals that are usually available only to clubs' inner partners:
        </p>
        <ul class="space-y-3 text-neutral-300 mb-6">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>The best clubs and unions with soft games</strong> — where you can genuinely beat the field instead of grinding against regulars.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>High fixed rakeback — up to 70%</strong> — extra profit on top of your results at the table, from day one.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Payout guarantees</strong> — except in cases where the use of bots or team play has been proven.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Vetted clubs and transparent terms</strong> — clear rakeback, fast payouts, 24/7 support.</span>
          </li>
        </ul>
        <div class="flex justify-center">
          <a href="/en/deals/" class="flex items-center justify-center gap-2 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
            Browse the deals catalog
          </a>
        </div>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Backing: play above your bankroll</h2>
        <p class="text-neutral-300 mb-4">
          If you want to play higher but don't yet have the funds, we can take you into our poker stable. Who we're looking for:
        </p>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Winning players who want to play higher than their bankroll allows.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Disciplined regulars ready to put in volume and follow each platform's rules strictly.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Those who can prove their competence — with a history of winrates across different clubs.</span>
          </li>
        </ul>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Terms of cooperation</h3>
        <p class="text-neutral-300 mb-4">
          We provide the bankroll for play. You play <strong>with makeup</strong>: your share of the profit is credited after any minus has been cleared, if there was one. No investment of your own money into the game — only your time and skill.
        </p>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">How payouts work</h3>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Clubs settle with us for the week played, usually on Monday–Tuesday of the following week.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>We hold the player's share for that week for one more week after settlement — meaning the payout goes out with a <strong>+1 week</strong> shift from the settlement day.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Why this matters: if a profitable week is followed by a losing one, the withheld share covers part of the downswing. This keeps makeup debt from growing and leaves both sides in a stable position.</span>
          </li>
        </ul>
      </div>

      <div class="bg-gold/10 border border-gold/30 rounded-xl p-8 text-center">
        <h2 class="text-2xl font-semibold text-gold mb-3">Ready to play higher?</h2>
        <p class="text-neutral-300 text-lg mb-2">
          Message us on Telegram and send your <strong>history of winrates across different clubs</strong> — that's how we'll assess your game and tailor your backing terms. We reply to every candidate personally.
        </p>
        <p class="text-neutral-400 mb-6">
          And if you don't need backing — just <a href="/en/deals/">pick a deal from the catalog</a> and play on your own money on the best terms.
        </p>
        <div class="flex justify-center">
          <a href="https://t.me/pdh_support_bot" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-3 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.693-1.653-1.124-2.678-1.8-1.185-.781-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.244-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.001.321.023.465.141.121.099.155.232.171.326.016.093.036.306.02.472z"/></svg>
            Message us on Telegram
          </a>
        </div>
      </div>
