  en:
    title: Poker Backing — Staking and Player Financing
    description: >-
      Poker backing, staking and player financing (a poker stable) from PokerDealsHub: play above your bankroll with
      makeup. And our deals — top clubs with soft games, high rakeback and payout guarantees — are open to everyone,
      even without backing.
    body: |-
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>Backing (staking)</strong> is financing a player: the backer puts up the money to play, the player plays and splits the profit. A pool of backed players is called a <strong>poker stable</strong>. We take talented players into our stable who are ready to play at limits higher than their bankroll allows — <strong>we put up the money to play, you play with makeup</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          But the main point — access to the best poker clubs with soft games, high rakeback and payout guarantees is something we open up to <strong>everyone</strong>: both through backing and for playing on your own money. Below is what you get by working with our deals.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Our deals — open to everyone</h2>
        <p class="text-neutral-300 mb-6">
          PokerDealsHub terms don't require backing — you can use them while playing on your own money. You get access to deals that are usually available only to clubs' inner-circle partners:
        </p>
        <ul class="space-y-3 text-neutral-300 mb-6">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>The best clubs and unions with soft games</strong> — where you can actually beat the field instead of grinding against regulars.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>High fixed rakeback — up to 70%</strong> — extra profit on top of your results at the table, from day one.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Payout guarantees</strong> — except in cases where the use of bots or team play has been proven.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Vetted clubs and transparent terms</strong> — clear rakeback, fast payouts, 24/7 support.</span>
          </li>
        </ul>
        <div class="flex justify-center">
          <a href="/en/deals/" class="flex items-center justify-center gap-2 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
            View deals catalog
          </a>
        </div>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Backing: play above your bankroll</h2>
        <p class="text-neutral-300 mb-4">
          If you want to play higher but don't have enough of your own funds yet — we can take you into our poker stable. Who we're looking for:
        </p>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Winning players who want to play higher than their bankroll allows.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Disciplined regulars ready to put in volume and strictly follow each platform's rules.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Those who can prove their competence — with a track record of winrates across different clubs.</span>
          </li>
        </ul>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Terms of cooperation</h3>
        <p class="text-neutral-300 mb-4">
          We provide the bankroll to play. You play <strong>with makeup</strong>: your share of the profit is credited after the losses are recouped, if there were any. No investing your own money in the game — just your time and skill.
        </p>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">How payouts work</h3>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Clubs settle up with us for the week played, usually on the Monday–Tuesday of the following week.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>We hold the player's share for that week one more week after settlement — meaning the payout goes out with a <strong>+1 week</strong> shift from settlement day.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Why this matters: if a profitable week is followed by a losing one, the held share covers part of the downswing. That way we slow the growth of makeup debt, and both sides stay in a stable position.</span>
          </li>
        </ul>
      </div>

      <div class="bg-gold/10 border border-gold/30 rounded-xl p-8 text-center">
          <h2 class="text-2xl font-semibold text-gold mb-3">Ready to play higher?</h2>
          <p class="text-neutral-300 text-lg mb-2">
            Email us and send over your <strong>track record of winrates across different clubs</strong> — that's how we'll assess your game and put together backing terms. We reply to every candidate personally.
          </p>
          <p class="text-neutral-400 mb-6">
            And if you don't need backing — just <a href="/en/deals/">pick a deal from the catalog</a> and play on the best terms with your own money.
          </p>
          <div class="flex justify-center">
            <a href="mailto:pokerdealshub@gmail.com" class="flex items-center justify-center gap-3 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
              pokerdealshub@gmail.com
            </a>
          </div>
        </div>
