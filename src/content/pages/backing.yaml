  vi:
    title: Backing trong poker — staking và tài trợ người chơi
    description: >-
      Backing, staking và tài trợ người chơi poker (lò poker / stable) từ PokerDealsHub: chơi trên mức bankroll của bạn
      với makeup. Còn các deal của chúng tôi — club hàng đầu với soft field, rakeback cao và bảo đảm chi trả — dành cho
      mọi người, kể cả khi không cần backing.
    body: |-
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>Backing (staking)</strong> — là hình thức tài trợ người chơi: backer bỏ tiền cho ván chơi, người chơi poker thi đấu và chia lợi nhuận. Nhóm người chơi được backing gọi là <strong>lò poker</strong> (stable). Chúng tôi nhận vào lò những người chơi tài năng, sẵn sàng chơi ở các mức cao hơn khả năng bankroll của họ — <strong>tiền chơi do chúng tôi cấp, bạn chơi với makeup</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          Nhưng quan trọng nhất — quyền tiếp cận những club poker tốt nhất với soft field, rakeback cao và bảo đảm chi trả thì chúng tôi mở ra cho <strong>tất cả mọi người</strong>: cả khi backing, lẫn khi chơi bằng tiền của bạn. Dưới đây là những gì bạn nhận được khi làm việc với các deal của chúng tôi.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Các deal của chúng tôi — dành cho mọi người</h2>
        <p class="text-neutral-300 mb-6">
          Điều kiện của PokerDealsHub không đòi hỏi backing — bạn có thể dùng chúng khi chơi bằng tiền của mình. Bạn được tiếp cận những deal mà thường chỉ dành cho đối tác nội bộ của các club:
        </p>
        <ul class="space-y-3 text-neutral-300 mb-6">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Những club và union tốt nhất với soft field</strong> — nơi bạn thực sự đánh bại được field, thay vì phải vật lộn với dân reg.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Rakeback cố định cao — lên tới 70%</strong> — thêm lợi nhuận ngoài kết quả tại bàn, ngay từ ngày đầu.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Bảo đảm chi trả</strong> — trừ những trường hợp có bằng chứng sử dụng bot hoặc chơi tổ đội (teamplay).</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Club đã được kiểm chứng và điều kiện minh bạch</strong> — rakeback rõ ràng, chi trả nhanh, hỗ trợ 24/7.</span>
          </li>
        </ul>
        <div class="flex justify-center">
          <a href="/vi/deals/" class="flex items-center justify-center gap-2 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
            Xem danh mục deal
          </a>
        </div>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Backing: chơi trên mức bankroll của bạn</h2>
        <p class="text-neutral-300 mb-4">
          Nếu bạn muốn chơi ở mức cao hơn nhưng tiền của mình chưa đủ — chúng tôi có thể nhận bạn vào lò poker (stable) của mình. Chúng tôi tìm kiếm ai:
        </p>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Người chơi có lãi, muốn chơi ở mức cao hơn khả năng bankroll cho phép.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Dân reg kỷ luật, sẵn sàng chơi theo khối lượng và tuân thủ nghiêm ngặt luật của các nền tảng.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Người có thể chứng minh năng lực — bằng lịch sử winrate ở nhiều club khác nhau.</span>
          </li>
        </ul>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Điều kiện hợp tác</h3>
        <p class="text-neutral-300 mb-4">
          Bankroll để chơi do chúng tôi cấp. Bạn chơi <strong>với makeup</strong> (makeup): phần lợi nhuận của bạn được tính sau khi đã bù xong khoản lỗ, nếu có. Không cần bỏ tiền của bản thân vào ván chơi — chỉ cần thời gian và kỹ năng của bạn.
        </p>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Việc chi trả diễn ra thế nào</h3>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Các club thanh toán cho chúng tôi theo tuần đã chơi, thường là vào thứ Hai–thứ Ba của tuần kế tiếp.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Phần của người chơi trong tuần đó chúng tôi giữ lại thêm một tuần nữa sau khi thanh toán — nghĩa là việc chi trả diễn ra với độ trễ <strong>+1 tuần</strong> so với ngày thanh toán.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Vì sao cần vậy: nếu một tuần có lãi bị nối tiếp bởi một tuần thua lỗ, phần giữ lại sẽ bù đắp một phần khoản sụt giảm. Nhờ đó chúng tôi hạn chế sự gia tăng của nợ makeup, và cả hai bên đều giữ được vị thế ổn định.</span>
          </li>
        </ul>
      </div>

      <div class="bg-gold/10 border border-gold/30 rounded-xl p-8 text-center">
        <h2 class="text-2xl font-semibold text-gold mb-3">Sẵn sàng chơi ở mức cao hơn?</h2>
        <p class="text-neutral-300 text-lg mb-2">
          Hãy nhắn cho chúng tôi qua Telegram và gửi <strong>lịch sử winrate ở nhiều club khác nhau</strong> — để chúng tôi đánh giá lối chơi của bạn và đề xuất điều kiện backing. Chúng tôi trả lời trực tiếp từng ứng viên.
        </p>
        <p class="text-neutral-400 mb-6">
          Còn nếu không cần backing — chỉ cần <a href="/vi/deals/">chọn một deal trong danh mục</a> và chơi với điều kiện tốt nhất bằng tiền của bạn.
        </p>
        <div class="flex justify-center">
          <a href="https://t.me/pdh_support_bot" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-3 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
