          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>نحتفظ بحصّة اللاعب عن هذا الأسبوع لمدة أسبوع إضافي بعد التسوية — أي أن الدفعة تتم بإزاحة <strong>+1 أسبوع</strong> عن يوم التسوية.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>لماذا هذا مهم: إذا أعقب أسبوعًا رابحًا أسبوعٌ خاسر، فإن الحصّة المحتجزة تغطّي جزءًا من التراجع. بهذا نقلّل من تراكم ديون الميك أب، ويبقى الطرفان في وضع مستقر.</span>
