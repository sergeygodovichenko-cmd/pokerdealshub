        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>Backing (Staking)</strong> — das ist die Finanzierung eines Spielers: Der Backer stellt das Geld fürs Spiel, der Pokerspieler spielt und teilt den Gewinn. Den Pool an Spielern unter Backing nennt man <strong>Poker-Stable</strong>. Wir nehmen talentierte Spieler in unsere Stable auf, die bereit sind, auf höheren Limits zu spielen, als es ihre Bankroll erlaubt — <strong>das Spielgeld stellen wir, du spielst mit Makeup</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          Doch das Wichtigste: Den Zugang zu den besten Poker-Clubs mit soft field, hohem Rakeback und Auszahlungsgarantie öffnen wir <strong>jedem</strong> — sowohl im Rahmen des Backings als auch fürs Spiel mit eigenem Geld. Nachfolgend, was du bekommst, wenn du mit unseren Deals arbeitest.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Unsere Deals — für jeden zugänglich</h2>
        <p class="text-neutral-300 mb-6">
          Die Konditionen von PokerDealsHub setzen kein Backing voraus — du kannst sie auch nutzen, wenn du mit eigenem Geld spielst. Du erhältst Zugang zu Deals, die normalerweise nur den internen Partnern der Clubs offenstehen:
