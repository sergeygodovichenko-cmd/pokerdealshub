            Hãy gửi e-mail cho chúng tôi kèm theo <strong>lịch sử winrate ở các club khác nhau</strong> — để chúng tôi đánh giá lối chơi của bạn và đề xuất điều kiện backing phù hợp. Chúng tôi trả lời trực tiếp cho từng ứng viên.
