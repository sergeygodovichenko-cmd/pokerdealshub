      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Backing: Spiele über deinem Bankroll</h2>
        <p class="text-neutral-300 mb-4">
          Wenn du höher spielen möchtest, dein eigenes Kapital dafür aber noch nicht ausreicht — können wir dich in unsere Poker-Stable (Stall) aufnehmen. Wen wir suchen:
        </p>
        <ul class="space-y-3 text-neutral-300">
