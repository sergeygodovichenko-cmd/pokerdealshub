  uz:
    title: Pokerda beking — steyking va o'yinchilarni moliyalashtirish
    description: >-
      PokerDealsHub'dan beking, steyking va pokerchilarni moliyalashtirish (poker otxonasi / stable): meykap bilan o'z
      bankrollingizdan yuqori limitlarda o'ynang. Bizning dillar esa — yumshoq poляna, yuqori rakeback va to'lov
      kafolati bilan top klublar — hammaga ochiq, hatto bekingsiz ham.
    body: |-
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>Beking (steyking)</strong> — bu o'yinchini moliyalashtirish: o'yin uchun pulni beker beradi, pokerchi o'ynaydi va foydani bo'lishadi. Beking ostidagi o'yinchilar puliga <strong>poker otxonasi</strong> (stable) deyiladi. Biz otxonaga o'z bankrolli imkon berganidan yuqori limitlarda o'ynashga tayyor iqtidorli o'yinchilarni olamiz — <strong>o'yin uchun pulni biz beramiz, siz meykap bilan o'ynaysiz</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          Ammo eng muhimi — yumshoq poляna, yuqori rakeback va to'lov kafolati bilan eng yaxshi poker klublariga kirishni biz <strong>hammaga</strong> ochamiz: ham beking doirasida, ham o'z puliga o'ynash uchun. Quyida — bizning dillar bilan ishlab nima olishingiz bayon etilgan.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Bizning dillar — hammaga ochiq</h2>
        <p class="text-neutral-300 mb-6">
          PokerDealsHub shartlari bekingni talab qilmaydi — ulardan o'z puliga o'ynab ham foydalanish mumkin. Siz odatda faqat klublarning ichki hamkorlariga ochiq bo'lgan dillarga kirish olasiz:
        </p>
        <ul class="space-y-3 text-neutral-300 mb-6">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Yumshoq poляna bilan eng yaxshi klublar va uyushmalar</strong> — u yerda regulyarlar bilan kurashmasdan, maydonni haqiqatan yutish mumkin.</span>
          </li>
          <li class="flex items-start">
