      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>الباكينج (الستيكينج)</strong> هو تمويل اللاعب: يقدّم الباكر المال للعب، ويلعب لاعب البوكر ثم يتقاسمان الأرباح. ويُسمّى تجمّع اللاعبين تحت الباكينج <strong>إسطبل البوكر</strong> (stable). نحن نضمّ إلى الإسطبل لاعبين موهوبين مستعدين للعب على حدود أعلى مما يسمح به بنك رولهم — <strong>نحن نقدّم المال للعب، وأنت تلعب مع الميك أب</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          لكن الأهم — أننا نفتح الوصول إلى أفضل نوادي البوكر ذات البيئة الرخوة والريك باك المرتفع وضمان الدفع <strong>للجميع</strong>: سواء ضمن الباكينج أو للعب بأموالك الخاصة. فيما يلي ما تحصل عليه عند العمل مع صفقاتنا.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">صفقاتنا — متاحة للجميع</h2>
        <p class="text-neutral-300 mb-6">
          شروط PokerDealsHub لا تتطلب باكينج — يمكنك الاستفادة منها وأنت تلعب بأموالك الخاصة. تحصل على الوصول إلى صفقات عادةً ما تكون متاحة فقط للشركاء الداخليين في النوادي:
        </p>
        <ul class="space-y-3 text-neutral-300 mb-6">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>أفضل النوادي والاتحادات ذات البيئة الرخوة</strong> — حيث يمكنك فعليًا التغلّب على الطاولة بدلًا من مصارعة اللاعبين المحترفين.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>ريك باك ثابت مرتفع — حتى 70%</strong> — ربح إضافي فوق نتيجتك على الطاولة، منذ اليوم الأول.</span>
          </li>
