          </li>
        </ul>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">شروط التعاون</h3>
        <p class="text-neutral-300 mb-4">
          نحن من يوفّر بنك رول اللعب. أنت تلعب <strong>مع الميك أب</strong> (makeup): تُحتسب حصّتك من الأرباح بعد تعويض الخسارة، إن وُجدت. لا حاجة لاستثمار أي من أموالك الخاصة في اللعب — فقط وقتك ومهارتك.
