  fil:
    title: Backing sa poker — staking at financing ng mga manlalaro
    description: >-
      Backing, staking at financing ng mga poker player (poker stable) mula sa PokerDealsHub: maglaro nang mas mataas sa
      iyong bankroll gamit ang makeup. At ang aming mga deal — top club na may soft field, mataas na rakeback at
      garantiya ng bayad — ay bukas sa lahat, kahit walang backing.
    body: |-
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>Ang backing (staking)</strong> ay ang financing ng isang manlalaro: ang backer ang nagbibigay ng pera para sa laro, ang poker player ang naglalaro at hinahati ang kita. Ang pool ng mga manlalarong nasa ilalim ng backing ay tinatawag na <strong>poker stable</strong>. Kinukuha namin sa stable ang mga mahuhusay na manlalaro na handang maglaro sa mas mataas na limits kaysa sa kaya ng kanilang bankroll — <strong>kami ang nagbibigay ng pera para sa laro, ikaw ang naglalaro nang may makeup</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          Pero ang pinakamahalaga — ang access sa pinakamagagandang poker club na may soft field, mataas na rakeback at garantiya ng bayad ay binubuksan namin para sa <strong>lahat</strong>: parehong sa loob ng backing at para sa paglalaro gamit ang sariling pera. Sa ibaba — kung ano ang makukuha mo kapag ginamit mo ang aming mga deal.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Ang aming mga deal — bukas sa lahat</h2>
        <p class="text-neutral-300 mb-6">
          Ang mga kondisyon ng PokerDealsHub ay hindi nangangailangan ng backing — magagamit ang mga ito kahit naglalaro ka gamit ang sariling pera. Makukuha mo ang access sa mga deal na kadalasang bukas lamang sa mga internal na partner ng mga club:
        </p>
        <ul class="space-y-3 text-neutral-300 mb-6">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Pinakamagagandang club at union na may soft field</strong> — kung saan talagang kaya mong talunin ang field, sa halip na makipaglaban sa mga regular.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Mataas na fixed na rakeback — hanggang 70%</strong> — dagdag na kita bukod pa sa resulta sa mesa, mula sa unang araw.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Garantiya ng bayad</strong> — maliban sa mga kaso kung saan napatunayang gumamit ng bot o teamplay.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Napatunayang club at malinaw na kondisyon</strong> — malinaw na rakeback, mabibilis na bayad, 24/7 na suporta.</span>
          </li>
        </ul>
        <div class="flex justify-center">
          <a href="/fil/deals/" class="flex items-center justify-center gap-2 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
            Tingnan ang catalog ng mga deal
          </a>
        </div>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Backing: maglaro nang mas mataas sa iyong bankroll</h2>
        <p class="text-neutral-300 mb-4">
          Kung gusto mong maglaro nang mas mataas pero kulang pa ang sarili mong pera — puwede ka naming kunin sa aming poker stable. Sino ang hinahanap namin:
        </p>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Mga winning na manlalaro na gustong maglaro nang mas mataas kaysa sa kaya ng bankroll.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Mga disiplinadong regular na handang maglaro nang malaking volume at mahigpit na sumusunod sa mga patakaran ng mga platform.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Mga makapagpapatunay ng kanilang kakayahan — sa pamamagitan ng history ng winrate sa iba't ibang club.</span>
          </li>
        </ul>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Mga kondisyon ng kooperasyon</h3>
        <p class="text-neutral-300 mb-4">
          Kami ang nagbibigay ng bankroll para sa laro. Naglalaro ka nang <strong>may makeup</strong>: ang iyong parte sa kita ay ibinibigay pagkatapos mabawi ang minus, kung mayroon man. Walang anumang paglalagay ng sarili mong pera sa laro — ang oras at galing mo lang.
        </p>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Paano ginagawa ang mga bayad</h3>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Ang mga club ay nakikipag-ayos sa amin para sa naglaro na linggo, kadalasan tuwing Lunes–Martes ng susunod na linggo.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Ang parte ng manlalaro para sa linggong iyon ay hinahawakan pa namin ng isang linggo pagkatapos ng ayusan — ibig sabihin ang bayad ay may pagkaantala na <strong>+1 linggo</strong> mula sa araw ng ayusan.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Bakit ito kailangan: kung ang isang kumikitang linggo ay sundan ng luging linggo, ang hinawakang parte ay tumatakip sa bahagi ng downswing. Sa ganitong paraan binabawasan namin ang paglaki ng makeup na utang, at ang dalawang panig ay nananatili sa matatag na posisyon.</span>
          </li>
        </ul>
      </div>

      <div class="bg-gold/10 border border-gold/30 rounded-xl p-8 text-center">
          <h2 class="text-2xl font-semibold text-gold mb-3">Handa nang maglaro nang mas mataas?</h2>
          <p class="text-neutral-300 text-lg mb-2">
            Sumulat sa amin sa e-mail at ipadala ang <strong>history ng winrate sa iba't ibang club</strong> — sa gayon masusuri namin ang iyong laro at makakapili kami ng mga kondisyon ng backing. Sinasagot namin nang personal ang bawat kandidato.
          </p>
          <p class="text-neutral-400 mb-6">
            At kung hindi mo naman kailangan ng backing — <a href="/fil/deals/">pumili na lang ng deal sa catalog</a> at maglaro sa pinakamagandang kondisyon gamit ang sarili mong pera.
          </p>
          <div class="flex justify-center">
            <a href="mailto:pokerdealshub@gmail.com" class="flex items-center justify-center gap-3 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
              pokerdealshub@gmail.com
            </a>
          </div>
        </div>
