            <span>Các club thanh toán cho chúng tôi theo tuần đã chơi, thường vào thứ Hai–thứ Ba của tuần kế tiếp.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Phần chia của người chơi cho tuần đó chúng tôi giữ thêm một tuần nữa sau khi thanh toán — tức là khoản chi trả sẽ lệch <strong>+1 tuần</strong> so với ngày thanh toán.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Vì sao cần vậy: nếu một tuần có lãi bị nối tiếp bởi một tuần thua lỗ, phần được giữ lại sẽ bù đắp một phần của khoản sụt giảm. Nhờ đó chúng tôi giảm được đà tăng của nợ makeup, và cả hai bên đều giữ được vị thế vững vàng.</span>
          </li>
        </ul>
      </div>

      <div class="bg-gold/10 border border-gold/30 rounded-xl p-8 text-center">
          <h2 class="text-2xl font-semibold text-gold mb-3">Sẵn sàng chơi cao hơn?</h2>
