  id:
    title: Backing di poker — staking dan pendanaan pemain
    description: >-
      Backing, staking, dan pendanaan pemain poker (stable / kandang poker) dari PokerDealsHub: main di atas bankroll
      Anda dengan makeup. Dan deal kami — club top dengan meja soft, rakeback tinggi, dan jaminan pembayaran — terbuka
      untuk siapa saja, bahkan tanpa backing.
    body: |-
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>Backing (staking)</strong> — adalah pendanaan seorang pemain: modal main disediakan oleh backer, pemain poker bermain dan membagi keuntungan. Kumpulan pemain di bawah backing disebut <strong>stable (kandang poker)</strong>. Kami menerima pemain berbakat ke dalam stable, yang siap bermain di limit lebih tinggi daripada yang diizinkan bankroll mereka, — <strong>modal main kami yang sediakan, Anda bermain dengan makeup</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          Namun yang terpenting — akses ke club poker terbaik dengan meja soft, rakeback tinggi, dan jaminan pembayaran kami buka untuk <strong>siapa saja</strong>: baik dalam skema backing, maupun untuk bermain dengan modal sendiri. Di bawah ini — apa yang Anda dapatkan saat menggunakan deal kami.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Deal kami — terbuka untuk siapa saja</h2>
        <p class="text-neutral-300 mb-6">
          Syarat PokerDealsHub tidak mewajibkan backing — semuanya bisa Anda pakai sambil bermain dengan modal sendiri. Anda mendapatkan akses ke deal yang biasanya hanya tersedia bagi partner internal club:
        </p>
        <ul class="space-y-3 text-neutral-300 mb-6">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Club dan union terbaik dengan meja soft</strong> — tempat di mana Anda benar-benar bisa mengalahkan meja, bukan bertarung melawan regular.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Rakeback tetap yang tinggi — hingga 70%</strong> — keuntungan tambahan di atas hasil di meja, sejak hari pertama.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Jaminan pembayaran</strong> — kecuali dalam kasus yang terbukti menggunakan bot atau teamplay.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Club terverifikasi dan syarat yang transparan</strong> — rakeback yang jelas, pembayaran cepat, dukungan 24/7.</span>
          </li>
        </ul>
        <div class="flex justify-center">
          <a href="/id/deals/" class="flex items-center justify-center gap-2 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
            Lihat katalog deal
          </a>
        </div>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Backing: main di atas bankroll Anda</h2>
        <p class="text-neutral-300 mb-4">
          Jika Anda ingin bermain di limit lebih tinggi, tetapi modal sendiri belum cukup, — kami bisa menerima Anda ke dalam stable (kandang poker) kami. Siapa yang kami cari:
        </p>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Pemain plus yang ingin bermain di limit lebih tinggi daripada yang diizinkan bankroll.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Regular yang disiplin, siap bermain dengan volume dan patuh pada aturan platform.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Mereka yang bisa membuktikan kompetensi — dengan riwayat winrate di berbagai club.</span>
          </li>
        </ul>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Syarat kerja sama</h3>
        <p class="text-neutral-300 mb-4">
          Bankroll untuk bermain kami yang sediakan. Anda bermain <strong>dengan makeup</strong> (makeup): bagian keuntungan Anda dihitung setelah minus tertutup, jika sebelumnya ada minus. Tanpa perlu menanamkan modal sendiri ke dalam permainan — hanya waktu dan keahlian Anda.
        </p>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Bagaimana pembayaran berlangsung</h3>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Club membayar kami untuk satu minggu permainan, biasanya pada Senin–Selasa minggu berikutnya.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Bagian pemain untuk minggu tersebut kami tahan satu minggu lagi setelah penyelesaian — artinya pembayaran berjalan dengan pergeseran <strong>+1 minggu</strong> dari hari penyelesaian.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Untuk apa ini: jika minggu yang untung disusul minggu yang rugi, bagian yang ditahan menutupi sebagian downswing. Dengan begitu kami menekan pertumbuhan utang makeup, dan kedua pihak tetap berada di posisi yang stabil.</span>
          </li>
        </ul>
      </div>

      <div class="bg-gold/10 border border-gold/30 rounded-xl p-8 text-center">
        <h2 class="text-2xl font-semibold text-gold mb-3">Siap main di limit lebih tinggi?</h2>
        <p class="text-neutral-300 text-lg mb-2">
          Hubungi kami di Telegram dan kirimkan <strong>riwayat winrate di berbagai club</strong> — dengan begitu kami menilai permainan Anda dan menyesuaikan syarat backing. Kami membalas setiap kandidat secara pribadi.
