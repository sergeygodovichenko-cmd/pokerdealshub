        <p class="text-neutral-300 mb-4">
          Die Bankroll fürs Spiel stellen wir. Du spielst <strong>mit Makeup</strong>: Dein Gewinnanteil wird erst ausgeschüttet, nachdem ein etwaiges Minus aufgeholt ist. Keine eigenen Einlagen ins Spiel — nur deine Zeit und dein Können.
        </p>

