        <h2 class="text-2xl font-semibold text-gold mb-4">الباكينج: العب فوق حجم بنك رولك</h2>
        <p class="text-neutral-300 mb-4">
          إذا كنت تريد اللعب على حدود أعلى لكن أموالك الخاصة لا تكفي بعد — يمكننا ضمّك إلى إسطبل البوكر لدينا (stable). من نبحث عنه:
        </p>
        <ul class="space-y-3 text-neutral-300">
