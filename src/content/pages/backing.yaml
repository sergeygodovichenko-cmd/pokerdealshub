title: Бэкинг в покере — стейкинг и финансирование игроков
description: >-
  Бэкинг, стейкинг и финансирование покеристов (покерная конюшня / stable) от PokerDealsHub: играйте выше своего
  банкролла с мейкапом. А наши сделки — топ-клубы с мягкой поляной, высоким рейкбэком и гарантией выплат — доступны
  каждому, даже без бэкинга.
body: |-
  <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
    <p class="text-neutral-300 text-lg leading-relaxed mb-4">
      <strong>Бэкинг (стейкинг)</strong> — это финансирование игрока: деньги на игру даёт бэкер, покерист играет и делит прибыль. Пул игроков под бэкингом называют <strong>покерной конюшней</strong> (stable). Мы берём в конюшню талантливых игроков, готовых играть на лимитах выше, чем позволяет их банкролл, — <strong>деньги на игру даём мы, вы играете с мейкапом</strong>.
    </p>
    <p class="text-neutral-300 text-lg leading-relaxed">
      Но главное — доступ к лучшим покерным клубам с мягкой поляной, высоким рейкбэком и гарантией выплат мы открываем <strong>каждому</strong>: и в рамках бэкинга, и для игры на свои. Ниже — что вы получаете, работая с нашими сделками.
    </p>
  </div>

  <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
    <h2 class="text-2xl font-semibold text-gold mb-4">Наши сделки — доступны каждому</h2>
    <p class="text-neutral-300 mb-6">
      Условия PokerDealsHub не требуют бэкинга — ими можно пользоваться, играя на свои. Вы получаете доступ к сделкам, которые обычно доступны только внутренним партнёрам клубов:
    </p>
    <ul class="space-y-3 text-neutral-300 mb-6">
      <li class="flex items-start">
        <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span><strong>Лучшие клубы и союзы с мягкой поляной</strong> — там, где реально обыгрывать поле, а не бороться с регулярами.</span>
      </li>
      <li class="flex items-start">
        <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span><strong>Высокий фиксированный рейкбэк — до 70%</strong> — дополнительная прибыль поверх результата за столом, с первого дня.</span>
      </li>
      <li class="flex items-start">
        <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span><strong>Гарантии выплат</strong> — за исключением случаев, когда доказано использование ботов или тимплея.</span>
      </li>
      <li class="flex items-start">
        <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span><strong>Проверенные клубы и прозрачные условия</strong> — понятный рейкбэк, быстрые выплаты, поддержка 24/7.</span>
      </li>
    </ul>
    <div class="flex justify-center">
      <a href="/ru/deals/" class="flex items-center justify-center gap-2 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
        Смотреть каталог сделок
      </a>
    </div>
  </div>

  <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
    <h2 class="text-2xl font-semibold text-gold mb-4">Бэкинг: играй выше своего банкролла</h2>
    <p class="text-neutral-300 mb-4">
      Если вы хотите играть выше, но своих средств пока не хватает, — мы можем взять вас в нашу покерную конюшню (stable). Кого мы ищем:
    </p>
    <ul class="space-y-3 text-neutral-300">
      <li class="flex items-start">
        <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>Плюсовых игроков, которые хотят играть выше, чем позволяет банкролл.</span>
      </li>
      <li class="flex items-start">
        <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>Дисциплинированных регуляров, готовых играть по объёму и строго по правилам площадок.</span>
      </li>
      <li class="flex items-start">
        <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>Тех, кто может подтвердить компетентность — историей винрейтов в разных клубах.</span>
      </li>
    </ul>

    <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Условия сотрудничества</h3>
    <p class="text-neutral-300 mb-4">
      Банкролл на игру предоставляем мы. Вы играете <strong>с мейкапом</strong> (makeup): ваша доля от прибыли начисляется после того, как отбит минус, если он был. Никаких вложений собственных средств в игру — только ваше время и мастерство.
    </p>

    <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Как происходят выплаты</h3>
    <ul class="space-y-3 text-neutral-300">
      <li class="flex items-start">
        <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>Клубы рассчитываются с нами за отыгранную неделю, как правило, в понедельник–вторник следующей недели.</span>
      </li>
      <li class="flex items-start">
        <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>Долю игрока за эту неделю мы удерживаем ещё одну неделю после расчёта — то есть выплата идёт со сдвигом <strong>+1 неделя</strong> от расчётного дня.</span>
      </li>
      <li class="flex items-start">
        <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>Зачем это нужно: если прибыльную неделю сменяет убыточная, удержанная доля покрывает часть просадки. Так мы снижаем рост мейкап-задолженности, и обе стороны остаются в устойчивой позиции.</span>
      </li>
    </ul>
  </div>

  <div class="bg-gold/10 border border-gold/30 rounded-xl p-8 text-center">
      <h2 class="text-2xl font-semibold text-gold mb-3">Готовы играть выше?</h2>
      <p class="text-neutral-300 text-lg mb-2">
        Напишите нам на e-mail и пришлите <strong>историю винрейтов в разных клубах</strong> — так мы оценим вашу игру и подберём условия бэкинга. Отвечаем каждому кандидату лично.
      </p>
      <p class="text-neutral-400 mb-6">
        А если бэкинг не нужен — просто <a href="/ru/deals/">выберите сделку в каталоге</a> и играйте на лучших условиях на свои.
      </p>
      <div class="flex justify-center">
        <a href="mailto:pokerdealshub@gmail.com" class="flex items-center justify-center gap-3 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          pokerdealshub@gmail.com
        </a>
      </div>
    </div>
