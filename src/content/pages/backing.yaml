  id:
    title: Backing Poker — Staking dan Pendanaan Pemain
    description: >-
      Backing, staking, dan pendanaan pemain poker (stable / kandang poker) dari PokerDealsHub: main di atas bankroll
      kamu dengan sistem makeup. Dan deal kami — club top dengan meja soft, rakeback tinggi, dan garansi pembayaran —
      terbuka untuk semua orang, bahkan tanpa backing.
    body: |-
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <p class="text-neutral-300 text-lg leading-relaxed mb-4">
          <strong>Backing (staking)</strong> adalah pendanaan untuk pemain: modal main disediakan oleh backer, pemain poker bermain dan membagi keuntungan. Kumpulan pemain di bawah backing disebut <strong>stable (kandang poker)</strong>. Kami merekrut ke dalam stable pemain-pemain berbakat yang siap bermain di limit lebih tinggi daripada yang diizinkan bankroll mereka — <strong>modal main kami yang sediakan, kamu bermain dengan makeup</strong>.
        </p>
        <p class="text-neutral-300 text-lg leading-relaxed">
          Tapi yang terpenting — akses ke club poker terbaik dengan meja soft, rakeback tinggi, dan garansi pembayaran kami buka untuk <strong>semua orang</strong>: baik dalam kerangka backing, maupun untuk bermain dengan modal sendiri. Di bawah ini — apa yang kamu dapatkan saat bekerja sama dengan deal kami.
        </p>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Deal kami — terbuka untuk semua orang</h2>
        <p class="text-neutral-300 mb-6">
          Syarat PokerDealsHub tidak mengharuskan backing — kamu bisa memakainya sambil bermain dengan modal sendiri. Kamu mendapatkan akses ke deal yang biasanya hanya tersedia untuk mitra internal club:
        </p>
        <ul class="space-y-3 text-neutral-300 mb-6">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Club dan union terbaik dengan meja soft</strong> — tempat di mana kamu benar-benar bisa mengalahkan field, bukan bertarung melawan reguler.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Rakeback tetap yang tinggi — hingga 70%</strong> — keuntungan tambahan di atas hasil di meja, sejak hari pertama.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Garansi pembayaran</strong> — kecuali dalam kasus terbukti menggunakan bot atau teamplay.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span><strong>Club terpercaya dan syarat transparan</strong> — rakeback yang jelas, pembayaran cepat, dukungan 24/7.</span>
          </li>
        </ul>
        <div class="flex justify-center">
          <a href="/id/deals/" class="flex items-center justify-center gap-2 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
            Lihat katalog deal
          </a>
        </div>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
        <h2 class="text-2xl font-semibold text-gold mb-4">Backing: main di atas bankroll kamu</h2>
        <p class="text-neutral-300 mb-4">
          Kalau kamu ingin bermain di limit lebih tinggi, tapi modal sendiri belum cukup — kami bisa merekrut kamu ke dalam stable (kandang poker) kami. Siapa yang kami cari:
        </p>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Pemain plus (winning player) yang ingin bermain di limit lebih tinggi daripada yang diizinkan bankroll.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Reguler yang disiplin, siap bermain dengan volume dan mematuhi aturan platform secara ketat.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Mereka yang bisa membuktikan kompetensinya — dengan riwayat winrate di berbagai club.</span>
          </li>
        </ul>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Syarat kerja sama</h3>
        <p class="text-neutral-300 mb-4">
          Bankroll untuk bermain kami yang sediakan. Kamu bermain <strong>dengan makeup</strong> (makeup): bagianmu dari keuntungan dihitung setelah minus tertutupi, jika ada. Tanpa perlu menaruh modal sendiri untuk bermain — hanya waktu dan keahlianmu.
        </p>

        <h3 class="text-lg font-semibold text-neutral-100 mt-6 mb-2">Bagaimana pembayaran berlangsung</h3>
        <ul class="space-y-3 text-neutral-300">
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Club membayar kami untuk minggu yang telah dimainkan, biasanya pada hari Senin–Selasa minggu berikutnya.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Bagian pemain untuk minggu ini kami tahan satu minggu lagi setelah penghitungan — artinya pembayaran berjalan dengan pergeseran <strong>+1 minggu</strong> dari hari penghitungan.</span>
          </li>
          <li class="flex items-start">
            <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Kenapa ini perlu: kalau minggu untung diikuti minggu rugi, bagian yang ditahan menutupi sebagian downswing. Dengan begitu kami menekan pertumbuhan utang makeup, dan kedua belah pihak tetap berada di posisi yang stabil.</span>
          </li>
        </ul>
      </div>

      <div class="bg-gold/10 border border-gold/30 rounded-xl p-8 text-center">
          <h2 class="text-2xl font-semibold text-gold mb-3">Siap main di limit lebih tinggi?</h2>
          <p class="text-neutral-300 text-lg mb-2">
            Kirim e-mail ke kami dan lampirkan <strong>riwayat winrate di berbagai club</strong> — dengan begitu kami menilai permainanmu dan menyusun syarat backing yang tepat. Kami menjawab setiap kandidat secara langsung.
          </p>
          <p class="text-neutral-400 mb-6">
            Dan kalau backing tidak dibutuhkan — cukup <a href="/id/deals/">pilih deal di katalog</a> dan bermainlah dengan syarat terbaik memakai modal sendiri.
          </p>
          <div class="flex justify-center">
            <a href="mailto:pokerdealshub@gmail.com" class="flex items-center justify-center gap-3 px-8 py-4 bg-gold !text-neutral-900 rounded-xl font-bold text-lg hover:bg-gold-light transition-colors">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
              pokerdealshub@gmail.com
            </a>
          </div>
        </div>
