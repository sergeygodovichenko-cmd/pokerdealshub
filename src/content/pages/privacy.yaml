  fil:
    title: Patakaran sa Privacy
    description: "Patakaran sa privacy ng PokerDealsHub: paggamit ng data, cookies, at proteksyon ng impormasyon"
    body: |-
      <div class="prose prose-invert max-w-none">
              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <p class="text-neutral-300 mb-4">
                  Huling na-update: Oktubre 19, 2025
                </p>
                <p class="text-neutral-300">
                  Ang PokerDealsHub ("kami", "amin") ay nakatuon sa pagprotekta sa privacy ng mga bumibisita sa aming site. Inilalarawan ng patakarang ito kung paano namin kinokolekta, ginagamit, at pinoprotektahan ang iyong impormasyon.
                </p>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gold mb-4">1. Impormasyong kinokolekta namin</h2>
                <p class="text-neutral-300 mb-3">Maaari naming kolektahin ang mga sumusunod na uri ng impormasyon:</p>
                <ul class="list-disc ml-6 text-neutral-300 space-y-2">
                  <li>Impormasyong ibinibigay mo kapag nakikipag-ugnayan sa amin (pangalan, email, contact details)</li>
                  <li>Teknikal na data (IP address, uri ng browser, operating system)</li>
                  <li>Data ng interaksyon sa site (mga binisitang page, oras sa site)</li>
                  <li>Cookies at mga katulad na teknolohiya sa pagsubaybay</li>
                </ul>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gold mb-4">2. Paggamit ng impormasyon</h2>
                <p class="text-neutral-300 mb-3">Ginagamit namin ang nakolektang impormasyon upang:</p>
                <ul class="list-disc ml-6 text-neutral-300 space-y-2">
                  <li>Magbigay at mapabuti ang aming mga serbisyo</li>
                  <li>Makipag-ugnayan sa iyo tungkol sa mga usapin ng pakikipagtulungan</li>
                  <li>Suriin ang paggamit ng site at i-optimize ang functionality</li>
                  <li>Tiyakin ang seguridad ng site</li>
                </ul>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gold mb-4">3. Paggamit ng Cookies</h2>
                <p class="text-neutral-300 mb-3">
                  Gumagamit ang site ng cookies upang mapabuti ang paggana ng site, suriin ang traffic, at i-save ang iyong mga kagustuhan. Maaari mong pamahalaan ang cookies sa pamamagitan ng mga setting ng iyong browser. Ginagamit namin ang:
                </p>
                <ul class="list-disc ml-6 text-neutral-300 space-y-2">
                  <li>Analytical cookies para maunawaan ang gawi ng mga user</li>
                  <li>Functional cookies para i-save ang iyong mga kagustuhan (halimbawa, wika)</li>
                </ul>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gold mb-4">4. Paglilipat ng data sa mga third party</h2>
                <p class="text-neutral-300">
                  Hindi namin ibinebenta o inililipat ang iyong personal na impormasyon sa mga third party, maliban sa mga kaso kung saan ito ay kinakailangan para sa pagbibigay ng serbisyo (halimbawa, mga serbisyo ng analytics) o iniaatas ng batas.
                </p>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gold mb-4">5. Seguridad ng data</h2>
                <p class="text-neutral-300">
                  Nagsasagawa kami ng makatwirang mga hakbang upang protektahan ang iyong impormasyon mula sa hindi awtorisadong pag-access, pagbabago, pagsisiwalat, o pagkasira.
                </p>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gold mb-4">6. Ang iyong mga karapatan</h2>
                <p class="text-neutral-300 mb-3">May karapatan kang:</p>
                <ul class="list-disc ml-6 text-neutral-300 space-y-2">
                  <li>Humiling ng access sa iyong personal na impormasyon</li>
                  <li>Humiling ng pagwawasto ng hindi tumpak na impormasyon</li>
                  <li>Humiling ng pagtanggal ng iyong impormasyon</li>
                  <li>Bawiin ang pahintulot sa pagproseso ng data</li>
                </ul>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8">
                <h2 class="text-2xl font-semibold text-gold mb-4">7. Kontak</h2>
                <p class="text-neutral-300 mb-3">
                  Kung may mga tanong ka tungkol sa aming patakaran sa privacy, makipag-ugnayan sa amin:
                </p>
                <p class="text-neutral-300">
                  Email: <a href="mailto:pokerdealshub@gmail.com" class="text-gold hover:text-gold-light">pokerdealshub@gmail.com</a><br>
                  Telegram: <a href="https://t.me/pokerdealshub" class="text-gold hover:text-gold-light" target="_blank" rel="noopener noreferrer">@PokerDealsHub</a>
                </p>
              </div>
            </div>
