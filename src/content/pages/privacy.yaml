  de:
    title: Datenschutzerklärung
    description: "Datenschutzerklärung von PokerDealsHub: Datennutzung, Cookies und Schutz von Informationen"
    body: |-
      <div class="prose prose-invert max-w-none">
              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <p class="text-neutral-300 mb-4">
                  Zuletzt aktualisiert: 19. Oktober 2025
                </p>
                <p class="text-neutral-300">
                  PokerDealsHub („wir“, „unser“, „uns“) ist dem Schutz der Privatsphäre der Besucher unserer Website verpflichtet. Diese Erklärung beschreibt, wie wir Ihre Informationen erheben, nutzen und schützen.
                </p>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gold mb-4">1. Informationen, die wir erheben</h2>
                <p class="text-neutral-300 mb-3">Wir können die folgenden Arten von Informationen erheben:</p>
                <ul class="list-disc ml-6 text-neutral-300 space-y-2">
                  <li>Informationen, die Sie bei der Kontaktaufnahme angeben (Name, E-Mail, Kontaktdaten)</li>
                  <li>Technische Daten (IP-Adresse, Browsertyp, Betriebssystem)</li>
                  <li>Daten zur Interaktion mit der Website (besuchte Seiten, Verweildauer auf der Seite)</li>
                  <li>Cookies und ähnliche Tracking-Technologien</li>
                </ul>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gold mb-4">2. Nutzung der Informationen</h2>
                <p class="text-neutral-300 mb-3">Wir verwenden die erhobenen Informationen, um:</p>
                <ul class="list-disc ml-6 text-neutral-300 space-y-2">
                  <li>unsere Dienste bereitzustellen und zu verbessern</li>
                  <li>Sie zu Fragen der Zusammenarbeit zu kontaktieren</li>
                  <li>die Nutzung der Website zu analysieren und die Funktionalität zu optimieren</li>
                  <li>die Sicherheit der Website zu gewährleisten</li>
                </ul>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gold mb-4">3. Verwendung von Cookies</h2>
                <p class="text-neutral-300 mb-3">
                  Die Website verwendet Cookies, um den Betrieb der Website zu verbessern, den Traffic zu analysieren und Ihre Einstellungen zu speichern. Sie können Cookies über die Einstellungen Ihres Browsers verwalten. Wir verwenden:
                </p>
                <ul class="list-disc ml-6 text-neutral-300 space-y-2">
                  <li>Analytische Cookies, um das Nutzerverhalten zu verstehen</li>
                  <li>Funktionale Cookies, um Ihre Einstellungen zu speichern (z. B. die Sprache)</li>
                </ul>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gold mb-4">4. Weitergabe von Daten an Dritte</h2>
                <p class="text-neutral-300">
                  Wir verkaufen oder geben Ihre personenbezogenen Daten nicht an Dritte weiter, außer wenn dies zur Erbringung von Diensten erforderlich ist (z. B. Analysedienste) oder gesetzlich vorgeschrieben ist.
                </p>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gold mb-4">5. Datensicherheit</h2>
                <p class="text-neutral-300">
                  Wir treffen angemessene Maßnahmen, um Ihre Informationen vor unbefugtem Zugriff, Veränderung, Offenlegung oder Zerstörung zu schützen.
                </p>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gold mb-4">6. Ihre Rechte</h2>
                <p class="text-neutral-300 mb-3">Sie haben das Recht:</p>
                <ul class="list-disc ml-6 text-neutral-300 space-y-2">
                  <li>Auskunft über Ihre personenbezogenen Daten zu verlangen</li>
                  <li>die Berichtigung unrichtiger Informationen zu verlangen</li>
                  <li>die Löschung Ihrer Informationen zu verlangen</li>
                  <li>Ihre Einwilligung in die Datenverarbeitung zu widerrufen</li>
                </ul>
              </div>

              <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8">
                <h2 class="text-2xl font-semibold text-gold mb-4">7. Kontakt</h2>
                <p class="text-neutral-300 mb-3">
                  Wenn Sie Fragen zu unserer Datenschutzerklärung haben, kontaktieren Sie uns:
                </p>
                <p class="text-neutral-300">
                  Email: <a href="mailto:pokerdealshub@gmail.com" class="text-gold hover:text-gold-light">pokerdealshub@gmail.com</a><br>
                  Telegram: <a href="https://t.me/pokerdealshub" class="text-gold hover:text-gold-light" target="_blank" rel="noopener noreferrer">@PokerDealsHub</a>
                </p>
              </div>
            </div>
