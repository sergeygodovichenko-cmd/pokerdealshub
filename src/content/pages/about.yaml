order: 1
title: О проекте PokerDealsHub
description: PokerDealsHub — независимая витрина покерных сделок, объединяющая централизованные и децентрализованные предложения
body: |-
  <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 mb-8">
          <p class="text-neutral-300 text-lg leading-relaxed mb-6">
            PokerDealsHub — это независимая витрина покерных сделок, объединяющая централизованные и децентрализованные предложения для игроков и агентов по всему миру.
          </p>

          <h2 class="text-2xl font-semibold text-gold mb-4">Наши принципы</h2>
          <ul class="space-y-3 text-neutral-300">
            <li class="flex items-start">
              <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
              <span><strong class="text-neutral-100">Проверенные сделки:</strong> Все предложения проходят проверку перед публикацией</span>
            </li>
            <li class="flex items-start">
              <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
              <span><strong class="text-neutral-100">Прозрачные условия:</strong> Полная информация о рейкбэке и условиях</span>
            </li>
            <li class="flex items-start">
              <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
              <span><strong class="text-neutral-100">Международный подход:</strong> Сделки для игроков из всех регионов мира</span>
            </li>
            <li class="flex items-start">
              <svg class="w-6 h-6 text-gold mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
              <span><strong class="text-neutral-100">Открытость к партнёрствам:</strong> Работаем с клубами и союзами напрямую</span>
            </li>
          </ul>
        </div>

        <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8">
          <h2 class="text-2xl font-semibold text-gold mb-6">Контакты</h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <a
              href="https://t.me/pdh_support_bot"
              target="_blank"
              rel="noopener noreferrer"
              class="flex items-center gap-4 p-4 bg-neutral-800 rounded-lg hover:bg-neutral-700 transition-colors"
            >
              <svg class="w-8 h-8 text-gold" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.693-1.653-1.124-2.678-1.8-1.185-.781-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.244-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.001.321.023.465.141.121.099.155.232.171.326.016.093.036.306.02.472z"/>
